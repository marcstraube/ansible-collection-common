---
namespace: marcstraube
name: common
version: 2.1.0 # x-release-please-version
readme: README.md
authors:
  - Marc Straube <email@marcstraube.de>
description: >-
  42 shared Ansible roles for multi-OS infrastructure management. Covers base
  system, security hardening, networking, package management, user management,
  editors, and more. Supports Arch Linux, Debian Trixie, and Rocky Linux 9/10.
  Built for ansible-core 2.19+.
license_file: LICENSE
tags:
  - linux
  - system
  - archlinux
  - debian
  - rocky
  - security
  - hardening
  - networking
  - firewall
  - users
  - packages
repository: https://github.com/marcstraube/ansible-collection-common
documentation: https://github.com/marcstraube/ansible-collection-common
homepage: https://github.com/marcstraube/ansible-collection-common
issues: https://github.com/marcstraube/ansible-collection-common/issues
build_ignore:
  - '*.tar.gz'
  - .ansible
  - .ansible-lint
  - .claude
  - .git
  - .github
  - .gitignore
  - .gitlab-ci.yml
  - .markdownlint-cli2.yaml
  - .markdownlint.yml
  - .pre-commit-config.yaml
  - .release-please-manifest.json
  - .secrets.baseline
  - .venv
  - .yamllint
  - '*.pyc'
  - __pycache__
  - roles/*/molecule
  - version.txt
dependencies:
  community.general: '>=8.0.0'
  community.crypto: '>=2.9.0'
  ansible.posix: '>=1.5.0'
  kewlfft.aur: '>=0.11.0'
