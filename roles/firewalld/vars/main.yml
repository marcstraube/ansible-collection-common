---
__firewalld_packages:
  - 'firewalld'
__firewalld_service_name: 'firewalld'
__firewalld_config_dir: '/etc/firewalld'

# System interpreter that carries the firewall Python package of firewalld
# (firewall-cmd runs on it). Used to normalize rich rules for the purge.
__firewalld_python: '/usr/bin/python3'
