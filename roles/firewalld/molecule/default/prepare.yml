---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux:
        - systemd
        - dbus
        - procps-ng
      Debian:
        - systemd
        - dbus
        - procps
      RedHat:
        - systemd
        - dbus
        - procps-ng

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5

    - name: Prepare | Start dbus
      ansible.builtin.systemd_service:
        name: dbus
        state: started
      failed_when: false

    # Debian containers need polkitd installed and dbus restarted
    # before firewalld can acquire its D-Bus name
    - name: Prepare | Install polkitd (Debian)
      ansible.builtin.apt:
        name:
          - polkitd
        state: present
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Create polkit rules directories (Debian)
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /run/polkit-1/rules.d
        - /usr/local/share/polkit-1/rules.d
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Restart dbus to clear stale activation state (Debian)
      ansible.builtin.systemd_service:
        name: dbus
        state: restarted
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Start polkit (Debian)
      ansible.builtin.systemd_service:
        name: polkit
        state: started
      when: ansible_facts['os_family'] == 'Debian'

    #
    # Purge Test State
    #

    # The role purges unconfigured ports and rich rules from managed zones.
    # Seed the public zone with an extra port and an extra rich rule before
    # the role runs. firewall-offline-cmd writes the permanent configuration
    # without the daemon, which the role starts itself.
    - name: Prepare | Install firewalld for the purge test state
      ansible.builtin.package:
        name: firewalld
        state: present
      retries: 3
      delay: 5

    - name: Prepare | Open an unconfigured port in the public zone
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --zone=public
          - --add-port=9999/tcp
      changed_when: true

    - name: Prepare | Add an unconfigured rich rule to the public zone
      ansible.builtin.command:
        argv:
          - firewall-offline-cmd
          - --zone=public
          - --add-rich-rule=rule family="ipv4" source address="203.0.113.0/24" port port="2222" protocol="tcp" accept
      changed_when: true

    #
    # Custom nftables Table Test State
    #

    - name: Prepare | Create custom nftables table directory
      ansible.builtin.file:
        path: /etc/firewalld/nftables.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    # A table file the role wrote for an earlier configuration (it starts with
    # the ansible_managed header), loaded into the ruleset. The role must
    # delete the table and remove the file.
    - name: Prepare | Write a stale role-owned custom nftables table file
      ansible.builtin.copy:
        dest: /etc/firewalld/nftables.d/inet-molecule_stale.nft
        content: |
          {{ ansible_managed | default('Ansible managed') | comment }}
          table inet molecule_stale {
            chain input {
              type filter hook input priority 0; policy accept;
            }
          }
        owner: root
        group: root
        mode: '0644'

    # A file placed by hand (no ansible_managed header). The role must leave
    # it in place.
    - name: Prepare | Write a hand-made custom nftables table file
      ansible.builtin.copy:
        dest: /etc/firewalld/nftables.d/inet-molecule_handmade.nft
        content: |
          table inet molecule_handmade {
            chain input {
              type filter hook input priority 0; policy accept;
            }
          }
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Load the stale and hand-made custom nftables tables
      ansible.builtin.command:
        argv:
          - nft
          - -f
          - '{{ item }}'
      loop:
        - /etc/firewalld/nftables.d/inet-molecule_stale.nft
        - /etc/firewalld/nftables.d/inet-molecule_handmade.nft
      changed_when: true

    # A table loaded by another tool, without a file. Configuring a table of
    # the same name must fail (converge.yml).
    - name: Prepare | Load a foreign nftables table
      ansible.builtin.command:
        argv:
          - nft
          - add
          - table
          - inet
          - molecule_foreign
      changed_when: true
