---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    firewalld_enabled: true
    firewalld_default_zone: 'public'
    firewalld_log_denied: 'all'
    firewalld_purge_services: true
    firewalld_purge_ports: true
    firewalld_purge_rich_rules: true
    firewalld_services:
      - 'ssh'
      - 'http'
      # Custom service defined below — must be usable in the same run
      - 'myapp'
    firewalld_services_disabled:
      - 'cockpit'
    firewalld_ports:
      - '8080/tcp'
    # Written in a different attribute order than firewalld lists it, so the
    # rich rule purge must compare the normalized form to stay idempotent
    firewalld_rich_rules:
      - rule: 'rule service name="https" source address="10.0.0.0/8" family="ipv4" accept'
    # Custom zone created by the zones phase ahead of the full role
    firewalld_zones:
      - name: 'appzone'
        target: 'DROP'
    firewalld_sources:
      - zone: 'trusted'
        source: '192.168.1.0/24'
    firewalld_custom_services:
      - name: 'myapp'
        short: 'My Application'
        description: 'Custom test service'
        ports:
          - port: '9000'
            protocol: 'tcp'
          - port: '9001'
            protocol: 'tcp'
        source_ports:
          - port: '1234'
            protocol: 'udp'
    # Rule from the interim mitigation in RHSB-2026-016; prepare.yml seeds a
    # stale table that the role must remove
    firewalld_nftables_tables:
      - name: 'molecule_block'
        family: 'inet'
        chains:
          - name: 'input'
            hook: 'input'
            priority: -310
            rules:
              - 'ip protocol tcp ip hdrlength > 5 counter drop'

  tasks:
    # Mirrors base_system.yml: the zones phase runs on its own before the
    # networkmanager role binds connections to zones.
    - name: Converge | Include firewalld zones phase  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: zones.yml

    - name: Converge | Check custom zone is available at runtime after the zones phase
      ansible.builtin.command:
        cmd: firewall-cmd --get-zones
      register: __converge_runtime_zones
      changed_when: false
      failed_when: "'appzone' not in __converge_runtime_zones.stdout.split()"

    - name: Converge | Include firewalld role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    # prepare.yml loads inet molecule_foreign without the role. Configuring a
    # table of the same name must fail before anything is written.
    - name: Converge | Configure a table name taken by a foreign table
      block:
        - name: Converge | Include firewalld nftables tasks with a colliding table  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'
            tasks_from: nftables.yml
          vars:
            firewalld_nftables_tables:
              - name: 'molecule_foreign'
                family: 'inet'
                chains:
                  - name: 'input'
                    hook: 'input'
                    priority: 0

        - name: Converge | Fail because the colliding table was accepted
          ansible.builtin.fail:
            msg: 'The role accepted a table name taken by a foreign table.'
      rescue:
        - name: Converge | Assert the collision check stopped the run
          ansible.builtin.assert:
            that:
              - "'collide with foreign' in ansible_failed_task.name"
            fail_msg: 'Unexpected failure: {{ ansible_failed_result }}'
