---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    #
    # Package and Service
    #

    - name: Verify | Check firewalld package is installed
      ansible.builtin.package:
        name: firewalld
        state: present
      check_mode: true
      register: __verify_pkg
      failed_when: __verify_pkg.changed

    - name: Verify | Check firewalld service is running
      ansible.builtin.systemd_service:
        name: firewalld
      register: __verify_svc
      failed_when: __verify_svc.status.ActiveState != 'active'

    - name: Verify | Check firewalld service is enabled
      ansible.builtin.systemd_service:
        name: firewalld
      register: __verify_svc_enabled
      failed_when: __verify_svc_enabled.status.UnitFileState != 'enabled'

    #
    # firewalld.conf
    #

    - name: Verify | Check firewalld.conf exists
      ansible.builtin.stat:
        path: /etc/firewalld/firewalld.conf
      register: __verify_conf
      failed_when: not __verify_conf.stat.exists

    - name: Verify | Check firewalld.conf contains ansible_managed
      ansible.builtin.command:
        cmd: grep -c 'Ansible managed' /etc/firewalld/firewalld.conf
      register: __verify_conf_managed
      changed_when: false
      failed_when: __verify_conf_managed.rc != 0

    - name: Verify | Check LogDenied setting in config
      ansible.builtin.command:
        cmd: grep -c 'LogDenied=all' /etc/firewalld/firewalld.conf
      register: __verify_conf_log
      changed_when: false
      failed_when: __verify_conf_log.rc != 0

    #
    # Default Zone
    #

    - name: Verify | Check default zone is public
      ansible.builtin.command:
        cmd: firewall-cmd --get-default-zone
      register: __verify_zone
      changed_when: false
      failed_when: __verify_zone.stdout != 'public'

    #
    # Services
    #

    - name: Verify | Check SSH service is enabled
      ansible.builtin.command:
        cmd: firewall-cmd --query-service=ssh
      register: __verify_ssh
      changed_when: false
      failed_when: __verify_ssh.rc != 0

    - name: Verify | Check HTTP service is enabled
      ansible.builtin.command:
        cmd: firewall-cmd --query-service=http
      register: __verify_http
      changed_when: false
      failed_when: __verify_http.rc != 0

    #
    # Ports
    #

    - name: Verify | Check port 8080/tcp is open
      ansible.builtin.command:
        cmd: firewall-cmd --query-port=8080/tcp
      register: __verify_port
      changed_when: false
      failed_when: __verify_port.rc != 0

    #
    # Rich Rules
    #

    - name: Verify | Check rich rule is active
      ansible.builtin.command:
        cmd: firewall-cmd --list-rich-rules
      register: __verify_rich
      changed_when: false
      failed_when: "'10.0.0.0/8' not in __verify_rich.stdout"

    #
    # Zones
    #

    - name: Verify | Check custom zone exists (permanent)
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --get-zones
      register: __verify_zones
      changed_when: false
      failed_when: "'appzone' not in __verify_zones.stdout.split()"

    - name: Verify | Check custom zone target
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --zone=appzone --get-target
      register: __verify_zone_target
      changed_when: false
      failed_when: __verify_zone_target.stdout | trim != 'DROP'

    #
    # Sources
    #

    - name: Verify | Check source is assigned to trusted zone
      ansible.builtin.command:
        cmd: firewall-cmd --zone=trusted --list-sources
      register: __verify_source
      changed_when: false
      failed_when: "'192.168.1.0/24' not in __verify_source.stdout"

    #
    # Custom Services
    #

    - name: Verify | Check custom service file exists
      ansible.builtin.stat:
        path: /etc/firewalld/services/myapp.xml
      register: __verify_custom_svc
      failed_when: not __verify_custom_svc.stat.exists

    - name: Verify | Check custom service file contains ansible_managed
      ansible.builtin.command:
        cmd: grep -c 'Ansible managed' /etc/firewalld/services/myapp.xml
      register: __verify_custom_managed
      changed_when: false
      failed_when: __verify_custom_managed.rc != 0

    - name: Verify | Check custom service XML contains source-port
      ansible.builtin.command:
        cmd: grep -c 'source-port' /etc/firewalld/services/myapp.xml
      register: __verify_custom_srcport
      changed_when: false
      failed_when: __verify_custom_srcport.rc != 0

    - name: Verify | Check custom service is enabled in public zone (runtime)
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --query-service=myapp
      register: __verify_custom_runtime
      changed_when: false
      failed_when: __verify_custom_runtime.rc != 0

    - name: Verify | Check custom service is enabled in public zone (permanent)
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --query-service=myapp --permanent
      register: __verify_custom_permanent
      changed_when: false
      failed_when: __verify_custom_permanent.rc != 0

    #
    # Purge
    #

    - name: Verify | Get public zone services
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-services --permanent
      register: __verify_purge
      changed_when: false

    - name: Verify | Assert only configured services remain after purge
      ansible.builtin.assert:
        that:
          - "'ssh' in __verify_purge.stdout.split()"
          - "'http' in __verify_purge.stdout.split()"
          - "'myapp' in __verify_purge.stdout.split()"
          - "'dhcpv6-client' not in __verify_purge.stdout.split()"
        fail_msg: >-
          Public zone has unexpected services: {{ __verify_purge.stdout }}.
          Expected only ssh, http and myapp after purge.

    - name: Verify | Get public zone ports
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-ports --permanent
      register: __verify_purge_ports
      changed_when: false

    - name: Verify | Assert only configured ports remain after purge
      ansible.builtin.assert:
        that:
          - __verify_purge_ports.stdout.split() == ['8080/tcp']
        fail_msg: >-
          Public zone has unexpected ports: {{ __verify_purge_ports.stdout }}.
          Expected only 8080/tcp after purge.

    - name: Verify | Check purged port is closed at runtime
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --query-port=9999/tcp
      register: __verify_purge_port_runtime
      changed_when: false
      failed_when: __verify_purge_port_runtime.rc == 0

    - name: Verify | Get public zone rich rules
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-rich-rules --permanent
      register: __verify_purge_rich
      changed_when: false

    - name: Verify | Assert only the configured rich rule remains after purge
      ansible.builtin.assert:
        that:
          - __verify_purge_rich.stdout_lines | length == 1
          - "'10.0.0.0/8' in __verify_purge_rich.stdout"
          - "'203.0.113.0/24' not in __verify_purge_rich.stdout"
        fail_msg: >-
          Public zone has unexpected rich rules: {{ __verify_purge_rich.stdout }}.
          Expected only the 10.0.0.0/8 rule after purge.

    - name: Verify | Check purged rich rule is removed at runtime
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-rich-rules
      register: __verify_purge_rich_runtime
      changed_when: false
      failed_when: "'203.0.113.0/24' in __verify_purge_rich_runtime.stdout"

    #
    # Custom nftables Tables
    #

    - name: Verify | Check custom nftables table file exists
      ansible.builtin.stat:
        path: /etc/firewalld/nftables.d/inet-molecule_block.nft
      register: __verify_nft_file
      failed_when: not __verify_nft_file.stat.exists

    - name: Verify | Check firewalld nftables service is active and enabled
      ansible.builtin.systemd_service:
        name: firewalld-nftables
      register: __verify_nft_svc
      failed_when: >-
        __verify_nft_svc.status.ActiveState != 'active'
        or __verify_nft_svc.status.UnitFileState != 'enabled'

    - name: Verify | Get custom nftables table
      ansible.builtin.command:
        cmd: nft --numeric-priority list table inet molecule_block
      register: __verify_nft_table
      changed_when: false

    - name: Verify | Assert custom nftables table carries the configured chain and rule
      ansible.builtin.assert:
        that:
          - "'hook input priority -310' in __verify_nft_table.stdout"
          - "'ip hdrlength > 5' in __verify_nft_table.stdout"
          - "'drop' in __verify_nft_table.stdout"
        fail_msg: 'Unexpected table content: {{ __verify_nft_table.stdout }}'

    - name: Verify | Check custom nftables table is loaded exactly once
      ansible.builtin.command:
        cmd: nft list tables
      register: __verify_nft_tables
      changed_when: false
      failed_when: >-
        __verify_nft_tables.stdout_lines
        | select('equalto', 'table inet molecule_block') | list | length != 1

    - name: Verify | Check stale custom nftables table is deleted
      ansible.builtin.assert:
        that:
          - "'table inet molecule_stale' not in __verify_nft_tables.stdout_lines"
        fail_msg: 'Stale table still loaded: {{ __verify_nft_tables.stdout }}'

    - name: Verify | Check stale custom nftables table file is removed
      ansible.builtin.stat:
        path: /etc/firewalld/nftables.d/inet-molecule_stale.nft
      register: __verify_nft_stale_file
      failed_when: __verify_nft_stale_file.stat.exists

    - name: Verify | Check hand-made custom nftables table file is left in place
      ansible.builtin.stat:
        path: /etc/firewalld/nftables.d/inet-molecule_handmade.nft
      register: __verify_nft_handmade_file
      failed_when: not __verify_nft_handmade_file.stat.exists

    - name: Verify | Check hand-made and foreign tables are still loaded
      ansible.builtin.assert:
        that:
          - "'table inet molecule_handmade' in __verify_nft_tables.stdout_lines"
          - "'table inet molecule_foreign' in __verify_nft_tables.stdout_lines"
        fail_msg: 'Foreign table removed: {{ __verify_nft_tables.stdout }}'

    - name: Verify | Check the colliding table wrote no file
      ansible.builtin.stat:
        path: /etc/firewalld/nftables.d/inet-molecule_foreign.nft
      register: __verify_nft_foreign_file
      failed_when: __verify_nft_foreign_file.stat.exists

    - name: Verify | Read custom nftables main file
      ansible.builtin.slurp:
        src: /etc/firewalld/nftables.conf
      register: __verify_nft_main

    - name: Verify | Assert main file includes only the configured table
      ansible.builtin.assert:
        that:
          - "'inet-molecule_block.nft' in (__verify_nft_main.content | b64decode)"
          - "'molecule_handmade' not in (__verify_nft_main.content | b64decode)"
        fail_msg: 'Unexpected main file: {{ __verify_nft_main.content | b64decode }}'

    - name: Verify | Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: false

    - name: Verify | Check custom nftables table survives a firewalld reload
      ansible.builtin.command:
        cmd: nft list table inet molecule_block
      register: __verify_nft_after_reload
      changed_when: false
      failed_when: "'ip hdrlength > 5' not in __verify_nft_after_reload.stdout"

    - name: Verify | Restart firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: restarted
      changed_when: false

    - name: Verify | Check custom nftables table survives a firewalld restart
      ansible.builtin.command:
        cmd: nft list table inet molecule_block
      register: __verify_nft_after_restart
      changed_when: false
      failed_when: "'ip hdrlength > 5' not in __verify_nft_after_restart.stdout"

    - name: Verify | Restart firewalld nftables service as at boot
      ansible.builtin.systemd_service:
        name: firewalld-nftables
        state: restarted
      changed_when: false

    - name: Verify | Check custom nftables table is still loaded exactly once after the restart
      ansible.builtin.command:
        cmd: nft list tables
      register: __verify_nft_tables_after
      changed_when: false
      failed_when: >-
        __verify_nft_tables_after.stdout_lines
        | select('equalto', 'table inet molecule_block') | list | length != 1

    #
    # Version-Conditional Checks (firewalld 2.x+)
    #

    - name: Verify | Get firewalld version
      ansible.builtin.command:
        cmd: firewall-cmd --version
      register: __verify_version
      changed_when: false

    - name: Verify | Check 2.x-only directives present in config
      ansible.builtin.command:
        cmd: grep -c 'NftablesCounters' /etc/firewalld/firewalld.conf
      register: __verify_nft_counters
      changed_when: false
      failed_when: __verify_nft_counters.rc != 0
      when: (__verify_version.stdout | trim) is version('2.0.0', '>=')

    - name: Verify | Check 2.x-only directives absent on 1.x
      ansible.builtin.command:
        cmd: grep -c 'NftablesCounters' /etc/firewalld/firewalld.conf
      register: __verify_no_nft_counters
      changed_when: false
      failed_when: __verify_no_nft_counters.rc == 0
      when: (__verify_version.stdout | trim) is version('2.0.0', '<')
