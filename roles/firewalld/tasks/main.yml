---
- name: Main | Import zone tasks
  ansible.builtin.import_tasks: zones.yml
  when: firewalld_enabled | bool
  tags:
    - firewalld
    - firewalld:zones

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: firewalld_enabled | bool
  tags:
    - firewalld
    - firewalld:configure

- name: Main | Include purge services tasks
  ansible.builtin.include_tasks:
    file: purge_services.yml
    apply:
      tags:
        - firewalld
        - firewalld:purge
  when:
    - firewalld_enabled | bool
    - firewalld_purge_services | bool
  tags:
    - firewalld
    - firewalld:purge

- name: Main | Include purge ports tasks
  ansible.builtin.include_tasks:
    file: purge_ports.yml
    apply:
      tags:
        - firewalld
        - firewalld:purge
  when:
    - firewalld_enabled | bool
    - firewalld_purge_ports | bool
  tags:
    - firewalld
    - firewalld:purge

- name: Main | Include purge rich rules tasks
  ansible.builtin.include_tasks:
    file: purge_rich_rules.yml
    apply:
      tags:
        - firewalld
        - firewalld:purge
  when:
    - firewalld_enabled | bool
    - firewalld_purge_rich_rules | bool
  tags:
    - firewalld
    - firewalld:purge

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: firewalld_enabled | bool
  tags:
    - firewalld
    - firewalld:service
