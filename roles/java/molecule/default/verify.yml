---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify | Run java and javac
      ansible.builtin.command: '{{ item }}'
      loop:
        - java -version
        - javac -version
      register: __java_binaries
      changed_when: false

    # java prints its version to stderr, javac to stdout
    - name: Verify | Assert the JDK 25 is the default
      ansible.builtin.assert:
        that:
          - "'openjdk version \"25' in __java_binaries.results[0].stderr"
          - "'javac 25' in __java_binaries.results[1].stdout"
        fail_msg: 'java or javac do not report OpenJDK 25'

    - name: Verify | Read the default Java environment (Arch)
      ansible.builtin.command: archlinux-java get
      register: __java_environment_check
      changed_when: false
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Assert the Arch default environment is JDK 25
      ansible.builtin.assert:
        that:
          - __java_environment_check.stdout | trim == 'java-25-openjdk'
        fail_msg: 'archlinux-java does not point at java-25-openjdk'
      when: ansible_facts['os_family'] == 'Archlinux'
