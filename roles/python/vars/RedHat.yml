---
# python3-packaging: the ansible-core pip module imports `packaging` on the
# target interpreter — declared explicitly so roles using the pip module do
# not depend on it being pulled in incidentally across EL point releases.
__python_packages:
  - 'python3'
  - 'python3-packaging'

__python_pip_packages:
  - 'python3-pip'

__python_pipx_packages:
  - 'pipx'

# ruff and uv come from EPEL 10, python3-pytest from CRB (package_management:
# dnf_powertools_enabled); bandit is not packaged
__python_tooling_packages:
  ruff: 'ruff'
  uv: 'uv'
  pytest: 'python3-pytest'
  bandit: ''
