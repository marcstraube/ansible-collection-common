---
# python3-packaging: the ansible-core pip module imports `packaging` on the
# target interpreter (/usr/bin/python3 = 3.9 on EL9) — declared explicitly so
# the role does not rely on it being pulled in incidentally, which varies
# between EL9 point releases (present on 9.7, absent on a minimal 9.8).
__python_packages:
  - 'python3'
  - 'python3-packaging'
  - 'python3.12'

__python_pip_packages:
  - 'python3.12-pip'

__python_pipx_packages: []

__python_bootstrap_pipx: true

__python_venv_command: 'python3.12 -m venv'

# ruff, uv and bandit are not packaged for EL 9
__python_tooling_packages:
  ruff: ''
  uv: ''
  pytest: 'python3-pytest'
  bandit: ''

# system pipx is too old, the role bootstraps one in a venv
__python_pipx_executable: '/opt/pipx-bootstrap/bin/pipx'
