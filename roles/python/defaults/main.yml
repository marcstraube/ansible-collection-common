---
#
# Role Control
#

# Enable the python role
python_enabled: true

#
# Python Settings
#

# Enable pipx for user-level Python tool management
python_pipx_enabled: true

# Optional HTTP(S) proxy for pip — applied as HTTPS_PROXY/HTTP_PROXY env
# vars on the pipx bootstrap pip task. Required in networks that have no
# direct DNS/internet access to PyPI. Empty (default) = no proxy.
python_pip_proxy: ''

# Additional OS packages to install (e.g., python3-dev, python3-lxml)
python_extra_packages: []

#
# Python Tooling
#

# ruff — linter and formatter (Arch Linux, EL 10; not packaged for Debian
# Trixie and EL 9)
python_ruff_enabled: false

# uv — package installer and resolver (Arch Linux, EL 10; not packaged for
# Debian Trixie and EL 9)
python_uv_enabled: false

# pytest — test framework
python_pytest_enabled: false

# bandit — security linter for Python code (Arch Linux, Debian)
python_bandit_enabled: false

# Tools installed system-wide through pipx --global on Debian and EL for
# packages the distribution does not ship (Arch Linux installs distribution
# packages instead and skips this list)
python_pipx_tools: []
# Example:
#   python_pipx_tools:
#     - 'black'
#     - 'mypy'
