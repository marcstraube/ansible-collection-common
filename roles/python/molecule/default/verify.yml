---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    #
    # Python Version Check
    #

    - name: Verify | Check Python version
      ansible.builtin.command: python3 --version
      register: python3_version
      changed_when: false

    - name: Verify | Debug Python version
      ansible.builtin.debug:
        var: python3_version.stdout

    - name: Verify | Assert Python 3 is installed
      ansible.builtin.assert:
        that:
          - python3_version.rc == 0
          - "'Python 3.' in python3_version.stdout"
        fail_msg: 'Python 3 is not installed or not working'

    #
    # Rocky 9 — Additional python3.12 Check
    #

    - name: Verify | Check python3.12 version (Rocky 9)
      ansible.builtin.command: python3.12 --version
      register: python312_version
      changed_when: false
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    - name: Verify | Assert python3.12 is installed (Rocky 9)
      ansible.builtin.assert:
        that:
          - python312_version.rc == 0
          - "'Python 3.12' in python312_version.stdout"
        fail_msg: 'Python 3.12 is not installed on Rocky 9'
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    #
    # pip Check
    #

    - name: Verify | Check pip version
      ansible.builtin.command: pip3 --version
      register: pip3_version
      changed_when: false
      failed_when: false

    - name: Verify | Check pip3.12 version (Rocky 9 fallback)
      ansible.builtin.command: pip3.12 --version
      register: pip312_version
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    - name: Verify | Set pip check result
      ansible.builtin.set_fact:
        pip_available: >-
          {{ (pip3_version.rc | default(1) == 0) or
             (pip312_version.rc | default(1) == 0) }}

    - name: Verify | Assert pip is installed
      ansible.builtin.assert:
        that:
          - pip_available | bool
        fail_msg: 'pip is not installed'

    #
    # pipx Check
    #

    - name: Verify | Check system pipx version (Arch/Debian/Rocky 10+)
      ansible.builtin.command: pipx --version
      register: system_pipx_version
      changed_when: false
      failed_when: false
      when: not (ansible_facts['distribution'] == 'Rocky' and
                 ansible_facts['distribution_major_version'] == '9')

    - name: Verify | Assert system pipx is installed (Arch/Debian/Rocky 10+)
      ansible.builtin.assert:
        that:
          - system_pipx_version.rc == 0
        fail_msg: 'System pipx is not installed'
      when: not (ansible_facts['distribution'] == 'Rocky' and
                 ansible_facts['distribution_major_version'] == '9')

    - name: Verify | Check bootstrap pipx version (Rocky 9)
      ansible.builtin.command: /opt/pipx-bootstrap/bin/pipx --version
      register: bootstrap_pipx_version
      changed_when: false
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    - name: Verify | Debug bootstrap pipx version (Rocky 9)
      ansible.builtin.debug:
        var: bootstrap_pipx_version.stdout
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    - name: Verify | Assert bootstrap pipx is installed (Rocky 9)
      ansible.builtin.assert:
        that:
          - bootstrap_pipx_version.rc == 0
        fail_msg: 'Bootstrap pipx is not installed at /opt/pipx-bootstrap/bin/pipx'
      when:
        - ansible_facts['distribution'] == 'Rocky'
        - ansible_facts['distribution_major_version'] == '9'

    #
    # Python Tooling
    #

    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '{{ playbook_dir }}/../../vars'

    - name: Verify | Run the packaged Python tools
      ansible.builtin.command: '{{ item.cmd }}'
      loop:
        - { cmd: 'ruff --version', pkg: '{{ __python_tooling_packages.ruff }}' }
        - { cmd: 'uv --version', pkg: '{{ __python_tooling_packages.uv }}' }
        - { cmd: 'bandit --version', pkg: '{{ __python_tooling_packages.bandit }}' }
      loop_control:
        label: '{{ item.cmd }}'
      register: __python_tooling_binaries
      changed_when: false
      when: item.pkg | length > 0

    - name: Verify | Assert the packaged Python tools run
      ansible.builtin.assert:
        that:
          - >-
            __python_tooling_binaries.results | rejectattr('skipped', 'defined')
            | map(attribute='rc') | select('ne', 0) | list | length == 0
        fail_msg: 'a packaged Python tool is missing or does not run'

    - name: Verify | Check pytest package is installed
      ansible.builtin.package:
        name: '{{ __python_tooling_packages.pytest }}'
        state: present
      check_mode: true
      register: __python_pytest_check
      failed_when: __python_pytest_check.changed
