---
#
# ble.sh (Bash Line Editor) Shell Initialization
#
# Adds `source /usr/share/blesh/ble.sh` to the per-user `.bashrc`
# via blockinfile. ble.sh is bash-only and packaged only on Arch
# (AUR: blesh / blesh-git); on other distros this play is gated
# off by the package guard in tasks/main.yml.
#
# Honours `shell_user_config_mode`:
#
#   managed  — reconcile the marker block on every run (Ansible wins)
#   initial  — write the block only when `.bashrc` does not already
#              carry this role's marker; an existing block is left as
#              the user last edited it
#   disabled — skip entirely
#
# ble.sh provides its own preexec/precmd hooks, so it can replace
# bash-preexec as the dependency for atuin's bash integration.
# Init line order in `.bashrc`: bash-preexec → ble.sh → atuin.
#

- name: BleshInit | Get users to configure
  ansible.builtin.set_fact:
    __shell_blesh_init_users: >-
      {{ shell_users if shell_users | length > 0
         else (users_list | default([]) | map(attribute='name') | list) }}

# `initial` gates on the marker rather than on `.bashrc` itself: the
# file ships with every distribution, so its mere existence says
# nothing about whether this role has written to it.
- name: BleshInit | Read .bashrc for marker detection
  ansible.builtin.slurp:
    src: '/home/{{ item }}/.bashrc'
  loop: '{{ __shell_blesh_init_users }}'
  loop_control:
    label: '{{ item }}'
  register: __shell_blesh_rc_content
  failed_when: false
  when: shell_user_config_mode == 'initial'

- name: BleshInit | Build per-user deploy decision
  ansible.builtin.set_fact:
    __shell_blesh_should_deploy: >-
      {% set marker = '# BEGIN ANSIBLE MANAGED — ble.sh init' -%}
      {% set result = {} -%}
      {% for entry in __shell_blesh_rc_content.results | default([]) -%}
        {% set present = entry.content is defined
                         and marker in (entry.content | b64decode) -%}
        {% set _ = result.update({entry.item: not present}) -%}
      {%- endfor -%}
      {{ result }}
  when: shell_user_config_mode == 'initial'

- name: BleshInit | Add bash init line
  ansible.builtin.blockinfile:
    path: '/home/{{ item }}/.bashrc'
    block: 'source /usr/share/blesh/ble.sh'
    marker: '# {mark} ANSIBLE MANAGED — ble.sh init'
    create: true
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: '{{ __shell_blesh_init_users }}'
  loop_control:
    label: '{{ item }}'
  when:
    - shell_user_config_mode != 'disabled'
    - >-
      shell_user_config_mode == 'managed'
      or __shell_blesh_should_deploy[item] | default(true)
