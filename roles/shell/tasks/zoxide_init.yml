---
#
# Zoxide Shell Initialization
#
# Adds `eval "$(zoxide init <shell>)"` (or fish equivalent) to the
# per-user shell rc file via blockinfile. The zoxide package
# install happens in install.yml; this file wires the init line so
# the tool is actually usable.
#
# Honours `shell_user_config_mode`:
#
#   managed  — reconcile the marker block on every run (Ansible wins)
#   initial  — write the block only when the rc file does not already
#              carry this role's marker; an existing block is left as
#              the user last edited it
#   disabled — skip entirely
#
# zsh handling: when `shell_zsh_framework == 'ohmyzsh'`, the
# ohmyzsh.zshrc.j2 template already includes the zoxide init line.
# Skip the zsh init task in that case to avoid duplication.
#

- name: ZoxideInit | Get users to configure
  ansible.builtin.set_fact:
    __shell_zoxide_init_users: >-
      {{ shell_users if shell_users | length > 0
         else (users_list | default([]) | map(attribute='name') | list) }}

# `initial` gates on the marker rather than on the rc file itself:
# `.bashrc` and friends ship with every distribution, so their mere
# existence says nothing about whether this role has written to them.
- name: ZoxideInit | Read rc files for marker detection
  ansible.builtin.slurp:
    src: '/home/{{ item.0 }}/{{ item.1.file }}'
  loop: >-
    {{ __shell_zoxide_init_users
       | product([{'shell': 'bash', 'file': '.bashrc'},
                  {'shell': 'zsh', 'file': '.zshrc'},
                  {'shell': 'fish', 'file': '.config/fish/config.fish'}])
       | list }}
  loop_control:
    label: '{{ item.0 }}: {{ item.1.file }}'
  register: __shell_zoxide_rc_content
  failed_when: false
  when: shell_user_config_mode == 'initial'

- name: ZoxideInit | Build per-user deploy decision
  ansible.builtin.set_fact:
    __shell_zoxide_should_deploy: >-
      {% set marker = '# BEGIN ANSIBLE MANAGED — zoxide init' -%}
      {% set result = {} -%}
      {% for entry in __shell_zoxide_rc_content.results | default([]) -%}
        {% set present = entry.content is defined
                         and marker in (entry.content | b64decode) -%}
        {% set _ = result.update(
             {entry.item.0 ~ '|' ~ entry.item.1.shell: not present}) -%}
      {%- endfor -%}
      {{ result }}
  when: shell_user_config_mode == 'initial'

#
# bash
#

- name: ZoxideInit | Add bash init line
  ansible.builtin.blockinfile:
    path: '/home/{{ item }}/.bashrc'
    block: 'eval "$(zoxide init bash)"'
    marker: '# {mark} ANSIBLE MANAGED — zoxide init'
    create: true
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: '{{ __shell_zoxide_init_users }}'
  loop_control:
    label: '{{ item }}'
  when:
    - "'bash' in shell_zoxide_shells"
    - shell_user_config_mode != 'disabled'
    - >-
      shell_user_config_mode == 'managed'
      or __shell_zoxide_should_deploy[item ~ '|bash'] | default(true)

#
# zsh
#

- name: ZoxideInit | Add zsh init line
  ansible.builtin.blockinfile:
    path: '/home/{{ item }}/.zshrc'
    block: 'eval "$(zoxide init zsh)"'
    marker: '# {mark} ANSIBLE MANAGED — zoxide init'
    create: true
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: '{{ __shell_zoxide_init_users }}'
  loop_control:
    label: '{{ item }}'
  when:
    - "'zsh' in shell_zoxide_shells"
    - shell_zsh_framework != 'ohmyzsh'
    - shell_user_config_mode != 'disabled'
    - >-
      shell_user_config_mode == 'managed'
      or __shell_zoxide_should_deploy[item ~ '|zsh'] | default(true)

#
# fish
#

- name: ZoxideInit | Ensure fish config directory exists
  ansible.builtin.file:
    path: '/home/{{ item }}/.config/fish'
    state: directory
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0755'
  loop: '{{ __shell_zoxide_init_users }}'
  when:
    - "'fish' in shell_zoxide_shells"
    - shell_user_config_mode != 'disabled'
    - >-
      shell_user_config_mode == 'managed'
      or __shell_zoxide_should_deploy[item ~ '|fish'] | default(true)

- name: ZoxideInit | Add fish init line
  ansible.builtin.blockinfile:
    path: '/home/{{ item }}/.config/fish/config.fish'
    block: 'zoxide init fish | source'
    marker: '# {mark} ANSIBLE MANAGED — zoxide init'
    create: true
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '0644'
  loop: '{{ __shell_zoxide_init_users }}'
  loop_control:
    label: '{{ item }}'
  when:
    - "'fish' in shell_zoxide_shells"
    - shell_user_config_mode != 'disabled'
    - >-
      shell_user_config_mode == 'managed'
      or __shell_zoxide_should_deploy[item ~ '|fish'] | default(true)
