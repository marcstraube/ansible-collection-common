---
#
# Shell Main Tasks
#

# Login shells belong to the users role. Setting shell_default as login shell
# is deprecated and will be removed in v4.0.0; until then it only covers users
# without `shell:` on their users_list entry, and never root.
- name: Main | Get users for the deprecated login shell tasks
  ansible.builtin.set_fact:
    __shell_login_users: >-
      {{ (shell_users if shell_users | length > 0
          else (users_list | default([]) | map(attribute='name') | list))
         | reject('equalto', 'root')
         | reject('in', users_list | default([]) | selectattr('shell', 'defined')
                        | map(attribute='name') | list)
         | list }}
  when: shell_enabled | bool
  tags:
    - always

# The flag is set on every run so the warning below fires only while the
# deprecated path is in use.
- name: Main | Detect deprecated login shell setting
  ansible.builtin.set_fact:
    __shell_default_login_shell_deprecated: >-
      {{ shell_enabled | bool
         and shell_default != 'bash'
         and shell_user_config_mode != 'disabled'
         and __shell_login_users | default([]) | length > 0 }}
  tags:
    - always

- name: Main | Warn about login shell deprecation
  ansible.builtin.debug:
    msg: >
      Setting login shells through shell_default is DEPRECATED and will be
      removed in v4.0.0. Set shell: on users_list entries instead. See #496.
  when: __shell_default_login_shell_deprecated | bool
  tags:
    - always

- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Validate Starship preset
  ansible.builtin.assert:
    that:
      - shell_starship_preset | length == 0
        or shell_starship_preset in __shell_starship_valid_presets
    fail_msg: >-
      shell_starship_preset must be empty or one of
      {{ __shell_starship_valid_presets }}, got: '{{ shell_starship_preset }}'
  when:
    - shell_enabled | bool
    - shell_starship_enabled | bool
    - shell_starship_config_enabled | bool
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: shell_enabled | bool
  tags:
    - shell
    - shell:install

- name: Main | Import Oh My Zsh tasks
  ansible.builtin.import_tasks: ohmyzsh.yml
  when:
    - shell_enabled | bool
    - shell_zsh_enabled | bool
    - shell_zsh_framework == 'ohmyzsh'
  tags:
    - shell
    - shell:ohmyzsh

- name: Main | Import user tasks
  ansible.builtin.import_tasks: users.yml
  when:
    - shell_enabled | bool
    - shell_default != 'bash'
  tags:
    - shell
    - shell:users

- name: Main | Import Starship config tasks
  ansible.builtin.import_tasks: starship.yml
  when:
    - shell_enabled | bool
    - shell_starship_enabled | bool
    - shell_starship_config_enabled | bool
    - __shell_starship_package | default('') | length > 0
  tags:
    - shell
    - shell:starship

- name: Main | Import Starship shell init tasks
  ansible.builtin.import_tasks: starship_init.yml
  when:
    - shell_enabled | bool
    - shell_starship_enabled | bool
    - shell_starship_shells | length > 0
    - __shell_starship_package | default('') | length > 0
  tags:
    - shell
    - shell:starship

- name: Main | Import Zoxide shell init tasks
  ansible.builtin.import_tasks: zoxide_init.yml
  when:
    - shell_enabled | bool
    - shell_zoxide_enabled | bool
    - shell_zoxide_shells | length > 0
    - __shell_zoxide_package | default('') | length > 0
  tags:
    - shell
    - shell:zoxide

- name: Main | Import bash-preexec shell init tasks
  ansible.builtin.import_tasks: bash_preexec_init.yml
  when:
    - shell_enabled | bool
    - shell_bash_preexec_enabled | bool
    - __shell_bash_preexec_package | default('') | length > 0
  tags:
    - shell
    - shell:bash-preexec

- name: Main | Import ble.sh shell init tasks
  ansible.builtin.import_tasks: blesh_init.yml
  when:
    - shell_enabled | bool
    - shell_blesh_enabled | bool
    - __shell_blesh_package | default('') | length > 0
  tags:
    - shell
    - shell:blesh

- name: Main | Import atuin shell init tasks
  ansible.builtin.import_tasks: atuin_init.yml
  when:
    - shell_enabled | bool
    - shell_atuin_enabled | bool
    - shell_atuin_shells | length > 0
    - __shell_atuin_package | default('') | length > 0
  tags:
    - shell
    - shell:atuin
