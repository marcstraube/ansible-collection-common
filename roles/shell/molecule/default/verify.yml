---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '../../vars'

    #
    # Zsh
    #

    - name: Verify | Check zsh installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_zsh_package }}'
      register: _shell_zsh_arch
      changed_when: false
      failed_when: _shell_zsh_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_zsh_package | default('') | length > 0

    - name: Verify | Check zsh installed (Debian)
      ansible.builtin.command:
        cmd: 'dpkg -l {{ __shell_zsh_package }}'
      register: _shell_zsh_deb
      changed_when: false
      failed_when: _shell_zsh_deb.rc != 0
      when:
        - ansible_facts['os_family'] == 'Debian'
        - __shell_zsh_package | default('') | length > 0

    - name: Verify | Check zsh installed (RedHat)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: 'rpm -q {{ __shell_zsh_package }}'
      register: _shell_zsh_rpm
      changed_when: false
      failed_when: _shell_zsh_rpm.rc != 0
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - __shell_zsh_package | default('') | length > 0

    #
    # Fzf
    #

    - name: Verify | Check fzf installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_fzf_package }}'
      register: _shell_fzf_arch
      changed_when: false
      failed_when: _shell_fzf_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_fzf_package | default('') | length > 0

    - name: Verify | Check fzf installed (Debian)
      ansible.builtin.command:
        cmd: 'dpkg -l {{ __shell_fzf_package }}'
      register: _shell_fzf_deb
      changed_when: false
      failed_when: _shell_fzf_deb.rc != 0
      when:
        - ansible_facts['os_family'] == 'Debian'
        - __shell_fzf_package | default('') | length > 0

    - name: Verify | Check fzf installed (RedHat)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: 'rpm -q {{ __shell_fzf_package }}'
      register: _shell_fzf_rpm
      changed_when: false
      failed_when: _shell_fzf_rpm.rc != 0
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - __shell_fzf_package | default('') | length > 0

    #
    # Starship (init/config gated on package availability)
    #

    - name: Verify | Check starship installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_starship_package }}'
      register: _shell_starship_arch
      changed_when: false
      failed_when: _shell_starship_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_starship_package | default('') | length > 0

    # The role adds the `starship init` line and deploys starship.toml only
    # where it installs the binary. On Arch the package exists -> both present;
    # on EL/Debian __shell_starship_package is '' -> both must be absent
    # (otherwise every login prints "starship: command not found").
    - name: Verify | starship init line present in .bashrc (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "starship init bash" /home/testuser/.bashrc'
      register: _shell_starship_init_arch
      changed_when: false
      failed_when: _shell_starship_init_arch.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | starship.toml deployed (Arch)
      ansible.builtin.stat:
        path: /home/testuser/.config/starship.toml
      register: _shell_starship_toml_arch
      failed_when: not _shell_starship_toml_arch.stat.exists
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | starship init line absent in .bashrc (non-Arch)
      ansible.builtin.command:
        cmd: 'grep -q "starship init bash" /home/testuser/.bashrc'
      register: _shell_starship_init_other
      changed_when: false
      failed_when: _shell_starship_init_other.rc == 0
      when: ansible_facts['os_family'] != 'Archlinux'

    - name: Verify | starship.toml absent (non-Arch)
      ansible.builtin.stat:
        path: /home/testuser/.config/starship.toml
      register: _shell_starship_toml_other
      failed_when: _shell_starship_toml_other.stat.exists
      when: ansible_facts['os_family'] != 'Archlinux'

    #
    # Oh My Zsh
    #

    - name: Verify | Check Oh My Zsh directory exists
      ansible.builtin.stat:
        path: '/home/testuser/.oh-my-zsh'
      register: _shell_ohmyzsh_dir
      failed_when: not _shell_ohmyzsh_dir.stat.exists

    - name: Verify | Check Oh My Zsh oh-my-zsh.sh exists
      ansible.builtin.stat:
        path: '/home/testuser/.oh-my-zsh/oh-my-zsh.sh'
      register: _shell_ohmyzsh_sh
      failed_when: not _shell_ohmyzsh_sh.stat.exists

    - name: Verify | Check custom plugin cloned
      ansible.builtin.stat:
        path: '/home/testuser/.oh-my-zsh/custom/plugins/zsh-autosuggestions'
      register: _shell_ohmyzsh_custom_plugin
      failed_when: not _shell_ohmyzsh_custom_plugin.stat.exists

    - name: Verify | Check .zshrc deployed
      ansible.builtin.stat:
        path: '/home/testuser/.zshrc'
      register: _shell_ohmyzsh_zshrc
      failed_when: not _shell_ohmyzsh_zshrc.stat.exists

    - name: Verify | Check .zshrc contains Oh My Zsh source
      ansible.builtin.command:
        cmd: 'grep -q "source.*oh-my-zsh.sh" /home/testuser/.zshrc'
      register: _shell_ohmyzsh_source
      changed_when: false
      failed_when: _shell_ohmyzsh_source.rc != 0

    - name: Verify | Check .zshrc contains theme
      ansible.builtin.command:
        cmd: 'grep -q "ZSH_THEME=\"robbyrussell\"" /home/testuser/.zshrc'
      register: _shell_ohmyzsh_theme
      changed_when: false
      failed_when: _shell_ohmyzsh_theme.rc != 0

    #
    # Starship config (Arch only)
    #

    - name: Verify | Check starship.toml deployed (Arch)
      ansible.builtin.stat:
        path: '/home/testuser/.config/starship.toml'
      register: _shell_starship_toml
      failed_when: not _shell_starship_toml.stat.exists
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Check starship.toml contains plain-text-symbols content (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "success_symbol" /home/testuser/.config/starship.toml'
      register: _shell_starship_content
      changed_when: false
      failed_when: _shell_starship_content.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # Starship init line in shell rc (Arch only — testuser has bash init via converge)
    #

    - name: Verify | Check starship init block in testuser .bashrc (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "starship init bash" /home/testuser/.bashrc'
      register: _shell_starship_bash_init
      changed_when: false
      failed_when: _shell_starship_bash_init.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Check starship init block has ansible-managed marker (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — starship init" /home/testuser/.bashrc'
      register: _shell_starship_marker
      changed_when: false
      failed_when: _shell_starship_marker.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # Zoxide (all distros)
    #

    - name: Verify | Check zoxide installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_zoxide_package }}'
      register: _shell_zoxide_arch
      changed_when: false
      failed_when: _shell_zoxide_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_zoxide_package | default('') | length > 0

    - name: Verify | Check zoxide installed (Debian)
      ansible.builtin.command:
        cmd: 'dpkg -l {{ __shell_zoxide_package }}'
      register: _shell_zoxide_deb
      changed_when: false
      failed_when: _shell_zoxide_deb.rc != 0
      when:
        - ansible_facts['os_family'] == 'Debian'
        - __shell_zoxide_package | default('') | length > 0

    - name: Verify | Check zoxide installed (RedHat)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: 'rpm -q {{ __shell_zoxide_package }}'
      register: _shell_zoxide_rpm
      changed_when: false
      failed_when: _shell_zoxide_rpm.rc != 0
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - __shell_zoxide_package | default('') | length > 0

    #
    # Zoxide init line in shell rc (skipped when zoxide unavailable, e.g. EL 10)
    #

    - name: Verify | Check zoxide init block in testuser .bashrc
      ansible.builtin.command:
        cmd: 'grep -q "zoxide init bash" /home/testuser/.bashrc'
      register: _shell_zoxide_bash_init
      changed_when: false
      failed_when: _shell_zoxide_bash_init.rc != 0
      when: __shell_zoxide_package | default('') | length > 0

    - name: Verify | Check zoxide init block has ansible-managed marker
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — zoxide init" /home/testuser/.bashrc'
      register: _shell_zoxide_marker
      changed_when: false
      failed_when: _shell_zoxide_marker.rc != 0
      when: __shell_zoxide_package | default('') | length > 0

    - name: Verify | Check zoxide init block absent when package unavailable
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — zoxide init" /home/testuser/.bashrc'
      register: _shell_zoxide_absent
      changed_when: false
      failed_when: _shell_zoxide_absent.rc == 0
      when: __shell_zoxide_package | default('') | length == 0

    #
    # zoxide fish init (Arch only — Arch is the only platform with the
    # fish-converge play). Checks the fish config file directly.
    #

    - name: Verify | Check zoxide fish init block (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — zoxide init" /home/testuser/.config/fish/config.fish'
      register: _shell_zoxide_fish_init
      changed_when: false
      failed_when: _shell_zoxide_fish_init.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # atuin (Arch / Debian / EL 9 — not in EL 10)
    #

    - name: Verify | Check atuin installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_atuin_package }}'
      register: _shell_atuin_arch
      changed_when: false
      failed_when: _shell_atuin_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_atuin_package | default('') | length > 0

    - name: Verify | Check atuin installed (Debian)
      ansible.builtin.command:
        cmd: 'dpkg -l {{ __shell_atuin_package }}'
      register: _shell_atuin_deb
      changed_when: false
      failed_when: _shell_atuin_deb.rc != 0
      when:
        - ansible_facts['os_family'] == 'Debian'
        - __shell_atuin_package | default('') | length > 0

    - name: Verify | Check atuin installed (RedHat)
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: 'rpm -q {{ __shell_atuin_package }}'
      register: _shell_atuin_rpm
      changed_when: false
      failed_when: _shell_atuin_rpm.rc != 0
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - __shell_atuin_package | default('') | length > 0

    - name: Verify | Check atuin init block in testuser .bashrc
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — atuin init" /home/testuser/.bashrc'
      register: _shell_atuin_bash_init
      changed_when: false
      failed_when: _shell_atuin_bash_init.rc != 0
      when: __shell_atuin_package | default('') | length > 0

    - name: Verify | Check atuin init block absent when package unavailable
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — atuin init" /home/testuser/.bashrc'
      register: _shell_atuin_absent
      changed_when: false
      failed_when: _shell_atuin_absent.rc == 0
      when: __shell_atuin_package | default('') | length == 0

    #
    # atuin fish init (Arch only — Arch is the only platform with the
    # fish-converge play). Checks the fish config file directly.
    #

    - name: Verify | Check atuin fish init block (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — atuin init" /home/testuser/.config/fish/config.fish'
      register: _shell_atuin_fish_init
      changed_when: false
      failed_when: _shell_atuin_fish_init.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # bash-preexec (Arch only — extra/bash-preexec)
    #

    - name: Verify | Check bash-preexec installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_bash_preexec_package }}'
      register: _shell_bash_preexec_arch
      changed_when: false
      failed_when: _shell_bash_preexec_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_bash_preexec_package | default('') | length > 0

    - name: Verify | Check bash-preexec init block in testuser .bashrc (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — bash-preexec init" /home/testuser/.bashrc'
      register: _shell_bash_preexec_init
      changed_when: false
      failed_when: _shell_bash_preexec_init.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_bash_preexec_package | default('') | length > 0

    #
    # bash-preexec init line must come before atuin init in .bashrc
    # (atuin's bash hooks depend on bash-preexec already loaded).
    #

    - name: Verify | Check bash-preexec block precedes atuin block (Arch)
      ansible.builtin.shell: |
        set -o pipefail
        preexec_line=$(grep -n "ANSIBLE MANAGED — bash-preexec init" /home/testuser/.bashrc | head -1 | cut -d: -f1)
        atuin_line=$(grep -n "ANSIBLE MANAGED — atuin init" /home/testuser/.bashrc | head -1 | cut -d: -f1)
        [ -n "$preexec_line" ] && [ -n "$atuin_line" ] && [ "$preexec_line" -lt "$atuin_line" ]
      register: _shell_init_order
      changed_when: false
      failed_when: _shell_init_order.rc != 0
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # ble.sh (Arch only — AUR)
    #

    - name: Verify | Check ble.sh installed (Arch)
      ansible.builtin.command:
        cmd: 'pacman -Q {{ __shell_blesh_package }}'
      register: _shell_blesh_arch
      changed_when: false
      failed_when: _shell_blesh_arch.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_blesh_package | default('') | length > 0

    - name: Verify | Check ble.sh init block in testuser .bashrc (Arch)
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — ble.sh init" /home/testuser/.bashrc'
      register: _shell_blesh_init
      changed_when: false
      failed_when: _shell_blesh_init.rc != 0
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - __shell_blesh_package | default('') | length > 0

    #
    # Initial Mode — Newly Created User (initialnewuser)
    #
    # shell_user_config_mode=initial + user IN __users_newly_created
    # → role MUST add the zoxide init blockinfile to the user's .bashrc.
    #
    # The deploy-check assertion is gated on zoxide availability —
    # __shell_zoxide_package is empty on EL 10 (zoxide not in EPEL 10),
    # so the role's zoxide_init skips entirely there. The per-user
    # gating pattern is still exercised on Arch, Debian, and EL 9.
    #

    - name: Verify | Check initialnewuser .bashrc exists
      ansible.builtin.stat:
        path: /home/initialnewuser/.bashrc
      register: __verify_initialnew_bashrc
      when: __shell_zoxide_package | default('') | length > 0

    - name: Verify | Assert initialnewuser .bashrc is owned by user
      ansible.builtin.assert:
        that:
          - __verify_initialnew_bashrc.stat.exists
          - __verify_initialnew_bashrc.stat.pw_name == 'initialnewuser'
      when: __shell_zoxide_package | default('') | length > 0

    - name: Verify | Check zoxide init block present in initialnewuser .bashrc
      ansible.builtin.command:
        cmd: 'grep -q "ANSIBLE MANAGED — zoxide init" /home/initialnewuser/.bashrc'
      register: __verify_initialnew_zoxide
      changed_when: false
      failed_when: __verify_initialnew_zoxide.rc != 0
      when: __shell_zoxide_package | default('') | length > 0

    #
    # Initial Mode — Existing User (initialexistuser)
    #
    # shell_user_config_mode=initial + user NOT IN __users_newly_created
    # → role MUST leave the user's pre-existing .bashrc untouched.
    #

    - name: Verify | Read initialexistuser .bashrc
      ansible.builtin.slurp:
        src: /home/initialexistuser/.bashrc
      register: __verify_initialexist_bashrc

    - name: Verify | Assert initialexistuser .bashrc is unchanged
      ansible.builtin.assert:
        that:
          - >-
            'molecule-fixture: pre-existing user content'
            in (__verify_initialexist_bashrc.content | b64decode)
          - >-
            'ANSIBLE MANAGED — zoxide init'
            not in (__verify_initialexist_bashrc.content | b64decode)

    #
    # Disabled Mode — Global (globaldisableduser)
    #
    # shell_user_config_mode=disabled
    # → role MUST NOT add any ANSIBLE MANAGED blocks to the user's
    #   shell rc files. The .bashrc may exist from /etc/skel or may be
    #   absent; either way it must not contain a managed marker.
    #

    - name: Verify | Check globaldisableduser .bashrc
      ansible.builtin.stat:
        path: /home/globaldisableduser/.bashrc
      register: __verify_globaldisabled_bashrc

    - name: Verify | Read globaldisableduser .bashrc when present
      ansible.builtin.slurp:
        src: /home/globaldisableduser/.bashrc
      register: __verify_globaldisabled_bashrc_content
      when: __verify_globaldisabled_bashrc.stat.exists

    - name: Verify | Assert globaldisableduser .bashrc has no ANSIBLE MANAGED block
      ansible.builtin.assert:
        that:
          - >-
            'ANSIBLE MANAGED'
            not in (__verify_globaldisabled_bashrc_content.content | b64decode)
      when: __verify_globaldisabled_bashrc.stat.exists
