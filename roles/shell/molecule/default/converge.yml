---
# Runs first, before any play has loaded the role's OS variables, so the
# install phase has to load them itself.
- name: Converge — Install phase only
  hosts: all
  gather_facts: true

  vars:
    shell_zsh_enabled: true
    shell_zsh_plugins: []
    shell_starship_enabled: false
    shell_fzf_enabled: false

  tasks:
    - name: Converge | Include shell install phase  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: install.yml

    - name: Converge | Check zsh binary after install phase
      ansible.builtin.stat:
        path: /usr/bin/zsh
      register: __converge_install_zsh

    - name: Converge | Assert install phase installed zsh
      ansible.builtin.assert:
        that:
          - __converge_install_zsh.stat.exists
        fail_msg: 'install phase did not install zsh'
        quiet: true

- name: Converge — Native framework
  hosts: all
  gather_facts: true

  vars:
    shell_enabled: true
    shell_default: 'zsh'
    shell_zsh_enabled: true
    shell_zsh_framework: 'native'
    shell_zsh_plugins:
      - 'completions'
    shell_fish_enabled: false
    shell_bash_completion_enabled: true
    shell_starship_enabled: "{{ ansible_facts['os_family'] == 'Archlinux' }}"
    shell_fzf_enabled: true
    # Empty shell_users → every users_list entry. shelldefaultuser has no
    # `shell:` and gets shell_default; shellkeepuser has `shell:` and root is
    # never changed, so both keep the login shell set in prepare.
    shell_users: []
    users_list:
      - name: 'root'
        shell: '/bin/bash'
      - name: 'shellkeepuser'
        shell: '/bin/bash'
      - name: 'shelldefaultuser'

  tasks:
    - name: Converge | Include shell role (native)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Assert login shell deprecation warning
      ansible.builtin.assert:
        that:
          - __shell_default_login_shell_deprecated | bool
          - __shell_login_users == ['shelldefaultuser']
        fail_msg: 'deprecated login shell users or their deprecation warning are wrong'
        quiet: true

- name: Converge — Login shells from shell_users
  hosts: all
  gather_facts: true

  vars:
    shell_enabled: true
    shell_default: 'zsh'
    shell_zsh_enabled: true
    shell_zsh_framework: 'native'
    shell_zsh_plugins: []
    shell_fish_enabled: false
    shell_bash_completion_enabled: false
    shell_starship_enabled: false
    shell_fzf_enabled: false
    # Explicit names: root and shellkeepuser are still skipped. Same result
    # as the native play, so the idempotence run catches any flip-flop.
    shell_users:
      - 'root'
      - 'shellkeepuser'
      - 'shelldefaultuser'
    users_list:
      - name: 'root'
        shell: '/bin/bash'
      - name: 'shellkeepuser'
        shell: '/bin/bash'
      - name: 'shelldefaultuser'

  tasks:
    - name: Converge | Include shell role (login shells)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

- name: Converge — Oh My Zsh framework
  hosts: all
  gather_facts: true

  vars:
    shell_enabled: true
    shell_default: 'zsh'
    shell_zsh_enabled: true
    shell_zsh_framework: 'ohmyzsh'
    shell_ohmyzsh_theme: 'robbyrussell'
    shell_ohmyzsh_plugins:
      - 'git'
    shell_ohmyzsh_custom_plugins:
      - name: 'zsh-autosuggestions'
        repo: 'https://github.com/zsh-users/zsh-autosuggestions.git'
    shell_starship_enabled: false
    shell_zoxide_enabled: false
    shell_fzf_enabled: false
    shell_fish_enabled: false
    shell_bash_completion_enabled: false
    shell_users:
      - 'testuser'
    shell_user_config_mode: 'managed'

  tasks:
    - name: Converge | Include shell role (ohmyzsh)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

- name: Converge — Starship config (all distros — role gates init on package availability)
  hosts: all
  gather_facts: true

  vars:
    shell_enabled: true
    shell_default: 'bash'
    shell_zsh_enabled: false
    shell_fish_enabled: false
    shell_bash_completion_enabled: false
    shell_starship_enabled: true
    shell_starship_config_enabled: true
    shell_starship_preset: 'plain-text-symbols'
    shell_starship_shells:
      - 'bash'
    shell_user_config_mode: 'managed'
    shell_users:
      - 'testuser'
    shell_fzf_enabled: false

  tasks:
    - name: Converge | Include shell role (starship)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    - name: Converge | Assert no login shell deprecation warning
      ansible.builtin.assert:
        that:
          - not (__shell_default_login_shell_deprecated | bool)
        fail_msg: 'deprecation warning fired although shell_default is bash'
        quiet: true

- name: Converge — Zoxide init (all distros — zoxide ships in every repo)
  hosts: all
  gather_facts: true

  vars:
    shell_enabled: true
    shell_default: 'bash'
    shell_zsh_enabled: false
    shell_fish_enabled: false
    shell_bash_completion_enabled: false
    shell_starship_enabled: false
    shell_zoxide_enabled: true
    shell_zoxide_shells:
      - 'bash'
    shell_user_config_mode: 'managed'
    shell_users:
      - 'testuser'
    shell_fzf_enabled: false

  tasks:
    - name: Converge | Include shell role (zoxide)  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

