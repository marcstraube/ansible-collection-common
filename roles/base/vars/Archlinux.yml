---
__base_default_packages:
  - 'bash-completion'
  - 'htop'
  - 'man-db'
  - 'man-pages'
  - 'tmux'
  - 'wget'
  - 'curl'
  - 'rsync'
  - 'tree'

__base_dialog_package: 'dialog'

# Kernel
__base_default_kernel: 'linux'
__base_default_kernel_extra_packages:
  - '{{ base_kernel }}-headers'
# Package compared with the minimum (the kernel updates with the system
# upgrade, so there is nothing to move along)
__base_kernel_version_pattern: '^{{ base_kernel | regex_escape }}$'

# Keeps the modules of the running kernel across a kernel upgrade
__base_kernel_keep_modules_package: 'kernel-modules-hook'
__base_kernel_keep_modules_service: 'linux-modules-cleanup.service'

# Default bootloader (Arch installer ships systemd-boot as the modern choice)
__base_default_bootloader: 'systemd-boot'

# GRUB binary + config path (when base_bootloader is overridden to 'grub')
__base_grub_mkconfig: 'grub-mkconfig'
__base_grub_cfg: '/boot/grub/grub.cfg'
