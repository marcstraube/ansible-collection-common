---
#
# Role Control
#

# Enable the base role
base_enabled: true

#
# Hostname
#

# System hostname
base_hostname: '{{ inventory_hostname }}'

# Pretty hostname (shown in UI)
base_pretty_hostname: ''

# Chassis type: desktop, laptop, server, tablet, handset, vm, container
base_chassis: 'desktop'

# Deployment environment: development, integration, staging, production
base_deployment: ''

# Icon name (XDG Icon Naming Spec)
base_icon_name: ''

# Physical location description
base_location: ''

#
# Locale
#

# System locale (LANG)
base_locale: 'en_US.UTF-8'

# Additional locales to generate
base_locales:
  - 'en_US.UTF-8 UTF-8'

# Language-specific locale overrides (optional)
# Example: base_locale_lc_time: 'de_DE.UTF-8'
base_locale_lc_ctype: ''
base_locale_lc_numeric: ''
base_locale_lc_time: ''
base_locale_lc_collate: ''
base_locale_lc_monetary: ''
base_locale_lc_messages: ''
base_locale_lc_paper: ''
base_locale_lc_name: ''
base_locale_lc_address: ''
base_locale_lc_telephone: ''
base_locale_lc_measurement: ''
base_locale_lc_identification: ''

#
# Timezone
#

# System timezone
base_timezone: 'UTC'

# Enable NTP time synchronization (false = managed by dedicated role like chrony)
base_ntp_enabled: false

# NTP servers (empty = use systemd-timesyncd defaults)
base_ntp_servers: []

# Fallback NTP servers
base_ntp_fallback_servers: []

#
# Login Message
#

# Text shown by pam_motd on interactive logins, written to /etc/motd.d/ansible.
# Empty removes the file; /etc/motd and other drop-ins are never touched.
# Example:
#   base_motd_content: |
#     This host is managed by Ansible. Manual changes to configuration files
#     are overwritten on the next run.
base_motd_content: ''

#
# Environment
#

# Environment variables for login shells, written to
# /etc/profile.d/base-environment.sh. Names are used as given; empty removes
# the file. Shells that skip /etc/profile.d (fish) and systemd services do not
# see them.
# Example (proxy; tools differ in which spelling they read):
#   base_environment:
#     http_proxy: 'http://proxy.example.com:3128'
#     https_proxy: 'http://proxy.example.com:3128'
#     no_proxy: 'localhost,127.0.0.1'
#     HTTP_PROXY: 'http://proxy.example.com:3128'
#     HTTPS_PROXY: 'http://proxy.example.com:3128'
#     NO_PROXY: 'localhost,127.0.0.1'
base_environment: {}

#
# Keyboard
#

# Console keymap
base_keymap: 'de-latin1'

# Console font
base_console_font: ''

# Console font map
base_console_font_map: ''

# X11 keyboard layout
base_xkb_layout: 'de'

# X11 keyboard model
base_xkb_model: ''

# X11 keyboard variant
base_xkb_variant: 'nodeadkeys'

# X11 keyboard options
base_xkb_options: ''

#
# Kernel
#

# Kernel package to install. Default is OS-aware via vars/<OS>.yml:
#   Arch Linux → linux
#   Debian     → linux-image-amd64 (linux-image-arm64 on aarch64)
#   RHEL-fam   → kernel
base_kernel: '{{ __base_default_kernel | default("linux") }}'

# Additional kernel packages (headers, etc.). Default is OS-aware:
#   Arch Linux → ['<base_kernel>-headers']
#   Debian, RHEL-fam → [] (only the kernel the installer set up)
base_kernel_extra_packages: '{{ __base_default_kernel_extra_packages | default([]) }}'

# Microcode package (Arch Linux only). 'auto' selects it by CPU vendor and
# installs none in a virtual machine, which gets microcode updates from its
# host. Options: 'intel-ucode', 'amd-ucode', 'auto', ''
base_microcode: 'auto'

# Keep the modules of the running kernel available after a kernel upgrade
# (kernel-modules-hook): pacman hooks preserve them across the upgrade and
# linux-modules-cleanup.service removes the modules of uninstalled kernels at
# boot. Install-only: false disables the service and leaves the package.
base_kernel_keep_modules_enabled: true

#
# Kernel Updates
#

# State of the kernel packages:
#   'present' installs a missing kernel and never updates (default).
#   'latest'  updates the installed kernel packages in one transaction. EL
#             installs the new kernel next to the running one, Debian moves
#             the metapackage to the new kernel ABI.
# Pass 'latest' for a targeted update instead of setting it in inventory:
#   --tags base:kernel -e base_kernel_packages_state=latest
# Ignored on Arch Linux: updating single packages is a partial upgrade there,
# the kernel updates with the full system upgrade.
base_kernel_packages_state: 'present'

# Lowest acceptable kernel version, checked before the update (nothing
# changes when the repository does not offer it yet) and again after it.
# Meant to be passed with the update command to require a fix. Either an
# upstream version, which accepts every distribution release of it:
#   -e base_kernel_packages_minimum=6.12.115
# or the full distribution version, which also covers fixes the distribution
# backports without a new upstream version:
#   -e base_kernel_packages_minimum=5.14.0-687.65.1.el9_8
# A mapping per platform (keys '<os_family>-<major>' or '<os_family>') covers
# mixed hosts in one run; a host without a matching key fails:
#   -e @kernel-minimum.yml
base_kernel_packages_minimum: ''

# A new kernel takes effect after a reboot. The role reports a pending reboot
# whenever it checks the kernel (state 'latest', a minimum or this toggle):
# the running kernel is not the newest installed one. true reboots the host
# when a reboot is pending and then checks that the newest kernel runs and
# meets base_kernel_packages_minimum. Pass it with the update command; the
# order of reboots across hosts is up to the caller (--forks, --limit):
#   -e base_kernel_reboot=true
base_kernel_reboot: false

# Seconds to wait for the host to come back after the reboot
base_kernel_reboot_timeout: 600

#
# Bootloader
#

# Bootloader type: systemd-boot, grub, none
# Default is OS-aware via vars/<OS>.yml:
#   Arch Linux       → systemd-boot
#   Debian, RHEL-fam → grub
base_bootloader: '{{ __base_default_bootloader | default("systemd-boot") }}'

# GRUB timeout in seconds
base_grub_timeout: 5

# GRUB default entry
base_grub_default: '0'

# Additional kernel parameters appended to GRUB_CMDLINE_LINUX_DEFAULT
# Example: ['quiet', 'splash', 'loglevel=3']
#
# Security hardening parameters (see marcstraube.common.hardening README):
#   - 'lockdown=integrity'       # Prevent runtime kernel modification
#   - 'lockdown=confidentiality' # Also block kernel memory reads (breaks hibernation)
#   - 'init_on_alloc=1'          # Zero memory at allocation (~1% perf cost)
#   - 'init_on_free=1'           # Zero memory at free (~5% cost, skip on DB servers)
#   - 'vsyscall=none'            # Disable legacy vsyscall (safe on glibc 2.14+)
#   - 'debugfs=off'              # Prevent mounting debugfs
#   - 'page_alloc.shuffle=1'     # Randomize page allocator free lists
#   - 'iommu=force'              # Force IOMMU isolation (5-15% I/O cost, skip in VMs)
base_kernel_parameters: []

# systemd-boot loader timeout in seconds (empty = no timeout, boot default)
base_systemd_boot_timeout: 3

# systemd-boot console mode: auto, max, keep, 0, 1, 2, ...
base_systemd_boot_console_mode: 'max'

# systemd-boot editor: allow editing kernel parameters at boot (security risk)
base_systemd_boot_editor: false

#
# Packages
#

# Install dialog (TUI menus and input boxes)
base_dialog_enabled: true

# Essential system packages (OS-specific defaults from vars/)
base_packages: '{{ __base_default_packages | default([]) }}'

# Additional packages to install
base_extra_packages: []

# Packages to remove
base_remove_packages: []

#
# Services
#

# Services to enable (timesyncd is managed by timezone tasks via base_ntp_enabled)
base_services_enabled: []

# Services to disable
base_services_disabled: []

#
# Sysctl
#

# Sysctl settings (dictionary)
# Example:
#   base_sysctl:
#     'vm.swappiness': 10
#     'net.ipv4.tcp_fastopen': 3
base_sysctl: {}

#
# Mkinitcpio
#

# Mkinitcpio modules
base_mkinitcpio_modules: []

# Mkinitcpio binaries
base_mkinitcpio_binaries: []

# Mkinitcpio files
base_mkinitcpio_files: []

# Mkinitcpio hooks — auto-detected from running system by default.
# Set explicitly to override auto-detection.
# Auto-detection reads current /etc/mkinitcpio.conf hooks (set by installer).
# Example override:
#   base_mkinitcpio_hooks:
#     - 'base'
#     - 'systemd'
#     - 'autodetect'
#     - 'modconf'
#     - 'kms'
#     - 'keyboard'
#     - 'sd-vconsole'
#     - 'block'
#     - 'sd-encrypt'
#     - 'filesystems'
#     - 'fsck'
base_mkinitcpio_hooks: []

# Mkinitcpio compression
base_mkinitcpio_compression: 'zstd'

#
# Systemd
#

# Journald max disk usage
base_journald_max_use: '500M'

# Journald max retention time
base_journald_max_retention: '1month'

# Coredump storage: none, external, journal
base_coredump_storage: 'none'

# Coredump compress
base_coredump_compress: true

# Coredump max size
base_coredump_max_size: '2G'
