---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    base_enabled: true
    base_hostname: 'testhost'
    base_pretty_hostname: 'Test Desktop'
    base_chassis: 'desktop'
    base_locale: 'en_US.UTF-8'
    base_locales:
      - 'en_US.UTF-8 UTF-8'
      - 'de_DE.UTF-8 UTF-8'
    base_timezone: 'Europe/Berlin'
    base_ntp_enabled: false

    base_motd_content: |
      This host is managed by Ansible. Manual changes are overwritten on the
      next run.

    base_environment:
      http_proxy: 'http://proxy.example.com:3128'
      HTTP_PROXY: 'http://proxy.example.com:3128'
      # Space, single quote and $ prove the value is shell-quoted
      BASE_TEST_QUOTED: "it's $HOME"

    base_keymap: 'us'
    base_xkb_layout: 'us'

    # Bootloader not testable in containers (no /boot, no grub)
    base_bootloader: 'none'

    # base_packages: uses OS-specific defaults from vars/

    base_extra_packages:
      - 'vim'

    # Sysctl not testable in Docker (procfs read-only) — tested by sysctl role
    base_sysctl: {}

  tasks:
    - name: Converge | Include base role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
