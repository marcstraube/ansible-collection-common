---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux: []
      Debian:
        - systemd
        - systemd-timesyncd
        - locales
        - dbus
      RedHat:
        - glibc-langpack-en
        - glibc-locale-source

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5
      when: __prepare_packages[ansible_facts["os_family"]] | length > 0

    # Fixtures for the motd tasks: a distribution /etc/motd and a foreign
    # drop-in. verify.yml asserts both survive the role unchanged.
    - name: Prepare | Create /etc/motd fixture
      ansible.builtin.copy:
        content: "distribution motd fixture\n"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Create /etc/motd.d fixture directory
      ansible.builtin.file:
        path: /etc/motd.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Prepare | Create foreign motd drop-in fixture
      ansible.builtin.copy:
        content: "foreign drop-in fixture\n"
        dest: /etc/motd.d/other
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Replace curl-minimal with curl on RedHat (Docker image conflict)
      ansible.builtin.dnf:
        name:
          - curl
        state: present
        allowerasing: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    #
    # Kernel Update Test State
    #

    # The targeted kernel update (side_effect.yml) needs an outdated kernel.
    # EL keeps the older builds of a minor release in BaseOS (repoquery lists
    # them oldest first); Debian keeps the point release kernel in main next to
    # the newer one from security (madison lists the newest first). Without an
    # older build the newest is installed and the update has nothing to do.
    - name: Prepare | List the kernel builds (RedHat)
      ansible.builtin.command:
        argv:
          - dnf
          - --quiet
          - repoquery
          - --showduplicates
          - '--queryformat=%{version}-%{release}'
          - kernel-core
      register: __prepare_kernel_builds_dnf
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | List the kernel builds (Debian)
      ansible.builtin.command:
        argv:
          - apt-cache
          - madison
          - linux-image-amd64
      register: __prepare_kernel_builds_apt
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Select the older and the newest kernel build
      ansible.builtin.set_fact:
        __prepare_kernel_older: '{{ __prepare_kernel_builds[-2] | default(__prepare_kernel_builds[-1]) }}'
        __prepare_kernel_newest: '{{ __prepare_kernel_builds[-1] }}'
      vars:
        __prepare_kernel_builds: >-
          {{ (__prepare_kernel_builds_dnf.stdout_lines | unique | list)
             if ansible_facts['os_family'] == 'RedHat'
             else (__prepare_kernel_builds_apt.stdout_lines
                   | map('split', '|') | map(attribute=1) | map('trim') | unique | reverse | list) }}
      when: ansible_facts['os_family'] in ['RedHat', 'Debian']

    - name: Prepare | Install the older kernel (RedHat)
      ansible.builtin.dnf:
        name: 'kernel-{{ __prepare_kernel_older }}'
        state: present
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install the older kernel (Debian)
      ansible.builtin.apt:
        name: 'linux-image-amd64={{ __prepare_kernel_older }}'
        state: present
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Record the kernel builds for the update test
      ansible.builtin.copy:
        content: |
          older: '{{ __prepare_kernel_older }}'
          newest: '{{ __prepare_kernel_newest }}'
        dest: /root/kernel-builds.yml
        owner: root
        group: root
        mode: '0600'
      when: ansible_facts['os_family'] in ['RedHat', 'Debian']
