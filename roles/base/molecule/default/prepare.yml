---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux: []
      Debian:
        - systemd
        - systemd-timesyncd
        - locales
        - dbus
      RedHat:
        - glibc-langpack-en
        - glibc-locale-source

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5
      when: __prepare_packages[ansible_facts["os_family"]] | length > 0

    # Fixtures for the motd tasks: a distribution /etc/motd and a foreign
    # drop-in. verify.yml asserts both survive the role unchanged.
    - name: Prepare | Create /etc/motd fixture
      ansible.builtin.copy:
        content: "distribution motd fixture\n"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Create /etc/motd.d fixture directory
      ansible.builtin.file:
        path: /etc/motd.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Prepare | Create foreign motd drop-in fixture
      ansible.builtin.copy:
        content: "foreign drop-in fixture\n"
        dest: /etc/motd.d/other
        owner: root
        group: root
        mode: '0644'

    - name: Prepare | Replace curl-minimal with curl on RedHat (Docker image conflict)
      ansible.builtin.dnf:
        name:
          - curl
        state: present
        allowerasing: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'
