---
- name: Reload PKI systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  # Container-safety for molecule
  failed_when: false
  when: pki_enabled | bool

- name: Update CA trust
  ansible.builtin.command:
    cmd: '{{ __pki_update_ca_trust_cmd }}'
  changed_when: false
  when: pki_enabled | bool

- name: Restart PKI OCSP responder
  ansible.builtin.systemd_service:
    name: pki-ocsp.service
    state: restarted
  when: pki_ocsp_enabled | bool

- name: Restart PKI cert check timer
  ansible.builtin.systemd_service:
    name: pki-cert-check.timer
    state: restarted
  when: pki_renewal_enabled | bool

# Handler topic contract: every task in this role that writes certificate
# material notifies 'Reload cert services'. Roles consuming that material
# subscribe with `listen` on their own reload or restart handler, keeping their
# own service conditionals. This role names no service and the inventory
# configures nothing.
#
# Notifications do not cross play boundaries, so this listener also records the
# change as a host fact. A later play whose consumers did not run alongside this
# role reads pki_cert_material_changed and notifies the topic again in its own
# play. Being a listener of its own, it also keeps a host without any consumer
# from failing: Ansible aborts a run when a notification reaches no handler.
- name: Record cert material change
  ansible.builtin.set_fact:
    pki_cert_material_changed: true
  listen: Reload cert services
