---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Warn if scheduled checks report warnings without email
  ansible.builtin.debug:
    msg: >-
      WARNING: rkhunter_mail_on_warning is empty.
      Warnings found by the scheduled check do not fail rkhunter-check.service;
      they are only in '{{ rkhunter_log_dir }}/rkhunter.log' and the journal of
      rkhunter-check.service{{ (', and in syslog (' ~ rkhunter_syslog_facility ~ ')')
      if rkhunter_use_syslog | bool else '' }}.
      Set an email address or monitor those for production alerting.
  when:
    - rkhunter_enabled | bool
    - rkhunter_timer_enabled | bool
    - rkhunter_mail_on_warning | length == 0
  tags:
    - rkhunter

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: rkhunter_enabled | bool
  tags:
    - rkhunter
    - rkhunter:install

- name: Main | Include BTRFS tasks
  ansible.builtin.include_tasks:
    file: btrfs.yml
    apply:
      tags:
        - rkhunter
        - rkhunter:install
  when: rkhunter_enabled | bool
  tags:
    - rkhunter
    - rkhunter:install

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: rkhunter_enabled | bool
  tags:
    - rkhunter
    - rkhunter:configure

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: rkhunter_enabled | bool
  tags:
    - rkhunter
    - rkhunter:service
