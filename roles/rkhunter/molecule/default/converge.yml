---
- name: Converge
  hosts: all
  gather_facts: true

  pre_tasks:
    # systemd-update-done writes a timestamp; rkhunter skips empty hidden files
    - name: Converge | Give /etc/.updated content
      ansible.builtin.copy:
        content: "TIMESTAMP_NSEC=0\n"
        dest: '/etc/.updated'
        owner: root
        group: root
        mode: '0644'

  tasks:
    - name: Converge | Include rkhunter role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
