---
__rkhunter_packages:
  - rkhunter

__rkhunter_scriptdir: '/usr/lib/rkhunter/scripts'
__rkhunter_pkgmgr: 'NONE'

# Shell scripts of the distribution packages (grep, glibc), written in
# addition to rkhunter_scriptwhitelist when present
__rkhunter_os_scriptwhitelist:
  - '/usr/bin/egrep'
  - '/usr/bin/fgrep'
  - '/usr/bin/ldd'

# Hidden files of the distribution (systemd-update-done, krb5 man pages),
# written in addition to rkhunter_allowhiddenfile
__rkhunter_os_allowhiddenfile:
  - '/etc/.updated'
  - '/usr/share/man/man5/.k5identity.5.gz'
  - '/usr/share/man/man5/.k5login.5.gz'
