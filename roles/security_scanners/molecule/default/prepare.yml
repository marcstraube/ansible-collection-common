---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    # npm for the Socket CLI install path; the nodejs role provides it on
    # real hosts
    __prepare_packages:
      Archlinux: []
      Debian:
        - 'npm'
      RedHat:
        - 'npm'

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    # trivy comes from EPEL on EL 10; the package_management role enables
    # it on real hosts.
    - name: Prepare | Enable EPEL repository (RedHat)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    # Socket CLI needs Node.js 20 or newer; the default stream of EL 9 is 16.
    - name: Prepare | Enable the Node.js 22 module stream (EL 9)
      ansible.builtin.command:
        cmd: dnf -y module enable nodejs:22
      changed_when: true
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['distribution_major_version'] == '9'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5
      when: __prepare_packages[ansible_facts["os_family"]] | length > 0

    - name: Prepare | Create aur_builder user for AUR packages (Arch)
      ansible.builtin.user:
        name: aur_builder
        group: wheel
        create_home: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Allow aur_builder passwordless sudo (Arch)
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/99-aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        create: true
        owner: root
        group: root
        mode: '0440'
      when: ansible_facts['os_family'] == 'Archlinux'
