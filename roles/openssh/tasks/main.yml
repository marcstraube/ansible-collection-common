---
# openssh_client_users takes precedence; only derive when the operator left
# it empty.
- name: Main | Set client user derivation guard
  ansible.builtin.set_fact:
    __openssh_client_derive_users: '{{ openssh_client_users | length == 0 }}'
  when:
    - openssh_enabled | bool
    - openssh_client_enabled | bool
  tags:
    - always

- name: Main | Derive client users from users_list (exclude system users)
  ansible.builtin.set_fact:
    openssh_client_users: >-
      {{ openssh_client_users + [{'username': item.name} | combine(item.ssh_client)] }}
  loop: >-
    {{ users_list | default([]) | selectattr('ssh_client', 'defined') | list }}
  loop_control:
    label: '{{ item.name }}'
  when:
    - openssh_enabled | bool
    - openssh_client_enabled | bool
    - __openssh_client_derive_users | default(false) | bool
    - not (item.system | default(false) | bool)
  tags:
    - always

- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: openssh_enabled | bool
  tags:
    - openssh
    - openssh:install

- name: Main | Import hostkeys tasks
  ansible.builtin.import_tasks: hostkeys.yml
  when: openssh_enabled | bool
  tags:
    - openssh
    - openssh:hostkeys

# Not gated on openssh_server_harden_moduli_enabled: with hardening disabled the
# tasks still run to remove the Arch Linux pacman hook.
- name: Main | Import moduli tasks
  ansible.builtin.import_tasks: moduli.yml
  when: openssh_enabled | bool
  tags:
    - openssh
    - openssh:configure

- name: Main | Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  when: openssh_enabled | bool
  tags:
    - openssh
    - openssh:configure

- name: Main | Import client tasks
  ansible.builtin.import_tasks: client.yml
  when:
    - openssh_enabled | bool
    - openssh_client_enabled | bool
  tags:
    - openssh
    - openssh:client

- name: Main | Include SSH client tools tasks
  ansible.builtin.include_tasks:
    file: tools.yml
    apply:
      tags:
        - openssh
        - openssh:tools
  when:
    - openssh_enabled | bool
    - >-
      openssh_tools_sshm_enabled | bool
      or openssh_tools_mosh_enabled | bool
      or openssh_tools_sshfs_enabled | bool
      or openssh_tools_autossh_enabled | bool
  tags:
    - openssh
    - openssh:tools

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: openssh_enabled | bool
  tags:
    - openssh
    - openssh:service

- name: Main | Include firewall tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - openssh
        - openssh:firewall
  when:
    - openssh_enabled | bool
    - openssh_firewalld_enabled | bool
  tags:
    - openssh
    - openssh:firewall

- name: Main | Include AppArmor tasks
  ansible.builtin.include_tasks:
    file: apparmor.yml
    apply:
      tags:
        - openssh
        - openssh:apparmor
  when:
    - openssh_enabled | bool
    - openssh_apparmor_enabled | bool
    - ansible_facts['os_family'] != 'RedHat'
  tags:
    - openssh
    - openssh:apparmor
