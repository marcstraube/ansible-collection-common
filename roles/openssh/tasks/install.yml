---
- name: Install | OpenSSH packages
  ansible.builtin.package:
    name: '{{ __openssh_packages }}'
    state: present
  retries: 3
  delay: 5

- name: Install | ssh-audit
  ansible.builtin.package:
    name: '{{ __openssh_ssh_audit_package }}'
    state: present
  retries: 3
  delay: 5
  when: openssh_ssh_audit_enabled | bool
  # Package may not be available in all repositories
  failed_when: false

- name: Install | Askpass package
  ansible.builtin.package:
    name: '{{ __openssh_askpass_selected.package }}'
    state: present
  retries: 3
  delay: 5
  when:
    - openssh_askpass_enabled | bool
    - __openssh_askpass_selected.package | length > 0
