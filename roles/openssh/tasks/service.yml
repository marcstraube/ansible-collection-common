---
- name: Service | Manage OpenSSH service
  ansible.builtin.systemd_service:
    name: '{{ __openssh_service_name }}'
    enabled: "{{ openssh_service_enabled | bool }}"
    state: "{{ openssh_service_enabled | bool | ternary('started', 'stopped') }}"
    daemon_reload: true

- name: Service | Check ssh-agent user service unit state  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: 'systemctl --global list-unit-files {{ __openssh_agent_service }}'
  register: __openssh_agent_unit_check
  changed_when: false
  # Unit may not exist on the system
  failed_when: false

# A static unit (no [Install] section) cannot be enabled
- name: Service | Set ssh-agent unit enable guard
  ansible.builtin.set_fact:
    __openssh_agent_unit_enableable: >-
      {{ 'enabled' in __openssh_agent_unit_check.stdout
         or 'disabled' in __openssh_agent_unit_check.stdout }}

- name: Service | Manage global ssh-agent service
  ansible.builtin.systemd_service:
    name: '{{ __openssh_agent_service }}'
    enabled: "{{ openssh_agent_global_service_enabled | bool }}"
    scope: global
  when: __openssh_agent_unit_enableable | bool

# The socket-activated agent does not export SSH_AUTH_SOCK itself. 40- sorts
# before user-level exports such as 50-gpg-ssh.conf, which therefore win.
- name: Service | Ensure environment.d directory exists
  ansible.builtin.file:
    path: '/etc/environment.d'
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'
  when:
    - openssh_agent_global_service_enabled | bool
    - __openssh_agent_unit_enableable | bool

- name: Service | Export SSH_AUTH_SOCK for the global ssh-agent service
  ansible.builtin.copy:
    content: |
      # ssh-agent socket (managed by Ansible)
      SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/{{ __openssh_agent_socket }}
    dest: '/etc/environment.d/40-ssh-agent.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when:
    - openssh_agent_global_service_enabled | bool
    - __openssh_agent_unit_enableable | bool

- name: Service | Remove SSH_AUTH_SOCK export for the global ssh-agent service
  ansible.builtin.file:
    path: '/etc/environment.d/40-ssh-agent.conf'
    state: absent
  when: >-
    not (openssh_agent_global_service_enabled | bool)
    or not (__openssh_agent_unit_enableable | bool)
