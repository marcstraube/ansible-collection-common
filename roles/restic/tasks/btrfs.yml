---
# NoCOW for log directory (write-heavy when file logging is enabled)

- name: BTRFS | Check filesystem type for log directory
  ansible.builtin.command:
    cmd: 'stat -f -c %T {{ restic_log_dir }}'
  register: __restic_log_fstype
  changed_when: false
  check_mode: false
  # Directory may not exist yet
  failed_when: false
  when: restic_log_to_file | bool

- name: BTRFS | Ensure log directory exists for NoCOW
  ansible.builtin.file:
    path: '{{ restic_log_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0750'
  when:
    - restic_log_to_file | bool
    - __restic_log_fstype.stdout | default('') == 'btrfs'

- name: BTRFS | Check NoCOW attribute on log directory
  ansible.builtin.command:
    cmd: 'lsattr -d {{ restic_log_dir }}'
  register: __restic_lsattr
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - restic_log_to_file | bool
    - __restic_log_fstype.stdout | default('') == 'btrfs'

# Only sets the attribute; owner and mode stay with the task or package
# that creates the directory.
- name: BTRFS | Set NoCOW on log directory  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: '{{ restic_log_dir }}'
    state: directory
    attributes: '+C'
  when:
    - restic_log_to_file | bool
    - __restic_log_fstype.stdout | default('') == 'btrfs'
    - "'C' not in (__restic_lsattr.stdout | default(''))"
