---
#
# Role Control
#

# Enable the utils role
utils_enabled: true

#
# System Monitors
#

# Interactive process viewer (htop)
utils_monitor_htop_enabled: true

# Modern resource monitor with TUI (btop++)
utils_monitor_btop_enabled: false

# System monitor with historical data (bottom)
utils_monitor_bottom_enabled: false

# Advanced system & process monitor with logging (atop)
utils_monitor_atop_enabled: false

# Modern process viewer with colourised output (procs)
# Not available on Rocky 10
utils_monitor_procs_enabled: false

#
# Disk Usage
#

# du replacement showing disk usage as a tree (dust)
# Not available on Rocky
utils_disk_dust_enabled: false

# df replacement with colourised filesystem overview (duf)
utils_disk_duf_enabled: false

#
# Secrets / Encryption
#

# Simple file encryption tool (age)
utils_secrets_age_enabled: false

# Editor for encrypted files (sops)
# Arch only
utils_secrets_sops_enabled: false

#
# Network Diagnostics
#

# DNS lookup tools — dig, nslookup, host (BIND tools package)
utils_net_dig_enabled: false

# mtr — combined traceroute and ping
utils_net_mtr_enabled: false

# traceroute (classic)
utils_net_traceroute_enabled: false

# nmap — port scanner / host discovery
utils_net_nmap_enabled: false

# iperf3 — bandwidth measurement tool
utils_net_iperf3_enabled: false

# netcat (OpenBSD flavour) — TCP/UDP swiss army knife
utils_net_netcat_enabled: false

# whois — domain registration info
utils_net_whois_enabled: false

# iftop — per-connection bandwidth TUI
utils_net_iftop_enabled: false

# nethogs — per-process bandwidth monitor
utils_net_nethogs_enabled: false

# HTTPie — modern command-line HTTP client
# Arch + Debian only (EPEL 9 ships httpie but with an unsatisfiable
# CRB-only python dependency; not packaged for EPEL 10)
utils_net_httpie_enabled: false

# xh — rust HTTPie reimplementation
# Arch + Debian only
utils_net_xh_enabled: false

# arp-scan — LAN host discovery via ARP
# Not available on Rocky 10
utils_net_arp_scan_enabled: false

#
# File Transfer
#

# Fast file copying tool (rsync)
utils_transfer_rsync_enabled: true

#
# Archive / Compression
#

# tar — POSIX tar archive tool.
# Required on RHEL minimal installs (Arch & Debian ship it in the
# base image and the package install is a no-op there).
utils_archive_tar_enabled: true

# zstd — modern, fast compressor (.zst).
# Default Arch package format and used by mkinitcpio, makepkg,
# btrfs send/receive, etc.
utils_archive_zstd_enabled: true

# zip — universal compressed archive format
# DEPRECATION: also present in marcstraube.common.base default
# packages (v2.0.x); v3.0.0 will remove it there and rely on this
# toggle exclusively.
utils_archive_zip_enabled: true

# unzip — counterpart to zip
# DEPRECATION: also present in marcstraube.common.base default
# packages (v2.0.x); v3.0.0 will remove it there and rely on this
# toggle exclusively.
utils_archive_unzip_enabled: true

# p7zip — 7-Zip clone (.7z high-compression archives).
# RHEL: in EPEL as p7zip + p7zip-plugins (both pulled in together).
utils_archive_p7zip_enabled: false

# unrar — extract proprietary RAR archives.
#   Arch: pulled from AUR — requires `aur_helper` set in
#         marcstraube.common.package_management (default 'paru').
#   Debian: lives in non-free — requires
#           `apt_non_free_enabled: true` in
#           marcstraube.common.package_management.
#   RHEL: lives in RPM Fusion non-free — requires
#           `dnf_rpmfusion_nonfree_enabled: true` in
#           marcstraube.common.package_management.
utils_archive_unrar_enabled: false

# atool — universal archive frontend that dispatches to
# tar/zip/7z/zstd/unrar/... based on file type.
utils_archive_atool_enabled: false

# pigz — parallel gzip, scales gzip across CPU cores.
utils_archive_pigz_enabled: false

#
# File Managers
#

# Midnight Commander (Norton Commander clone)
utils_filemgr_mc_enabled: true

# Vi-like file manager (vifm)
utils_filemgr_vifm_enabled: false

# Vi-like file manager with previews (ranger)
# Not available on Rocky 10
utils_filemgr_ranger_enabled: false

# Fast terminal file manager (nnn)
# Not available on Rocky 10
utils_filemgr_nnn_enabled: false

# Terminal file manager inspired by ranger (lf)
# Not available on Rocky
utils_filemgr_lf_enabled: false

#
# Search Tools
#

# Install ripgrep (fast grep replacement)
utils_search_ripgrep_enabled: false

# Install fd (fast find replacement)
utils_search_fd_enabled: true

#
# System Info (Fetch Tools)
#

# Fast system information tool written in C (fastfetch)
utils_fetch_fastfetch_enabled: true

# Maintained neofetch fork with pride flag support (hyfetch)
# Available on Arch and Debian only
utils_fetch_hyfetch_enabled: false

# Customizable system info script (archey4)
# Arch: AUR only
utils_fetch_archey4_enabled: false

# CPU architecture fetching tool (cpufetch)
# Arch only
utils_fetch_cpufetch_enabled: false

#
# Fun Tools (ASCII Art & Terminal Entertainment)
#

# Configurable talking cow (cowsay)
utils_fun_cowsay_enabled: false

# Random fortune cookies (fortune-mod)
utils_fun_fortune_enabled: false

# Rainbow text colorizer (lolcat)
# Not available on Rocky
utils_fun_lolcat_enabled: false

# Pony version of cowsay (ponysay)
# Not available on Rocky
utils_fun_ponysay_enabled: false

# Display large text banners (figlet)
utils_fun_figlet_enabled: false

# Display large colored text (toilet)
utils_fun_toilet_enabled: false

# Steam locomotive animation (sl)
utils_fun_sl_enabled: false

# Terminal Matrix screensaver (cmatrix)
# Not available on Rocky 10
utils_fun_cmatrix_enabled: false

# Bonsai tree generator (cbonsai)
# Arch: AUR only. Not available on Rocky 10
utils_fun_cbonsai_enabled: false

# ASCII aquarium animation (asciiquarium)
# Not available on Rocky 10
utils_fun_asciiquarium_enabled: false

# Terminal Nyan Cat animation (nyancat)
# Not available on Rocky 10
utils_fun_nyancat_enabled: false

# Recreate the "decrypting text" effect from Sneakers (no-more-secrets)
# Arch: AUR only. Not available on Rocky 10
utils_fun_no_more_secrets_enabled: false

# Digital clock for the terminal (tty-clock)
# Arch: AUR only. Not available on Rocky 10
utils_fun_tty_clock_enabled: false

# Animated pipes screensaver (pipes.sh)
# Arch: AUR only. Not available on Debian or Rocky
utils_fun_pipes_enabled: false

# Pokemon color scripts for the terminal (pokemon-colorscripts)
# Arch: AUR only. Not available on Debian or Rocky
utils_fun_pokemon_colorscripts_enabled: false

# Pokemon version of cowsay (pokemonsay)
# Arch: AUR only. Not available on Debian or Rocky
utils_fun_pokemonsay_enabled: false

# Fake Hollywood hacker terminal (hollywood)
# Not available on Rocky
utils_fun_hollywood_enabled: false
