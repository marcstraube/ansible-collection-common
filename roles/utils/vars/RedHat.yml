---
# EL 10 baseline — many EPEL packages not yet available
# For EL 9, see RedHat-9.yml
# Complements vars/main.yml (shared variables)

#
# System Monitors
#

__utils_monitor_bottom: ''
__utils_monitor_procs: ''

#
# Disk Usage
#

__utils_disk_dust: ''

#
# Network Diagnostics
#

__utils_net_dig: 'bind-utils'
__utils_net_netcat: 'netcat'
__utils_net_xh: ''  # not in Rocky
__utils_net_httpie: ''  # not in EPEL 10
__utils_net_arp_scan: ''  # not in EPEL 10

#
# Archive / Compression
#

# p7zip on EPEL ships in two packages — p7zip (7zr) plus p7zip-plugins
# (full 7z, 7za with all codecs). Install both.
__utils_archive_p7zip:
  - 'p7zip'
  - 'p7zip-plugins'
# unrar lives in RPM Fusion non-free (not in EPEL). Enable the repo
# via marcstraube.common.package_management's dnf_rpmfusion_nonfree_enabled
# toggle (default false); then this entry installs the package directly.
__utils_archive_unrar: 'unrar'
# atool is not packaged for EPEL 10 (EPEL 9 has it — see RedHat-9.yml).
__utils_archive_atool: ''

#
# File Managers
#

__utils_filemgr_ranger: ''
__utils_filemgr_nnn: ''
__utils_filemgr_lf: ''

#
# Search Tools
#

__utils_search_fd: 'fd-find'

#
# Developer Tools
#

# EPEL's yq package is the Go implementation; the Python wrapper is not
# packaged. ShellCheck comes from EPEL; shfmt and direnv are not packaged.
# pre-commit (EPEL) needs python3-wheel-wheel from CRB.
__utils_dev_yq: ''
__utils_dev_go_yq: 'yq'
__utils_dev_shellcheck: 'ShellCheck'
__utils_dev_shfmt: ''
__utils_dev_direnv: ''

#
# System Info (Fetch Tools)
#

__utils_fetch_hyfetch: ''
__utils_fetch_cpufetch: ''

#
# Fun Tools
#

__utils_fun_cowsay: ''
__utils_fun_lolcat: ''
__utils_fun_ponysay: ''
__utils_fun_cmatrix: ''
__utils_fun_cbonsai: ''
__utils_fun_asciiquarium: ''
__utils_fun_nyancat: ''
__utils_fun_no_more_secrets: ''
__utils_fun_tty_clock: ''
__utils_fun_hollywood: ''
