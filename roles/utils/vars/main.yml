---
# Shared variables — identical across all supported platforms.
# OS-specific overrides live in Archlinux.yml, Debian.yml, RedHat.yml, RedHat-9.yml.

#
# System Monitors
#

__utils_monitor_htop: 'htop'
__utils_monitor_btop: 'btop'
__utils_monitor_atop: 'atop'

#
# Disk Usage
#

__utils_disk_duf: 'duf'

#
# Secrets / Encryption
#

__utils_secrets_age: 'age'  # pragma: allowlist secret
__utils_secrets_sops: ''  # pragma: allowlist secret

#
# Network Diagnostics
# Tools available on all distros (or with EL 10 override below) live here.
#

__utils_net_mtr: 'mtr'
__utils_net_traceroute: 'traceroute'
__utils_net_nmap: 'nmap'
__utils_net_iperf3: 'iperf3'
__utils_net_whois: 'whois'
__utils_net_iftop: 'iftop'
__utils_net_nethogs: 'nethogs'
# arp-scan is in EPEL 9 but not EPEL 10 — RedHat.yml clears it
# httpie ships only on Arch and Debian (EL excluded due to dep issues) —
# RedHat.yml AND RedHat-9.yml both clear it
__utils_net_httpie: 'httpie'
__utils_net_arp_scan: 'arp-scan'

#
# File Transfer
#

__utils_transfer_rsync: 'rsync'

#
# File Managers
#

__utils_filemgr_mc: 'mc'
__utils_filemgr_vifm: 'vifm'

#
# Search Tools
#

__utils_search_ripgrep: 'ripgrep'

#
# System Info (Fetch Tools)
#

__utils_fetch_fastfetch: 'fastfetch'
__utils_fetch_archey4: ''

#
# Fun Tools
#

__utils_fun_fortune: 'fortune-mod'
__utils_fun_figlet: 'figlet'
__utils_fun_toilet: 'toilet'
__utils_fun_sl: 'sl'
__utils_fun_pipes: ''
__utils_fun_pokemon_colorscripts: ''
__utils_fun_pokemonsay: ''
