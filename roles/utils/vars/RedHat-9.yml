---
# EL 9 — EPEL provides additional packages not available on EL 10
# Complements vars/main.yml (shared variables)

#
# System Monitors
#

__utils_monitor_bottom: ''
__utils_monitor_procs: 'procs'

#
# Disk Usage
#

__utils_disk_dust: ''

#
# Network Diagnostics
# arp-scan inherits from main.yml — in EPEL 9
# httpie is listed in EPEL 9 but pulls in python3.9dist(pygments) which lives
# in CRB only — install fails with default repo set, so override to ''
#

__utils_net_dig: 'bind-utils'
__utils_net_netcat: 'netcat'
__utils_net_xh: ''  # not in Rocky
__utils_net_httpie: ''  # EPEL 9 package has unsatisfiable CRB-only dependency

#
# Archive / Compression
# (Same as RedHat.yml — RHEL-9 vars override the os_family file
# entirely when present, so archive entries are repeated here.)
#

__utils_archive_p7zip:
  - 'p7zip'
  - 'p7zip-plugins'
# unrar from RPM Fusion non-free — requires
# dnf_rpmfusion_nonfree_enabled in marcstraube.common.package_management.
__utils_archive_unrar: 'unrar'

#
# File Managers
#

__utils_filemgr_ranger: 'ranger'
__utils_filemgr_nnn: 'nnn'
__utils_filemgr_lf: ''

#
# Search Tools
#

__utils_search_fd: 'fd-find'

#
# System Info (Fetch Tools)
#

__utils_fetch_hyfetch: ''
__utils_fetch_cpufetch: ''

#
# Fun Tools
#

__utils_fun_cowsay: 'cowsay'
__utils_fun_lolcat: ''
__utils_fun_ponysay: ''
__utils_fun_cmatrix: 'cmatrix'
__utils_fun_cbonsai: 'cbonsai'
__utils_fun_asciiquarium: 'asciiquarium'
__utils_fun_nyancat: 'nyancat'
__utils_fun_no_more_secrets: 'no-more-secrets'
__utils_fun_tty_clock: 'tty-clock'
__utils_fun_hollywood: ''
