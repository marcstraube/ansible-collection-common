---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    go_enabled: true
    # Packaged on Arch Linux and Debian; a documented no-op on EL
    go_govulncheck_enabled: true

  tasks:
    - name: Converge | Include go role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
