---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    #
    # Load Role Variables
    #

    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '../../vars'

    #
    # Package Verification
    #

    - name: Verify | Check ClamAV package is installed
      ansible.builtin.package:
        name: clamav
        state: present
      check_mode: true
      register: __verify_pkg_check
      failed_when: __verify_pkg_check.changed

    #
    # Configuration Files
    #

    - name: Verify | Set config path facts
      ansible.builtin.set_fact:
        __verify_clamd_conf_path: >-
          {{ '/etc/clamd.d/scan.conf' if ansible_facts['os_family'] == 'RedHat'
          else '/etc/clamav/clamd.conf' }}
        __verify_freshclam_conf_path: >-
          {{ '/etc/freshclam.conf' if ansible_facts['os_family'] == 'RedHat'
          else '/etc/clamav/freshclam.conf' }}

    - name: Verify | Check clamd.conf exists
      ansible.builtin.stat:
        path: '{{ __verify_clamd_conf_path }}'
      register: __verify_clamd_conf

    - name: Verify | Assert clamd.conf exists
      ansible.builtin.assert:
        that:
          - __verify_clamd_conf.stat.exists
        fail_msg: 'clamd.conf does not exist at {{ __verify_clamd_conf_path }}'

    - name: Verify | Check freshclam.conf exists
      ansible.builtin.stat:
        path: '{{ __verify_freshclam_conf_path }}'
      register: __verify_freshclam_conf

    - name: Verify | Assert freshclam.conf exists
      ansible.builtin.assert:
        that:
          - __verify_freshclam_conf.stat.exists
        fail_msg: 'freshclam.conf does not exist'

    #
    # Configuration Content
    #

    - name: Verify | Read clamd.conf content
      ansible.builtin.slurp:
        src: '{{ __verify_clamd_conf_path }}'
      register: __verify_clamd_content

    - name: Verify | Set clamd content fact
      ansible.builtin.set_fact:
        __verify_clamd_text: '{{ __verify_clamd_content.content | b64decode }}'

    - name: Verify | Assert clamd.conf contains ansible_managed header
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in __verify_clamd_text"
        fail_msg: 'clamd.conf missing ansible_managed header'

    - name: Verify | Assert clamd.conf contains custom settings
      ansible.builtin.assert:
        that:
          - "'MaxFileSize 50M' in __verify_clamd_text"
          - "'MaxThreads 5' in __verify_clamd_text"
          - "'ScanMail yes' in __verify_clamd_text"
          - "'ScanArchive yes' in __verify_clamd_text"
          - "'LogVerbose yes' in __verify_clamd_text"
          - "'DetectPUA yes' in __verify_clamd_text"
          - "'ExcludePUA NetTool' in __verify_clamd_text"
          - "'ExcludePUA PWTool' in __verify_clamd_text"
          - "'BytecodeSecurity TrustSigned' in __verify_clamd_text"
          - "'ExcludePath ^/proc/' in __verify_clamd_text"
          - "'ExcludePath ^/sys/' in __verify_clamd_text"
        fail_msg: 'clamd.conf does not contain expected settings'

    - name: Verify | Assert clamd.conf contains limit directives
      ansible.builtin.assert:
        that:
          - "'MaxScanTime' in __verify_clamd_text"
          - "'MaxEmbeddedPE' in __verify_clamd_text"
          - "'MaxHTMLNormalize' in __verify_clamd_text"
          - "'MaxQueue' in __verify_clamd_text"
          - "'IdleTimeout' in __verify_clamd_text"
          - "'SelfCheck' in __verify_clamd_text"
          - "'ExtendedDetectionInfo' in __verify_clamd_text"
        fail_msg: 'clamd.conf missing limit/daemon directives'

    - name: Verify | Read freshclam.conf content
      ansible.builtin.slurp:
        src: '{{ __verify_freshclam_conf_path }}'
      register: __verify_freshclam_content

    - name: Verify | Set freshclam content fact
      ansible.builtin.set_fact:
        __verify_freshclam_text: '{{ __verify_freshclam_content.content | b64decode }}'

    - name: Verify | Assert freshclam.conf contains ansible_managed header
      ansible.builtin.assert:
        that:
          - "'Ansible managed' in __verify_freshclam_text"
        fail_msg: 'freshclam.conf missing ansible_managed header'

    - name: Verify | Assert freshclam.conf contains required directives
      ansible.builtin.assert:
        that:
          - "'DatabaseDirectory' in __verify_freshclam_text"
          - "'DatabaseOwner' in __verify_freshclam_text"
          - "'Checks 12' in __verify_freshclam_text"
          - "'DatabaseMirror database.clamav.net' in __verify_freshclam_text"
          - "'ConnectTimeout' in __verify_freshclam_text"
          - "'ReceiveTimeout' in __verify_freshclam_text"
          - "'ScriptedUpdates' in __verify_freshclam_text"
          - "'TestDatabases' in __verify_freshclam_text"
        fail_msg: 'freshclam.conf missing expected directives'

    #
    # Directory Structure
    #

    - name: Verify | Check ClamAV database directory exists
      ansible.builtin.stat:
        path: /var/lib/clamav
      register: __verify_db_dir

    - name: Verify | Assert database directory exists
      ansible.builtin.assert:
        that:
          - __verify_db_dir.stat.exists
          - __verify_db_dir.stat.isdir
        fail_msg: 'ClamAV database directory does not exist'

    - name: Verify | Check log directory exists
      ansible.builtin.stat:
        path: /var/log/clamav
      register: __verify_log_dir

    - name: Verify | Assert log directory exists
      ansible.builtin.assert:
        that:
          - __verify_log_dir.stat.exists
          - __verify_log_dir.stat.isdir
        fail_msg: 'ClamAV log directory does not exist'

    - name: Verify | Check run directory exists
      ansible.builtin.stat:
        path: /run/clamav
      register: __verify_run_dir

    - name: Verify | Assert run directory exists
      ansible.builtin.assert:
        that:
          - __verify_run_dir.stat.exists
          - __verify_run_dir.stat.isdir
        fail_msg: 'ClamAV run directory does not exist'

    #
    # User/Group Verification
    #

    - name: Verify | Set expected user fact
      ansible.builtin.set_fact:
        __verify_expected_user: >-
          {{ 'clamscan' if ansible_facts['os_family'] == 'RedHat' else 'clamav' }}

    - name: Verify | Get ClamAV user info
      ansible.builtin.getent:
        database: passwd
        key: '{{ __verify_expected_user }}'
      register: __verify_clamav_user

    - name: Verify | Assert ClamAV user exists
      ansible.builtin.assert:
        that:
          - __verify_clamav_user.ansible_facts.getent_passwd is defined
        fail_msg: 'ClamAV user {{ __verify_expected_user }} does not exist'

    #
    # File Permissions
    #

    - name: Verify | Check clamd.conf permissions
      ansible.builtin.assert:
        that:
          - __verify_clamd_conf.stat.mode == '0644'
        fail_msg: 'clamd.conf has incorrect permissions'

    - name: Verify | Check freshclam.conf permissions
      ansible.builtin.assert:
        that:
          - __verify_freshclam_conf.stat.mode == '0640'
        fail_msg: 'freshclam.conf has incorrect permissions (should be 0640)'

    #
    # Functional Test
    #

    - name: Verify | Test clamscan version
      ansible.builtin.command: clamscan --version
      register: __verify_clamscan_version
      changed_when: false
      failed_when: __verify_clamscan_version.rc != 0

    - name: Verify | Assert clamscan is working
      ansible.builtin.assert:
        that:
          - "'ClamAV' in __verify_clamscan_version.stdout"
        fail_msg: 'clamscan version output unexpected'

    #
    # Service Verification
    #

    # No module reads a unit property, hence systemctl show
    - name: Verify | Read the main PID of the ClamAV daemon  # noqa: command-instead-of-module
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=MainPID
          - --value
          - '{{ __clamav_daemon_service }}'
      register: __verify_daemon_pid
      changed_when: false

    - name: Verify | Assert the ClamAV daemon is running
      ansible.builtin.assert:
        that:
          - __verify_daemon_pid.stdout | trim not in ['', '0']
        fail_msg: 'The ClamAV daemon {{ __clamav_daemon_service }} is not running'
        success_msg: 'The ClamAV daemon runs with PID {{ __verify_daemon_pid.stdout | trim }}'

    #
    # Targeted package update (side_effect rolled the packages back and ran
    # the converge playbook with clamav_packages_state: latest)
    #

    - name: Verify | Stat the version record
      ansible.builtin.stat:
        path: /root/clamav-update-versions
      register: __verify_update_stat

    - name: Verify | Read the clamav package versions around the rollback
      ansible.builtin.slurp:
        src: /root/clamav-update-versions
      register: __verify_update_versions
      when: __verify_update_stat.stat.exists

    - name: Verify | Gather package facts after the update
      ansible.builtin.package_facts:
      when: __verify_update_stat.stat.exists

    - name: Verify | Set update version facts
      ansible.builtin.set_fact:
        __verify_version_latest: '{{ (__verify_update_versions.content | b64decode).splitlines()[0] | trim }}'
        __verify_version_rolled_back: '{{ (__verify_update_versions.content | b64decode).splitlines()[1] | trim }}'
        __verify_version_now: >-
          {{ [(ansible_facts['packages']['clamav'] | first).version,
              (ansible_facts['packages']['clamav'] | first).release | default('')]
             | select | join('-') }}
      when: __verify_update_stat.stat.exists

    # Without a rollback (the repository holds only one build) the update
    # changed nothing and there is no restart to check
    - name: Verify | Decide whether the update replaced the packages
      ansible.builtin.set_fact:
        __verify_update_replaced: >-
          {{ __verify_update_stat.stat.exists
             and __verify_version_rolled_back != __verify_version_latest }}

    - name: Verify | Assert the update restored the latest build
      ansible.builtin.assert:
        that:
          - __verify_version_now == __verify_version_latest
        fail_msg: >-
          clamav is at {{ __verify_version_now }} after the update, expected
          {{ __verify_version_latest }} (rolled back to {{ __verify_version_rolled_back }})
        success_msg: >-
          Updated from {{ __verify_version_rolled_back }} to {{ __verify_version_now }}
      when: __verify_update_replaced | bool

    # readlink reports a replaced binary as "<path> (deleted)"
    - name: Verify | Read the binary of the running ClamAV daemon
      ansible.builtin.command:
        argv:
          - readlink
          - '/proc/{{ __verify_daemon_pid.stdout | trim }}/exe'
      register: __verify_daemon_exe
      changed_when: false
      when: __verify_update_replaced | bool

    - name: Verify | Assert the ClamAV daemon runs the updated binary
      ansible.builtin.assert:
        that:
          - __verify_daemon_exe.stdout is not search(' \(deleted\)$')
        fail_msg: 'The ClamAV daemon still runs the replaced binary: {{ __verify_daemon_exe.stdout }}'
        success_msg: 'The ClamAV daemon runs the updated binary'
      when: __verify_update_replaced | bool

    # side_effect blocks the package restart on Debian, so the role has to
    # restart clamd there; where the package restarts it, the role must not
    # restart it again. Either way the update starts clamd exactly once.
    - name: Verify | Read the ClamAV daemon starts since the update
      ansible.builtin.command:
        argv:
          - journalctl
          - '--unit={{ __clamav_daemon_service }}'
          - '--since=@{{ __verify_update_stat.stat.mtime }}'
          - '--output=cat'
          - '--no-pager'
      register: __verify_update_journal
      changed_when: false
      when: __verify_update_replaced | bool

    - name: Verify | Assert the update restarted the ClamAV daemon exactly once
      ansible.builtin.assert:
        that:
          - __verify_update_starts | length == 1
        fail_msg: >-
          The ClamAV daemon started {{ __verify_update_starts | length }} times after the
          package update: {{ __verify_update_starts }}
        success_msg: 'The ClamAV daemon started once after the package update'
      vars:
        __verify_update_starts: >-
          {{ __verify_update_journal.stdout_lines | select('match', '^Started ') | list }}
      when: __verify_update_replaced | bool
