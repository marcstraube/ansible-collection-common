---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    # Drop-ins as other roles of the collection write them (NN-role-<role>
    # and NN-role-<role>-<purpose>), plus one file nobody manages. The
    # purge in converge must keep the former and remove the latter.
    - name: Prepare | Seed role-owned and unmanaged sudoers.d drop-ins
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: '/etc/sudoers.d/{{ item.name }}'
        owner: root
        group: root
        mode: '0440'
      loop:
        - name: '99-role-package_management'
          content: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        - name: '60-role-podman-minikube'
          content: 'johndoe ALL=(ALL) NOPASSWD: /usr/bin/podman'
        - name: '40-unmanaged'
          content: 'johndoe ALL=(ALL) /usr/bin/true'
      loop_control:
        label: '{{ item.name }}'
