---
# Runs against a single inventory host so the key pair is created once;
# the implicit localhost has no inventory_dir to resolve the source path from.
- name: Prepare SSH key files on the controller
  hosts: all[0]
  gather_facts: false

  tasks:
    - name: Prepare | Create inventory SSH key source directory
      ansible.builtin.file:
        path: '{{ inventory_dir }}/files/ssh'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Prepare | Generate test key pair for deployment
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N '' -C 'keyfile-test@molecule'
          -f {{ inventory_dir }}/files/ssh/molecule_test_key
        creates: '{{ inventory_dir }}/files/ssh/molecule_test_key'
      delegate_to: localhost
      become: false

- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux:
        - openssh
      Debian:
        - openssh-client
      RedHat:
        - openssh

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5

    # Create orphan user for exclusive mode test
    - name: Prepare | Create orphan user for exclusive mode test
      ansible.builtin.user:
        name: 'orphanuser'
        uid: 3099
        state: present
