---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux:
        - base-devel
      Debian: []
      RedHat: []

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5
      when: __prepare_packages[ansible_facts["os_family"]] | length > 0

    - name: Prepare | Create aur_builder user for AUR packages (Arch)
      ansible.builtin.user:
        name: aur_builder
        group: wheel
        create_home: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Allow aur_builder passwordless sudo (Arch)
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/99-aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        create: true
        owner: root
        group: root
        mode: '0440'
      when: ansible_facts['os_family'] == 'Archlinux'

    # aide-check.sh sends its notifications with mail(1); the stand-in writes
    # each message to an outbox the verify step reads. /var/spool is writable
    # under ProtectSystem=full and excluded from the AIDE check.
    - name: Prepare | Create outbox directory for the mail stand-in
      ansible.builtin.file:
        path: /var/spool/mail-stub
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Prepare | Install mail stand-in
      ansible.builtin.copy:
        dest: /usr/local/bin/mail
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          # Stand-in for mail(1): appends the message to the outbox
          subject=''
          while getopts s: opt; do
              case "${opt}" in
                  s) subject="${OPTARG}" ;;
                  *) exit 2 ;;
              esac
          done
          shift $((OPTIND - 1))
          {
              printf 'To: %s\nSubject: %s\n\n' "$*" "${subject}"
              cat
              printf '\n'
          } >> /var/spool/mail-stub/outbox
