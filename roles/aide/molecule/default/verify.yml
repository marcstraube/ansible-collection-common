---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify | Load OS-specific variables
      ansible.builtin.include_vars: '{{ item }}'
      with_first_found:
        - files:
            - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
            - '{{ ansible_facts["distribution"] }}.yml'
            - '{{ ansible_facts["os_family"] }}.yml'
          paths:
            - '../../vars'

    - name: Verify | Skip host when AIDE is a Layer-1 no-op on this platform
      ansible.builtin.meta: end_host
      when: __aide_package | default('') | length == 0

    #
    # Package and Binary Verification
    #

    - name: Verify | Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | Assert AIDE package is installed
      ansible.builtin.assert:
        that:
          - "'aide' in ansible_facts.packages"
        fail_msg: "AIDE package is not installed"
        success_msg: "AIDE package is installed"

    - name: Verify | Check aide binary exists  # noqa: command-instead-of-shell
      ansible.builtin.shell:
        cmd: command -v aide
      register: aide_binary
      changed_when: false
      failed_when: aide_binary.rc != 0

    - name: Verify | Assert AIDE binary location
      ansible.builtin.assert:
        that:
          - aide_binary.stdout | length > 0
          - "'/aide' in aide_binary.stdout"
        fail_msg: "AIDE binary not found in expected location"
        success_msg: "AIDE binary found at {{ aide_binary.stdout }}"

    #
    # Configuration File Verification
    #

    - name: Verify | Check AIDE config file exists (Debian)
      ansible.builtin.stat:
        path: '/etc/aide/aide.conf'
      register: aide_config_debian
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check AIDE config file exists (non-Debian)
      ansible.builtin.stat:
        path: '/etc/aide.conf'
      register: aide_config_other
      when: ansible_facts['os_family'] != 'Debian'

    - name: Verify | Assert AIDE config exists (Debian)
      ansible.builtin.assert:
        that:
          - aide_config_debian.stat.exists
          - aide_config_debian.stat.isreg
          - aide_config_debian.stat.mode == '0600'
        fail_msg: "AIDE config file missing or has wrong permissions (Debian)"
        success_msg: "AIDE config file exists with correct permissions (Debian)"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert AIDE config exists (non-Debian)
      ansible.builtin.assert:
        that:
          - aide_config_other.stat.exists
          - aide_config_other.stat.isreg
          - aide_config_other.stat.mode == '0600'
        fail_msg: "AIDE config file missing or has wrong permissions"
        success_msg: "AIDE config file exists with correct permissions"
      when: ansible_facts['os_family'] != 'Debian'

    - name: Verify | Read AIDE config content (Debian)
      ansible.builtin.slurp:
        src: '/etc/aide/aide.conf'
      register: aide_config_content_debian
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Read AIDE config content (non-Debian)
      ansible.builtin.slurp:
        src: '/etc/aide.conf'
      register: aide_config_content_other
      when: ansible_facts['os_family'] != 'Debian'

    - name: Verify | Set AIDE config content fact
      ansible.builtin.set_fact:
        aide_config_decoded: >-
          {{
            (aide_config_content_debian.content | default('') | b64decode)
            if ansible_facts['os_family'] == 'Debian'
            else (aide_config_content_other.content | default('') | b64decode)
          }}

    - name: Verify | Assert AIDE config contains monitoring rules
      ansible.builtin.assert:
        that:
          - "'database_in=' in aide_config_decoded or 'database=' in aide_config_decoded"
          - "'/usr/bin' in aide_config_decoded"
          - "'/etc' in aide_config_decoded"
        fail_msg: "AIDE config missing essential monitoring rules"
        success_msg: "AIDE config contains required monitoring rules"

    - name: Verify | Assert custom monitoring rule
      ansible.builtin.assert:
        that:
          - "'/opt/test' in aide_config_decoded"
        fail_msg: "Custom monitoring rule not found in config"
        success_msg: "Custom monitoring rule configured correctly"

    - name: Verify | Assert /home monitoring is not enabled by default
      ansible.builtin.assert:
        that:
          - "'/home NORMAL' not in aide_config_decoded"
        fail_msg: "/home monitoring should not be enabled by default"
        success_msg: "/home monitoring correctly disabled by default"

    #
    # Database Verification
    #

    - name: Verify | Check AIDE database directory exists
      ansible.builtin.stat:
        path: '/var/lib/aide'
      register: aide_db_dir

    - name: Verify | Assert AIDE database directory
      ansible.builtin.assert:
        that:
          - aide_db_dir.stat.exists
          - aide_db_dir.stat.isdir
        fail_msg: "AIDE database directory does not exist"
        success_msg: "AIDE database directory exists"

    - name: Verify | Check if AIDE database file exists (gzip)
      ansible.builtin.stat:
        path: '/var/lib/aide/aide.db.gz'
      register: aide_database_gz

    - name: Verify | Check if AIDE database file exists (plain)
      ansible.builtin.stat:
        path: '/var/lib/aide/aide.db'
      register: aide_database_plain

    - name: Verify | Assert AIDE database was initialized
      ansible.builtin.assert:
        that:
          - aide_database_gz.stat.exists or aide_database_plain.stat.exists
        fail_msg: "AIDE database not initialized"
        success_msg: "AIDE database initialized successfully"

    #
    # Scheduled Check Verification
    #

    - name: Verify | Check AIDE check script exists
      ansible.builtin.stat:
        path: '/usr/local/bin/aide-check.sh'
      register: aide_check_script

    - name: Verify | Assert AIDE check script
      ansible.builtin.assert:
        that:
          - aide_check_script.stat.exists
          - aide_check_script.stat.isreg
          - aide_check_script.stat.mode == '0755'
          - aide_check_script.stat.executable
        fail_msg: "AIDE check script missing or not executable"
        success_msg: "AIDE check script exists and is executable"

    #
    # Systemd Timer Verification
    #

    - name: Verify | Check AIDE systemd service file
      ansible.builtin.stat:
        path: '/etc/systemd/system/aide-check.service'
      register: aide_service_file

    - name: Verify | Assert AIDE systemd service
      ansible.builtin.assert:
        that:
          - aide_service_file.stat.exists
          - aide_service_file.stat.isreg
        fail_msg: "AIDE systemd service file missing"
        success_msg: "AIDE systemd service file exists"

    - name: Verify | Read AIDE systemd service content
      ansible.builtin.slurp:
        src: '/etc/systemd/system/aide-check.service'
      register: aide_service_content

    - name: Verify | Assert systemd hardening directives
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=full' in (aide_service_content.content | b64decode)"
          - "'ProtectHome=read-only' in (aide_service_content.content | b64decode)"
          - "'PrivateTmp=true' in (aide_service_content.content | b64decode)"
          - "'NoNewPrivileges=true' in (aide_service_content.content | b64decode)"
        fail_msg: "AIDE systemd service missing hardening directives"
        success_msg: "AIDE systemd service has hardening directives"

    - name: Verify | Check AIDE systemd timer file
      ansible.builtin.stat:
        path: '/etc/systemd/system/aide-check.timer'
      register: aide_timer_file

    - name: Verify | Assert AIDE systemd timer
      ansible.builtin.assert:
        that:
          - aide_timer_file.stat.exists
          - aide_timer_file.stat.isreg
        fail_msg: "AIDE systemd timer file missing"
        success_msg: "AIDE systemd timer file exists"

    - name: Verify | Get AIDE timer status
      ansible.builtin.systemd_service:
        name: aide-check.timer
      register: aide_timer_status

    - name: Verify | Assert AIDE timer is enabled and running
      ansible.builtin.assert:
        that:
          - aide_timer_status.status.ActiveState == 'active'
          - aide_timer_status.status.UnitFileState == 'enabled'
        fail_msg: "AIDE timer not active or enabled"
        success_msg: "AIDE timer is active and enabled"

    #
    # Log Directory Verification
    #

    - name: Verify | Check AIDE log directory
      ansible.builtin.stat:
        path: '/var/log/aide'
      register: aide_log_dir

    - name: Verify | Assert AIDE log directory exists
      ansible.builtin.assert:
        that:
          - aide_log_dir.stat.exists
          - aide_log_dir.stat.isdir
        fail_msg: "AIDE log directory does not exist"
        success_msg: "AIDE log directory exists"

    #
    # Functional Tests
    #

    - name: Verify | Test AIDE version command
      ansible.builtin.command:
        cmd: aide --version
      register: aide_version
      changed_when: false
      failed_when: aide_version.rc != 0

    - name: Verify | Set AIDE version output fact
      ansible.builtin.set_fact:
        aide_version_output: >-
          {{ aide_version.stdout | default("", true) }}{{ aide_version.stderr | default("", true) }}

    - name: Verify | Assert AIDE version output
      ansible.builtin.assert:
        that:
          - aide_version_output | length > 0
          - "'AIDE' in aide_version_output or 'aide' in aide_version_output"
        fail_msg: "AIDE version command failed"
        success_msg: "AIDE version output received"

    - name: Verify | Set AIDE config path fact
      ansible.builtin.set_fact:
        aide_config_path: >-
          {{ '/etc/aide/aide.conf'
             if ansible_facts['os_family'] == 'Debian'
             else '/etc/aide.conf' }}

    - name: Verify | Test AIDE check command (dry-run)
      ansible.builtin.command:
        cmd: 'aide --check -c {{ aide_config_path }}'
      register: aide_check_test
      changed_when: false
      failed_when: false

    - name: Verify | Show AIDE check result (informational)
      ansible.builtin.debug:
        msg: "AIDE check exit code: {{ aide_check_test.rc }} (0 = no changes, 1-7 = changes, 14 and above = error)"

    - name: Verify | Create test file to verify monitoring
      ansible.builtin.file:
        path: '/opt/test/testfile.txt'
        state: touch
        owner: root
        group: root
        mode: '0644'

    #
    # Exit Code Handling (aide-check.service)
    #

    - name: Verify | Assert AIDE change exit codes count as success
      ansible.builtin.assert:
        that:
          - "'SuccessExitStatus=1 2 3 4 5 6 7' in (aide_service_content.content | b64decode)"
        fail_msg: "AIDE systemd service does not accept the change exit codes 1-7"
        success_msg: "AIDE systemd service accepts the change exit codes 1-7"

    # Each run restores the database and the mail stand-in and resets the unit
    # in `always`, so a failed assert leaves the instance usable for the next
    # verify.

    # Changes: the unit succeeds and a change mail is sent

    - name: Verify | Run with a changed file
      block:
        - name: Verify | Clear the mail outbox before the change run
          ansible.builtin.file:
            path: /var/spool/mail-stub/outbox
            state: absent

        - name: Verify | Run AIDE check service with a changed file
          ansible.builtin.systemd_service:
            name: aide-check.service
            state: started
          # Asserted below with the unit state
          failed_when: false

        - name: Verify | Get AIDE check service state after the change run
          ansible.builtin.systemd_service:
            name: aide-check.service
          register: aide_change_unit

        - name: Verify | Read the mail outbox after the change run
          ansible.builtin.slurp:
            src: /var/spool/mail-stub/outbox
          register: aide_change_mail

        - name: Verify | Assert changes leave the unit not failed and send a change mail
          ansible.builtin.assert:
            that:
              - aide_change_unit.status.ActiveState in ['active', 'inactive']
              - aide_change_unit.status.Result == 'success'
              - aide_change_unit.status.ExecMainStatus | int in range(1, 8)
              - "'To: admin@example.com' in (aide_change_mail.content | b64decode)"
              - >-
                'Subject: [AIDE] File Integrity Check Report: changes detected on '
                in (aide_change_mail.content | b64decode)
              - "'/opt/test/testfile.txt' in (aide_change_mail.content | b64decode)"
              - "'AIDE Error' not in (aide_change_mail.content | b64decode)"
            fail_msg: >-
              AIDE change run: ActiveState={{ aide_change_unit.status.ActiveState }},
              Result={{ aide_change_unit.status.Result }},
              ExecMainStatus={{ aide_change_unit.status.ExecMainStatus }}
            success_msg: "AIDE changes reported by mail, unit not failed"

      always:
        - name: Verify | Reset the AIDE check service after the change run
          ansible.builtin.command:
            argv:
              - systemctl
              - reset-failed
              - aide-check.service
          changed_when: true

    # Error: a missing database fails the unit and sends an error mail

    - name: Verify | Run without a database
      block:
        - name: Verify | Clear the mail outbox before the error run
          ansible.builtin.file:
            path: /var/spool/mail-stub/outbox
            state: absent

        - name: Verify | Move the AIDE database away
          ansible.builtin.command:
            argv:
              - mv
              - /var/lib/aide/aide.db.gz
              - /var/lib/aide/aide.db.gz.verify
            removes: /var/lib/aide/aide.db.gz

        - name: Verify | Run AIDE check service without a database
          ansible.builtin.systemd_service:
            name: aide-check.service
            state: started
          # Expected to fail, asserted below
          failed_when: false

        - name: Verify | Get AIDE check service state after the error run
          ansible.builtin.systemd_service:
            name: aide-check.service
          register: aide_error_unit

        - name: Verify | Read the mail outbox after the error run
          ansible.builtin.slurp:
            src: /var/spool/mail-stub/outbox
          register: aide_error_mail

        - name: Verify | Assert a missing database fails the unit and sends an error mail
          ansible.builtin.assert:
            that:
              - aide_error_unit.status.ActiveState == 'failed'
              - aide_error_unit.status.Result == 'exit-code'
              - aide_error_unit.status.ExecMainStatus | int >= 14
              - "'Subject: AIDE Error: integrity check failed' in (aide_error_mail.content | b64decode)"
              - "'AIDE check failed! Exit code: ' in (aide_error_mail.content | b64decode)"
              - "'ERROR:' in (aide_error_mail.content | b64decode)"
              - "'changes detected' not in (aide_error_mail.content | b64decode)"
            fail_msg: >-
              AIDE error run: ActiveState={{ aide_error_unit.status.ActiveState }},
              Result={{ aide_error_unit.status.Result }},
              ExecMainStatus={{ aide_error_unit.status.ExecMainStatus }}
            success_msg: "AIDE error reported by mail with the AIDE output, unit failed"

      always:
        - name: Verify | Restore the AIDE database
          ansible.builtin.command:
            argv:
              - mv
              - /var/lib/aide/aide.db.gz.verify
              - /var/lib/aide/aide.db.gz
            removes: /var/lib/aide/aide.db.gz.verify

        - name: Verify | Reset the AIDE check service after the error run
          ansible.builtin.command:
            argv:
              - systemctl
              - reset-failed
              - aide-check.service
          changed_when: true

    # Mail failure: a failing mail(1) fails the unit with exit code 70

    - name: Verify | Run with a failing mail command
      block:
        - name: Verify | Move the mail stand-in away
          ansible.builtin.command:
            argv:
              - mv
              - /usr/local/bin/mail
              - /usr/local/bin/mail.verify
            removes: /usr/local/bin/mail

        - name: Verify | Install a failing mail command
          ansible.builtin.copy:
            dest: /usr/local/bin/mail
            owner: root
            group: root
            mode: '0755'
            content: |
              #!/bin/sh
              exit 1

        - name: Verify | Run AIDE check service with a failing mail command
          ansible.builtin.systemd_service:
            name: aide-check.service
            state: started
          # Expected to fail, asserted below
          failed_when: false

        - name: Verify | Get AIDE check service state after the mail failure run
          ansible.builtin.systemd_service:
            name: aide-check.service
          register: aide_mail_unit

        - name: Verify | Assert a failing mail command fails the unit with exit code 70
          ansible.builtin.assert:
            that:
              - aide_mail_unit.status.ActiveState == 'failed'
              - aide_mail_unit.status.Result == 'exit-code'
              - aide_mail_unit.status.ExecMainStatus | int == 70
            fail_msg: >-
              AIDE mail failure run: ActiveState={{ aide_mail_unit.status.ActiveState }},
              Result={{ aide_mail_unit.status.Result }},
              ExecMainStatus={{ aide_mail_unit.status.ExecMainStatus }}
            success_msg: "Failing mail command fails the unit with exit code 70"

      always:
        - name: Verify | Restore the mail stand-in
          ansible.builtin.command:
            argv:
              - mv
              - -f
              - /usr/local/bin/mail.verify
              - /usr/local/bin/mail
            removes: /usr/local/bin/mail.verify

        - name: Verify | Reset the AIDE check service after the mail failure run
          ansible.builtin.command:
            argv:
              - systemctl
              - reset-failed
              - aide-check.service
          changed_when: true

    #
    # Script Template Variants
    #

    - name: Verify | Render the AIDE check script variants
      vars:
        aide_log_dir: '/var/log/aide'
        aide_email_to: 'admin@example.com'
        aide_email_subject: '[AIDE] File Integrity Check Report'
        aide_report_retention_days: 90
      block:
        - name: Verify | Create a temporary directory for the script variants
          ansible.builtin.tempfile:
            state: directory
            suffix: aide-verify
          register: aide_render_dir

        - name: Verify | Render the script with email disabled
          ansible.builtin.template:
            src: '{{ playbook_dir | dirname | dirname }}/templates/aide-check.sh.j2'
            dest: '{{ aide_render_dir.path }}/aide-check-nomail.sh'
            owner: root
            group: root
            mode: '0700'
          vars:
            aide_email_enabled: false
            aide_email_on_change_only: true

        - name: Verify | Render the script with a mail after every check
          ansible.builtin.template:
            src: '{{ playbook_dir | dirname | dirname }}/templates/aide-check.sh.j2'
            dest: '{{ aide_render_dir.path }}/aide-check-heartbeat.sh'
            owner: root
            group: root
            mode: '0700'
          vars:
            aide_email_enabled: true
            aide_email_on_change_only: false

        - name: Verify | Check the syntax of the rendered scripts
          ansible.builtin.command:
            argv:
              - bash
              - -n
              - '{{ aide_render_dir.path }}/{{ item }}'
          loop:
            - aide-check-nomail.sh
            - aide-check-heartbeat.sh
          changed_when: false

        - name: Verify | Read the rendered script with email disabled
          ansible.builtin.slurp:
            src: '{{ aide_render_dir.path }}/aide-check-nomail.sh'
          register: aide_render_nomail

        - name: Verify | Read the rendered script with a mail after every check
          ansible.builtin.slurp:
            src: '{{ aide_render_dir.path }}/aide-check-heartbeat.sh'
          register: aide_render_heartbeat

        - name: Verify | Assert the script variants
          ansible.builtin.assert:
            that:
              - not ((aide_render_nomail.content | b64decode) is search('(?m)^\s*mail '))
              - "'MAIL_SUBJECT' not in (aide_render_nomail.content | b64decode)"
              - (aide_render_heartbeat.content | b64decode) is search('(?m)^\s*mail ')
              - "': no changes on ${HOSTNAME}' in (aide_render_heartbeat.content | b64decode)"
            fail_msg: "AIDE check script renders a mail call without email or no 'no changes' mail"
            success_msg: "AIDE check script variants render as expected"

      always:
        - name: Verify | Remove the rendered script variants
          ansible.builtin.file:
            path: '{{ aide_render_dir.path }}'
            state: absent
          when: aide_render_dir.path is defined
