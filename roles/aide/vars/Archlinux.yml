---
# AIDE 0.19.3 fails to build on Arch Linux against nettle 4.0 due to a
# digest() API break in src/md.c (since ~2026-05-11). Upstream AIDE is
# in maintenance mode; no fix released. See:
#   https://github.com/aide/aide/issues/218
# Layer-1 no-op: empty package + AUR path disabled. The role's main.yml
# guards downstream tasks on `__aide_package | length > 0`, so the
# whole role becomes a no-op on Arch until upstream ships a nettle-4.0
# compatible release. Re-availability tracked by the drift-detection
# workflow (#169).
__aide_package: ''

# AIDE is only available in the AUR on Arch Linux — AUR path disabled
# while the PKGBUILD is unbuildable (see above).
__aide_aur: false

__aide_aur_packages:
  aide:
    - aide

__aide_config_file: '/etc/aide.conf'

# GPG keys required to verify AUR package sources
__aide_gpg_keys:
  - '18EE86386022EF57'

__aide_init_command: 'aide --init'

__aide_database_directive: 'database_in'

__aide_supports_log_level: true

__aide_dir_owner: 'root'
__aide_dir_group: 'root'

# OS-specific paths to exclude from monitoring
__aide_os_exclude_paths:
  - '/var/lib/pacman'
  - '/usr/src'
  - '/usr/tmp'

# OS-specific important config files to monitor with FIPSR rule
__aide_os_critical_configs:
  - '/etc/pacman.conf'
  - '/etc/pacman.d'
  - '/etc/makepkg.conf'
  - '/etc/mkinitcpio.conf'
  - '/etc/mkinitcpio.d'
