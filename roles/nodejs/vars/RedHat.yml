---
__nodejs_packages:
  - 'nodejs'
  - 'npm'

__nodejs_nvm_packages: []

__nodejs_prerequisite_packages: []

__nodejs_nodesource_supported: true
__nodejs_nodesource_key_url: 'https://rpm.nodesource.com/gpgkey/ns-operations-public.key'
__nodejs_nodesource_repo: "https://rpm.nodesource.com/pub_{{ nodejs_version }}.x/nodistro/nodejs/$basearch"

# No pnpm package. yarnpkg exists only in EPEL, which this role does not
# manage, so both stay on npm.
__nodejs_pnpm_package: ''
__nodejs_yarn_package: ''
