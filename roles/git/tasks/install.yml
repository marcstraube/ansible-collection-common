---
#
# Git Installation
#

- name: Install | git packages
  ansible.builtin.package:
    name: '{{ __git_packages }}'
    state: present
  retries: 3
  delay: 5

- name: Install | Manage git-lfs
  ansible.builtin.package:
    name: '{{ __git_lfs_package }}'
    state: "{{ 'present' if git_lfs_enabled | bool else 'absent' }}"
  when: __git_lfs_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | Manage GitHub CLI
  ansible.builtin.package:
    name: '{{ __git_github_cli_package }}'
    state: "{{ 'present' if git_github_cli_enabled | bool else 'absent' }}"
  when: __git_github_cli_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | Manage GitLab CLI
  ansible.builtin.package:
    name: '{{ __git_gitlab_cli_package }}'
    state: "{{ 'present' if git_gitlab_cli_enabled | bool else 'absent' }}"
  when: __git_gitlab_cli_package | default('') | length > 0
  retries: 3
  delay: 5
