---
#
# Git Installation
#

- name: Install | git packages
  ansible.builtin.package:
    name: '{{ __git_packages }}'
    state: present
  retries: 3
  delay: 5

- name: Install | git-lfs
  ansible.builtin.package:
    name: '{{ __git_lfs_package }}'
    state: present
  when:
    - git_lfs_enabled | bool
    - __git_lfs_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | GitHub CLI
  ansible.builtin.package:
    name: '{{ __git_github_cli_package }}'
    state: present
  when:
    - git_github_cli_enabled | bool
    - __git_github_cli_package | default('') | length > 0
  retries: 3
  delay: 5

- name: Install | GitLab CLI
  ansible.builtin.package:
    name: '{{ __git_gitlab_cli_package }}'
    state: present
  when:
    - git_gitlab_cli_enabled | bool
    - __git_gitlab_cli_package | default('') | length > 0
  retries: 3
  delay: 5
