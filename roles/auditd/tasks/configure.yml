---
- name: Configure | auditd.conf
  ansible.builtin.template:
    src: 'auditd.conf.j2'
    dest: '/etc/audit/auditd.conf'
    owner: root
    group: root
    mode: '0640'
  notify: Reload auditd config

# Written with 'active = no' when the plugin is disabled: the packages ship the
# file. A reload does not apply a changed path or changed arguments of a
# running plugin before audit 4.2, so a change restarts auditd.
- name: Configure | Syslog plugin
  ansible.builtin.template:
    src: 'syslog.conf.j2'
    dest: '/etc/audit/plugins.d/syslog.conf'
    owner: root
    group: root
    mode: '0640'
  notify: Restart auditd
