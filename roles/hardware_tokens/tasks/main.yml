---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

# hardware_tokens_users is deprecated and will be removed in v4.0.0. The flag
# is set on every run so the warning below fires only while the deprecated
# variable is set.
- name: Main | Detect deprecated hardware_tokens_users
  ansible.builtin.set_fact:
    __hardware_tokens_users_deprecated: >-
      {{ hardware_tokens_enabled | bool
         and hardware_tokens_users | default([]) | length > 0 }}
  tags:
    - always

- name: Main | Warn about hardware_tokens_users deprecation
  ansible.builtin.debug:
    msg: >
      hardware_tokens_users is DEPRECATED and will be removed in v4.0.0. Add
      the users to the device access group through users_list[].groups of
      marcstraube.common.users instead. See #535.
  when: __hardware_tokens_users_deprecated | bool
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when: hardware_tokens_enabled | bool
  tags:
    - hardware-tokens
    - hardware-tokens:install

- name: Main | Import udev tasks
  ansible.builtin.import_tasks: udev.yml
  when:
    - hardware_tokens_enabled | bool
    - hardware_tokens_udev_rules_enabled | bool
  tags:
    - hardware-tokens
    - hardware-tokens:udev

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when: hardware_tokens_enabled | bool
  tags:
    - hardware-tokens
    - hardware-tokens:service

- name: Main | Import users tasks
  ansible.builtin.import_tasks: users.yml
  when: __hardware_tokens_users_deprecated | bool
  tags:
    - hardware-tokens
    - hardware-tokens:users

- name: Main | Import PAM U2F tasks
  ansible.builtin.import_tasks: pam_u2f.yml
  when:
    - hardware_tokens_enabled | bool
    - hardware_tokens_pam_u2f_enabled | bool
  tags:
    - hardware-tokens
    - hardware-tokens:pam

- name: Main | Import lock on removal tasks
  ansible.builtin.import_tasks: lock_on_removal.yml
  when:
    - hardware_tokens_enabled | bool
    - hardware_tokens_lock_on_removal_enabled | bool
  tags:
    - hardware-tokens
    - hardware-tokens:lock
