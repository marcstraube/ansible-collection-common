---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    php_enabled: true
    # Remi SCL parallel-install path — exercises __php_extension_map_remi.
    php_redhat_repo: 'remi'
    php_default_version: '8.4'
    # Upstream composer.phar with one wrapper per version; the EPEL package
    # would pull in the AppStream PHP.
    php_composer_enabled: true
    php_versions:
      - version: '8.4'
        extensions:
          - curl        # built into php84-php-common (skipped, not a package)
          - gd          # separate subpackage: php84-php-gd
          - intl        # separate subpackage: php84-php-intl
          - mysqli      # collapses to php84-php-mysqlnd
          - xdebug      # versioned PECL: php84-php-pecl-xdebug3
          - redis       # versioned PECL: php84-php-pecl-redis6
          - pcov        # PECL, Remi-only: php84-php-pecl-pcov
        fpm: true
        # Named pool on the first version: install_version.yml leaves the
        # paths of the last version (8.3) behind, so a pool that lands under
        # php84 shows that the pool paths are computed per version.
        fpm_pools:
          - name: 'app'
      # Second version proves Remi side-by-side multi-version installs (#192):
      # both php<XX>-php-fpm services and per-version /etc/opt/remi paths.
      - version: '8.3'
        extensions:
          - gd          # separate subpackage: php83-php-gd
        fpm: true

  tasks:
    - name: Converge | Include php role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
