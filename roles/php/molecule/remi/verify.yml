---
- name: Verify
  hosts: all
  gather_facts: true

  tasks:
    #
    # Extension packages — the Remi map resolved to real php84-php-*
    # package names and dnf actually installed them.
    #

    - name: Verify | Gather installed packages
      ansible.builtin.package_facts:
        manager: rpm

    - name: Verify | Assert expected Remi extension packages are installed
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.packages"
        fail_msg: "Expected Remi package not installed: {{ item }}"
      loop:
        - php84-php-cli
        - php84-php-fpm
        - php84-php-gd
        - php84-php-intl
        - php84-php-mysqlnd    # mysqli collapses here
        - php84-php-pecl-xdebug3
        - php84-php-pecl-redis6
        - php84-php-pecl-pcov
        # Second side-by-side version (8.3)
        - php83-php-cli
        - php83-php-fpm
        - php83-php-gd

    - name: Verify | Assert AppStream package names were not installed
      ansible.builtin.assert:
        that:
          - "item not in ansible_facts.packages"
        fail_msg: "AppStream package unexpectedly installed on Remi path: {{ item }}"
      loop:
        - php-pecl-xdebug3
        - php-gd
        # Composer comes as composer.phar, not as the EPEL package that
        # pulls in the AppStream PHP CLI
        - composer
        - php-cli

    #
    # Loaded modules — the SCL php84 binary loads the requested extensions.
    #

    - name: Verify | List loaded modules (php84)
      ansible.builtin.command:
        cmd: /usr/bin/php84 -m
      register: __verify_php84_modules
      changed_when: false

    - name: Verify | Assert requested extensions are loaded
      ansible.builtin.assert:
        that:
          - "'curl' in __verify_php84_modules.stdout"
          - "'gd' in __verify_php84_modules.stdout"
          - "'intl' in __verify_php84_modules.stdout"
          - "'mysqli' in __verify_php84_modules.stdout"
          - "'xdebug' in __verify_php84_modules.stdout"
          - "'redis' in __verify_php84_modules.stdout"
          - "'pcov' in __verify_php84_modules.stdout"
        fail_msg: >-
          Expected extensions not loaded by php84:
          {{ __verify_php84_modules.stdout }}

    #
    # Default-version symlink points at the Remi SCL binary.
    #

    - name: Verify | Check default php symlink
      ansible.builtin.stat:
        path: /usr/local/bin/php
      register: __verify_php_link

    - name: Verify | Assert default php links to php84
      ansible.builtin.assert:
        that:
          - __verify_php_link.stat.exists
          - __verify_php_link.stat.islnk
          - __verify_php_link.stat.lnk_target == '/usr/bin/php84'
        fail_msg: >-
          /usr/local/bin/php does not link to /usr/bin/php84:
          {{ __verify_php_link.stat.lnk_target | default('missing') }}

    #
    # Per-version FPM services and config — multi-version side-by-side (#192).
    # Both requested versions (8.4 default + 8.3) must have their own active
    # SCL FPM service and their own /etc/opt/remi/php<XX>/ config files.
    #

    - name: Verify | Check per-version Remi FPM services
      ansible.builtin.systemd_service:
        name: 'php{{ item }}-php-fpm'
      register: __verify_remi_fpm
      loop:
        - '84'
        - '83'

    - name: Verify | Assert per-version Remi FPM services active and enabled
      ansible.builtin.assert:
        that:
          - item.status.ActiveState == 'active'
          - item.status.UnitFileState == 'enabled'
        fail_msg: >-
          php{{ item.item }}-php-fpm not active/enabled:
          {{ item.status.ActiveState }}
      loop: '{{ __verify_remi_fpm.results }}'
      loop_control:
        label: 'php{{ item.item }}-php-fpm'

    - name: Verify | Check per-version Remi config files
      ansible.builtin.stat:
        path: '{{ item }}'
      register: __verify_remi_conf
      loop:
        - /etc/opt/remi/php84/php.d/99-ansible.ini
        - /etc/opt/remi/php84/php-fpm.d/www.conf
        - /etc/opt/remi/php83/php.d/99-ansible.ini
        - /etc/opt/remi/php83/php-fpm.d/www.conf

    - name: Verify | Assert per-version Remi config files deployed
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: 'Remi config file missing: {{ item.item }}'
      loop: '{{ __verify_remi_conf.results }}'
      loop_control:
        label: '{{ item.item }}'

    #
    # FPM log links — /var/log/php<XX>-fpm points into the SCL tree of
    # each version and resolves to its existing log directory.
    #

    - name: Verify | Check the Remi FPM log links
      ansible.builtin.stat:
        path: '/var/log/php{{ item }}-fpm'
      register: __verify_remi_log_links
      loop:
        - '84'
        - '83'

    - name: Verify | Check the Remi FPM log links resolve
      ansible.builtin.stat:
        path: '/var/log/php{{ item }}-fpm'
        follow: true
      register: __verify_remi_log_dirs
      loop:
        - '84'
        - '83'

    - name: Verify | Assert the Remi FPM log links point to the log directories
      ansible.builtin.assert:
        that:
          - item.0.stat.islnk | default(false)
          - item.0.stat.lnk_target == '/var/opt/remi/php' ~ item.0.item ~ '/log/php-fpm'
          - item.1.stat.isdir | default(false)
        fail_msg: >-
          /var/log/php{{ item.0.item }}-fpm is not a link to an existing
          /var/opt/remi/php{{ item.0.item }}/log/php-fpm:
          {{ item.0.stat.lnk_target | default('no link') }}
      loop: '{{ __verify_remi_log_links.results | zip(__verify_remi_log_dirs.results) | list }}'
      loop_control:
        label: '/var/log/php{{ item.0.item }}-fpm'

    #
    # Named pool of 8.4 — its file and socket live in the php84 trees.
    #

    - name: Verify | Read the named Remi pool
      ansible.builtin.slurp:
        src: /etc/opt/remi/php84/php-fpm.d/app.conf
      register: __verify_remi_pool

    - name: Verify | Assert the named Remi pool listens next to the www socket
      ansible.builtin.assert:
        that:
          - "'[app]' in (__verify_remi_pool.content | b64decode)"
          - >-
            'listen = /var/opt/remi/php84/run/php-fpm/app.sock'
            in (__verify_remi_pool.content | b64decode)
        fail_msg: 'app.conf content unexpected'

    - name: Verify | Check the named Remi pool socket and the other version
      ansible.builtin.stat:
        path: '{{ item }}'
      register: __verify_remi_pool_paths
      loop:
        - /var/opt/remi/php84/run/php-fpm/app.sock
        - /etc/opt/remi/php83/php-fpm.d/app.conf

    - name: Verify | Assert the named Remi pool stays with its version
      ansible.builtin.assert:
        that:
          - __verify_remi_pool_paths.results[0].stat.exists
          - __verify_remi_pool_paths.results[0].stat.issock
          - not __verify_remi_pool_paths.results[1].stat.exists
        fail_msg: >-
          app.sock missing under php84 or app.conf written for php83:
          {{ __verify_remi_pool_paths.results | map(attribute='stat.exists') | list }}

    #
    # Composer — one composer.phar, the wrappers run on their SCL binary.
    #

    - name: Verify | Check composer.phar
      ansible.builtin.stat:
        path: /usr/local/lib/composer.phar
      register: __verify_composer_phar

    - name: Verify | Assert composer.phar downloaded
      ansible.builtin.assert:
        that:
          - __verify_composer_phar.stat.exists
          - __verify_composer_phar.stat.mode == '0644'
        fail_msg: >-
          /usr/local/lib/composer.phar missing or with mode
          {{ __verify_composer_phar.stat.mode | default('-') }}

    - name: Verify | Check Composer wrappers
      ansible.builtin.command:
        argv:
          - '/usr/local/bin/{{ item.key }}'
          - --version
      environment:
        COMPOSER_ALLOW_SUPERUSER: '1'
      register: __verify_composer
      changed_when: false
      loop: '{{ __verify_composer_wrappers | dict2items }}'
      loop_control:
        label: '{{ item.key }}'
      vars:
        __verify_composer_wrappers:
          composer: '8.4'
          composer84: '8.4'
          composer83: '8.3'

    - name: Verify | Assert Composer wrappers run on their PHP version
      ansible.builtin.assert:
        that:
          - "'Composer version' in item.stdout"
          # Composer prints the PHP version line on stderr
          - __verify_composer_lines | select('match', __verify_php_pattern) | list | length > 0
        fail_msg: >-
          {{ item.item.key }} does not run on PHP {{ item.item.value }}:
          {{ item.stdout }}
      loop: '{{ __verify_composer.results }}'
      loop_control:
        label: '{{ item.item.key }}'
      vars:
        __verify_composer_lines: '{{ item.stdout_lines + item.stderr_lines }}'
        __verify_php_pattern: '^PHP version {{ item.item.value | regex_escape }}\.'
