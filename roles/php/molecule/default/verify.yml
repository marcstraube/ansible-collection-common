---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    # The extensions converge.yml configures for every version
    __verify_expected_modules:
      - curl
      - mbstring
      - bcmath
      - pdo_pgsql
      - iconv

  tasks:
    #
    # Detect system PHP version (mirrors role logic)
    #

    - name: Verify | Detect system PHP version (Arch)
      ansible.builtin.command:
        cmd: pacman -Si php
      register: __verify_arch_info
      changed_when: false
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Set system version fact (Arch)
      ansible.builtin.set_fact:
        __verify_system_ver: >-
          {{ (__verify_arch_info.stdout
              | regex_search('Version\s*:\s*(\d+)\.(\d+)', '\1', '\2'))
              | join('.') }}
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Detect system PHP version (Debian)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          apt-cache show php | grep -m1 '^Depends:' | grep -oP 'php\K\d+\.\d+'
        executable: /bin/bash
      register: __verify_debian_info
      changed_when: false
      failed_when: __verify_debian_info.stdout | default('') | trim | length == 0
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Set system version fact (Debian)
      ansible.builtin.set_fact:
        __verify_system_ver: '{{ __verify_debian_info.stdout | trim }}'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Detect system PHP version (RedHat)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          dnf info php-cli 2>/dev/null | grep -m1 '^Version' | grep -oP '\d+\.\d+'
        executable: /bin/bash
      register: __verify_redhat_info
      changed_when: false
      failed_when: __verify_redhat_info.stdout | default('') | trim | length == 0
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Set system version fact (RedHat)
      ansible.builtin.set_fact:
        __verify_system_ver: '{{ __verify_redhat_info.stdout | trim }}'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Set compact version fact
      ansible.builtin.set_fact:
        __verify_system_ver_compact: "{{ __verify_system_ver | replace('.', '') }}"

    #
    # PHP CLI — auto version resolves correctly
    #

    - name: Verify | Check PHP CLI
      ansible.builtin.command: php --version
      register: __verify_php_cli
      changed_when: false
      failed_when: __verify_php_cli.rc != 0

    - name: Verify | Assert auto version matches system PHP
      ansible.builtin.assert:
        that:
          - __verify_php_cli.stdout is match('^PHP ' + __verify_system_ver)
        fail_msg: >-
          Expected PHP {{ __verify_system_ver }},
          got {{ __verify_php_cli.stdout_lines[0] }}

    #
    # Extension mapping — every configured extension must end up loaded,
    # whether it needs a package, is compiled in, or needs an ini directive.
    #

    - name: Verify | Check loaded PHP modules
      ansible.builtin.command: php -m
      register: __verify_php_modules
      changed_when: false

    # bcmath, pdo_pgsql and iconv carry the weight here. curl is compiled in
    # everywhere and mbstring arrives as a composer dependency on EL, so both
    # stay loaded even when the extension map is wrong -- they cannot detect a
    # regression. No package pulls bcmath in, and each platform reaches it by a
    # different route: its own package on EL and Debian, a .so needing an ini
    # directive on Arch. pdo_pgsql has no package of its own on EL and Arch and
    # needs a directive under its own name on Arch; iconv has no package on
    # Debian. Without their map entries the install fails or the driver stays
    # unloaded.
    - name: Verify | Assert configured extensions loaded
      ansible.builtin.assert:
        that:
          - __verify_expected_modules | reject('in', __verify_php_modules.stdout_lines) | list | length == 0
        fail_msg: >-
          Configured extension missing from php -m:
          {{ __verify_expected_modules
             | reject('in', __verify_php_modules.stdout_lines) | list }}

    #
    # FPM service — auto version
    #

    - name: Verify | Set auto FPM service name (Arch)
      ansible.builtin.set_fact:
        __verify_auto_fpm: 'php-fpm'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Set auto FPM service name (Debian)
      ansible.builtin.set_fact:
        __verify_auto_fpm: 'php{{ __verify_system_ver }}-fpm'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Set auto FPM service name (RedHat AppStream)
      ansible.builtin.set_fact:
        __verify_auto_fpm: 'php-fpm'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Check auto FPM service
      ansible.builtin.systemd_service:
        name: '{{ __verify_auto_fpm }}'
      register: __verify_auto_fpm_status

    - name: Verify | Assert auto FPM is active and enabled
      ansible.builtin.assert:
        that:
          - __verify_auto_fpm_status.status.ActiveState == 'active'
          - __verify_auto_fpm_status.status.UnitFileState == 'enabled'
        fail_msg: >-
          {{ __verify_auto_fpm }} not active/enabled:
          {{ __verify_auto_fpm_status.status.ActiveState }}

    # On Debian the FPM SAPI reads its own php.ini and conf.d, so a module the
    # CLI loads can still be missing in the pool. php-fpm -m reads the FPM set.
    - name: Verify | Check modules loaded by PHP-FPM
      ansible.builtin.command:
        argv:
          - >-
            {{ (ansible_facts['os_family'] == 'Debian')
               | ternary('php-fpm' + __verify_system_ver, 'php-fpm') }}
          - -m
      register: __verify_fpm_modules
      changed_when: false

    - name: Verify | Assert configured extensions loaded by PHP-FPM
      ansible.builtin.assert:
        that:
          - __verify_expected_modules | reject('in', __verify_fpm_modules.stdout_lines) | list | length == 0
        fail_msg: >-
          Configured extension missing from php-fpm -m:
          {{ __verify_expected_modules
             | reject('in', __verify_fpm_modules.stdout_lines) | list }}

    #
    # FPM service — second version (Debian/RedHat only)
    #

    # Second version is only converged on Debian. RedHat multi-version
    # requires Remi opt-in and is covered in a separate scenario.
    - name: Verify | Set second FPM service name (Debian)
      ansible.builtin.set_fact:
        __verify_second_fpm: 'php8.3-fpm'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check second FPM service
      ansible.builtin.systemd_service:
        name: '{{ __verify_second_fpm }}'
      register: __verify_second_fpm_status
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert second FPM is active and enabled
      ansible.builtin.assert:
        that:
          - __verify_second_fpm_status.status.ActiveState == 'active'
          - __verify_second_fpm_status.status.UnitFileState == 'enabled'
        fail_msg: >-
          {{ __verify_second_fpm }} not active/enabled:
          {{ __verify_second_fpm_status.status.ActiveState }}
      when: ansible_facts['os_family'] == 'Debian'

    #
    # Configuration — auto version
    #

    - name: Verify | Set auto config paths (Arch)
      ansible.builtin.set_fact:
        __verify_auto_ini: '/etc/php/conf.d/99-ansible.ini'
        __verify_auto_pool: '/etc/php/php-fpm.d/www.conf'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Set auto config paths (Debian)
      ansible.builtin.set_fact:
        __verify_auto_ini: '/etc/php/{{ __verify_system_ver }}/fpm/conf.d/99-ansible.ini'
        __verify_auto_pool: '/etc/php/{{ __verify_system_ver }}/fpm/pool.d/www.conf'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Set auto config paths (RedHat AppStream)
      ansible.builtin.set_fact:
        __verify_auto_ini: '/etc/php.d/99-ansible.ini'
        __verify_auto_pool: '/etc/php-fpm.d/www.conf'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Check auto php.ini drop-in exists
      ansible.builtin.stat:
        path: '{{ __verify_auto_ini }}'
      register: __verify_auto_ini_stat

    - name: Verify | Assert auto php.ini drop-in deployed
      ansible.builtin.assert:
        that:
          - __verify_auto_ini_stat.stat.exists
        fail_msg: "php.ini drop-in not found at {{ __verify_auto_ini }}"

    - name: Verify | Check auto php.ini content
      ansible.builtin.slurp:
        src: '{{ __verify_auto_ini }}'
      register: __verify_auto_ini_content

    - name: Verify | Assert auto php.ini settings
      ansible.builtin.assert:
        that:
          - "'memory_limit = 128M' in (__verify_auto_ini_content.content | b64decode)"
          - "'date.timezone = UTC' in (__verify_auto_ini_content.content | b64decode)"
          - >-
            'realpath_cache_size = 4096k'
            in (__verify_auto_ini_content.content | b64decode)
          - >-
            'session.save_path = /var/lib/php/session'
            in (__verify_auto_ini_content.content | b64decode)
          - "'expose_php = Off' in (__verify_auto_ini_content.content | b64decode)"
          - >-
            'session.use_strict_mode = 1'
            in (__verify_auto_ini_content.content | b64decode)
          - >-
            'session.cookie_httponly = 1'
            in (__verify_auto_ini_content.content | b64decode)
          - "'error_log = syslog' in (__verify_auto_ini_content.content | b64decode)"
        fail_msg: "php.ini drop-in content unexpected"

    - name: Verify | Check auto www.conf exists
      ansible.builtin.stat:
        path: '{{ __verify_auto_pool }}'
      register: __verify_auto_pool_stat

    - name: Verify | Assert auto www.conf deployed
      ansible.builtin.assert:
        that:
          - __verify_auto_pool_stat.stat.exists
        fail_msg: "www.conf not found at {{ __verify_auto_pool }}"

    # FPM reads only *.conf from the pool directory; an ini drop-in there has
    # no effect.
    - name: Verify | Check no php.ini drop-in in auto FPM pool directory
      ansible.builtin.stat:
        path: "{{ __verify_auto_pool | dirname }}/99-ansible.ini"
      register: __verify_auto_pool_ini_stat

    - name: Verify | Assert no php.ini drop-in in auto FPM pool directory
      ansible.builtin.assert:
        that:
          - not __verify_auto_pool_ini_stat.stat.exists
        fail_msg: >-
          php.ini drop-in deployed to the FPM pool directory
          {{ __verify_auto_pool | dirname }}

    - name: Verify | Check auto www.conf content
      ansible.builtin.slurp:
        src: '{{ __verify_auto_pool }}'
      register: __verify_auto_pool_content

    - name: Verify | Assert auto www.conf settings
      ansible.builtin.assert:
        that:
          - "'[www]' in (__verify_auto_pool_content.content | b64decode)"
          - "'pm = dynamic' in (__verify_auto_pool_content.content | b64decode)"
          - "'pm.max_children = 5' in (__verify_auto_pool_content.content | b64decode)"
          - >-
            'catch_workers_output = yes'
            in (__verify_auto_pool_content.content | b64decode)
          - >-
            'php_admin_value[error_log] = /var/log/php-fpm/www-error.log'
            in (__verify_auto_pool_content.content | b64decode)
          - >-
            'php_admin_flag[log_errors] = on'
            in (__verify_auto_pool_content.content | b64decode)
          - >-
            'env[HTTPS_PROXY] = http://proxy.invalid:3128'
            in (__verify_auto_pool_content.content | b64decode)
          - >-
            'env[MOLECULE_FPM_ENV] = global'
            in (__verify_auto_pool_content.content | b64decode)
        fail_msg: "www.conf content unexpected"

    #
    # Worker environment reaches getenv() in a script served through FPM.
    # getenv() also sees the FastCGI request parameters, and cgi-fcgi sends its
    # own environment as such; the two test variables are not part of it, so
    # their values can only come from the pool. A restart recreates the socket
    # file (see the reload note below).
    #

    - name: Verify | Create FPM test script directory
      ansible.builtin.file:
        path: /srv/molecule-php
        state: directory
        mode: '0755'

    - name: Verify | Deploy getenv() test script
      ansible.builtin.copy:
        dest: /srv/molecule-php/env.php
        content: |
          <?php
          echo getenv('MOLECULE_FPM_ENV'), '|', getenv('HTTPS_PROXY');
        mode: '0644'

    - name: Verify | Restart the auto FPM service
      ansible.builtin.systemd_service:
        name: '{{ __verify_auto_fpm }}'
        state: restarted

    - name: Verify | Read the auto FPM socket
      ansible.builtin.set_fact:
        __verify_auto_socket: >-
          {{ (__verify_auto_pool_content.content | b64decode)
             | regex_search('^listen = (.+)$', '\1', multiline=True) | first }}

    - name: Verify | Wait for the auto FPM socket
      ansible.builtin.wait_for:
        path: '{{ __verify_auto_socket }}'
        timeout: 30

    - name: Verify | Request the test script through FPM
      ansible.builtin.command:
        argv:
          - cgi-fcgi
          - -bind
          - -connect
          - '{{ __verify_auto_socket }}'
      environment:
        SCRIPT_FILENAME: /srv/molecule-php/env.php
        REQUEST_METHOD: GET
      register: __verify_fpm_env
      changed_when: false

    - name: Verify | Assert the workers see the pool environment
      ansible.builtin.assert:
        that:
          - "'global|http://proxy.invalid:3128' in __verify_fpm_env.stdout"
        fail_msg: 'getenv() through FPM returned: {{ __verify_fpm_env.stdout }}'

    #
    # FPM picks up ini changes (side_effect changed max_input_vars while the
    # service was already running)
    #

    - name: Verify | Check ini content after side effect
      ansible.builtin.slurp:
        src: '{{ __verify_auto_ini }}'
      register: __verify_reload_ini

    - name: Verify | Assert side effect value was written
      ansible.builtin.assert:
        that:
          - "'max_input_vars = 2000' in (__verify_reload_ini.content | b64decode)"
        fail_msg: "side_effect value missing from {{ __verify_auto_ini }}"

    # The reload itself is the evidence. Querying the socket is not portable:
    # after a reload php-fpm keeps an inherited descriptor while the socket file
    # under a tmpfs /run may be gone, and worker start times say nothing either,
    # because a dynamic pool recycles them on its own.
    - name: Verify | Stat the ini drop-in
      ansible.builtin.stat:
        path: '{{ __verify_auto_ini }}'
      register: __verify_ini_stat

    - name: Verify | Read the service log since the ini was written
      ansible.builtin.command:
        argv:
          - journalctl
          - '--unit={{ __verify_auto_fpm }}'
          - '--since=@{{ __verify_ini_stat.stat.mtime }}'
          - --no-pager
      register: __verify_fpm_journal
      changed_when: false

    - name: Verify | Assert php-fpm was reloaded after the ini change
      ansible.builtin.assert:
        that:
          - "'Reloading' in __verify_fpm_journal.stdout"
        fail_msg: >-
          No reload logged after {{ __verify_auto_ini }} was rewritten -- the
          change reached the file but never the running configuration
        success_msg: "php-fpm reloaded after the ini change"

    #
    # Targeted package update (side_effect rolled the packages back and ran
    # the role with php_packages_state: latest)
    #

    - name: Verify | Read the CLI package versions around the rollback
      ansible.builtin.slurp:
        src: /root/php-update-versions
      register: __verify_update_versions

    - name: Verify | Stat the version record
      ansible.builtin.stat:
        path: /root/php-update-versions
      register: __verify_update_stat

    - name: Verify | Gather package facts after the update
      ansible.builtin.package_facts:

    - name: Verify | Set update version facts
      ansible.builtin.set_fact:
        __verify_version_latest: '{{ (__verify_update_versions.content | b64decode).splitlines()[0] | trim }}'
        __verify_version_rolled_back: '{{ (__verify_update_versions.content | b64decode).splitlines()[1] | trim }}'
        __verify_version_now: >-
          {{ [(ansible_facts['packages'][__verify_cli_package] | first).version,
              (ansible_facts['packages'][__verify_cli_package] | first).release | default('')] | select | join('-') }}
      vars:
        __verify_cli_package: >-
          {{ {'Archlinux': 'php', 'RedHat': 'php-cli'}[ansible_facts['os_family']]
             | default('php' + __verify_system_ver + '-cli') }}

    - name: Verify | Assert the update restored the latest build (RedHat, Debian)
      ansible.builtin.assert:
        that:
          - __verify_version_now == __verify_version_latest
        fail_msg: >-
          The CLI package is at {{ __verify_version_now }} after the update,
          expected {{ __verify_version_latest }} (rolled back to
          {{ __verify_version_rolled_back }})
        success_msg: >-
          Updated from {{ __verify_version_rolled_back }} to {{ __verify_version_now }}
      when:
        - ansible_facts['os_family'] in ['RedHat', 'Debian']
        - __verify_version_rolled_back != __verify_version_latest

    - name: Verify | Read the service log since the update
      ansible.builtin.command:
        argv:
          - journalctl
          - '--unit={{ __verify_auto_fpm }}'
          - '--since=@{{ __verify_update_stat.stat.mtime }}'
          - --no-pager
      register: __verify_update_journal
      changed_when: false
      when:
        - ansible_facts['os_family'] in ['RedHat', 'Debian']
        - __verify_version_rolled_back != __verify_version_latest

    - name: Verify | Assert php-fpm was restarted after the update
      ansible.builtin.assert:
        that:
          - "'Stopped' in __verify_update_journal.stdout or 'Stopping' in __verify_update_journal.stdout"
          - "'Started' in __verify_update_journal.stdout"
        fail_msg: >-
          No restart of {{ __verify_auto_fpm }} logged after the package update --
          the master process still runs the old binary
        success_msg: "php-fpm restarted after the package update"
      when:
        - ansible_facts['os_family'] in ['RedHat', 'Debian']
        - __verify_version_rolled_back != __verify_version_latest

    #
    # Configuration — second version (Debian/RedHat only)
    #

    - name: Verify | Set second config paths (Debian)
      ansible.builtin.set_fact:
        __verify_second_ini: '/etc/php/8.3/fpm/conf.d/99-ansible.ini'
        __verify_second_pool: '/etc/php/8.3/fpm/pool.d/www.conf'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check second php.ini drop-in exists
      ansible.builtin.stat:
        path: '{{ __verify_second_ini }}'
      register: __verify_second_ini_stat
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert second php.ini deployed
      ansible.builtin.assert:
        that:
          - __verify_second_ini_stat.stat.exists
        fail_msg: "Second version php.ini not found at {{ __verify_second_ini }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check second php.ini content
      ansible.builtin.slurp:
        src: '{{ __verify_second_ini }}'
      register: __verify_second_ini_content
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert per-version extra settings override the global dict
      ansible.builtin.assert:
        that:
          - >-
            'realpath_cache_size = 8192k'
            in (__verify_second_ini_content.content | b64decode)
          - >-
            'session.save_path = /var/lib/php/session'
            in (__verify_second_ini_content.content | b64decode)
        fail_msg: "Per-version extra_settings not merged onto the global dict"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check second www.conf exists
      ansible.builtin.stat:
        path: '{{ __verify_second_pool }}'
      register: __verify_second_pool_stat
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert second www.conf deployed
      ansible.builtin.assert:
        that:
          - __verify_second_pool_stat.stat.exists
        fail_msg: "Second version www.conf not found at {{ __verify_second_pool }}"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Check second www.conf content
      ansible.builtin.slurp:
        src: '{{ __verify_second_pool }}'
      register: __verify_second_pool_content
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify | Assert per-version env overrides the global mapping
      ansible.builtin.assert:
        that:
          - >-
            'env[MOLECULE_FPM_ENV] = per-version'
            in (__verify_second_pool_content.content | b64decode)
          - >-
            'env[MOLECULE_FPM_ENV] = global'
            not in (__verify_second_pool_content.content | b64decode)
          - >-
            'env[HTTPS_PROXY] = http://proxy.invalid:3128'
            in (__verify_second_pool_content.content | b64decode)
        fail_msg: 'second www.conf env lines unexpected'
      when: ansible_facts['os_family'] == 'Debian'

    #
    # Composer — every wrapper runs on its own PHP version: composer on the
    # default version, composer<XX> on each configured version (Debian
    # converges a second one).
    #

    # Composer comes from the source of PHP: the distribution package on Arch
    # and AppStream, composer.phar for Sury on Debian.
    - name: Verify | Gather package facts for Composer
      ansible.builtin.package_facts:

    - name: Verify | Check composer.phar
      ansible.builtin.stat:
        path: /usr/local/lib/composer.phar
      register: __verify_composer_phar

    - name: Verify | Assert Composer comes from the source of PHP
      ansible.builtin.assert:
        that:
          - ('composer' in ansible_facts.packages) == (not __verify_composer_expect_phar)
          - __verify_composer_phar.stat.exists == __verify_composer_expect_phar
        fail_msg: >-
          Expected Composer from
          {{ __verify_composer_expect_phar | ternary('composer.phar', 'the distribution package') }}
          on {{ ansible_facts['os_family'] }}.
      vars:
        __verify_composer_expect_phar: "{{ ansible_facts['os_family'] == 'Debian' }}"

    - name: Verify | Set expected Composer wrappers
      ansible.builtin.set_fact:
        __verify_composer_wrappers: >-
          {{ {'composer': __verify_system_ver,
              'composer' ~ __verify_system_ver_compact: __verify_system_ver}
             | combine((ansible_facts['os_family'] == 'Debian') | ternary({'composer83': '8.3'}, {})) }}

    - name: Verify | Check Composer wrappers
      ansible.builtin.command:
        argv:
          - '/usr/local/bin/{{ item.key }}'
          - --version
      environment:
        COMPOSER_ALLOW_SUPERUSER: '1'
      register: __verify_composer
      changed_when: false
      loop: '{{ __verify_composer_wrappers | dict2items }}'
      loop_control:
        label: '{{ item.key }}'

    - name: Verify | Assert Composer wrappers run on their PHP version
      ansible.builtin.assert:
        that:
          - "'Composer version' in item.stdout"
          # Composer prints the PHP version line on stderr
          - __verify_composer_lines | select('match', __verify_php_pattern) | list | length > 0
        fail_msg: >-
          {{ item.item.key }} does not run on PHP {{ item.item.value }}:
          {{ item.stdout }}
      loop: '{{ __verify_composer.results }}'
      loop_control:
        label: '{{ item.item.key }}'
      vars:
        __verify_composer_lines: '{{ item.stdout_lines + item.stderr_lines }}'
        __verify_php_pattern: '^PHP version {{ item.item.value | regex_escape }}\.'

    # community.general.composer starts Composer as "php <composer>", so the
    # wrapper must also work as a PHP script.
    - name: Verify | Check Composer started through php
      ansible.builtin.command:
        argv:
          - php
          - /usr/local/bin/composer
          - --version
      environment:
        COMPOSER_ALLOW_SUPERUSER: '1'
      register: __verify_composer_php
      changed_when: false

    - name: Verify | Assert Composer started through php runs
      ansible.builtin.assert:
        that:
          - __verify_composer_php.stdout is regex('^Composer version ', multiline=True)
        fail_msg: 'php /usr/local/bin/composer failed: {{ __verify_composer_php.stdout }}'

    #
    # AUR build-list logic (Arch only)
    #
    # The kewlfft.aur.aur module is not exercised in containers — but the
    # extension-map selection and prefix application can still be validated
    # by mirroring the install_version.yml build logic against the role's
    # vars file. Catches regressions where the AUR map drifts from the
    # phpXX-* package naming or the prefix stops being applied.

    - name: Verify | Load Arch role vars (AUR build-list test)
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../vars/Archlinux.yml'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Build expected AUR package list
      ansible.builtin.set_fact:
        __verify_aur_packages: >-
          {{ ['php84'] + ['php84-fpm'] +
             _mapped_final +
             (_unmapped | map('regex_replace', '^(.*)$', 'php84-' + '\1') | list) }}
      vars:
        _exts: [curl, mbstring, intl, pgsql, pdo_pgsql, gd, imagick, xdebug, pcov, redis, json]
        _map: '{{ __php_extension_map_aur }}'
        _mapped_raw: "{{ _exts | select('in', _map) | map('extract', _map) | reject('equalto', '') | list }}"
        _unmapped: "{{ _exts | reject('in', _map) | list }}"
        _mapped_final: "{{ _mapped_raw | map('regex_replace', '^(.*)$', 'php84-' + '\\1') | list }}"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Verify | Assert AUR build-list contains expected packages
      ansible.builtin.assert:
        that:
          # Core
          - "'php84' in __verify_aur_packages"
          - "'php84-fpm' in __verify_aur_packages"
          # Extensions split out of the phpXX bundle get the prefix applied
          - "'php84-curl' in __verify_aur_packages"
          - "'php84-mbstring' in __verify_aur_packages"
          - "'php84-intl' in __verify_aur_packages"
          - "'php84-pgsql' in __verify_aur_packages"
          # pdo_pgsql ships inside phpXX-pgsql
          - "'php84-pdo_pgsql' not in __verify_aur_packages"
          - "'php84-gd' in __verify_aur_packages"
          - "'php84-imagick' in __verify_aur_packages"
          - "'php84-xdebug' in __verify_aur_packages"
          - "'php84-pcov' in __verify_aur_packages"
          # Official-only package names must not leak into the AUR path
          - "'php-curl' not in __verify_aur_packages"
          - "'php-pgsql' not in __verify_aur_packages"
          - "'php-gd' not in __verify_aur_packages"
          - "'xdebug' not in __verify_aur_packages"
          # Bundle-internal extensions (json) are skipped, not installed
          - "'php84-json' not in __verify_aur_packages"
          # Extensions missing from the AUR map (redis) fall back to the
          # generic prefix rewrite — this is the documented behaviour.
          - "'php84-redis' in __verify_aur_packages"
        fail_msg: |
          AUR build-list assertion failed.
          Got: {{ __verify_aur_packages }}
      when: ansible_facts['os_family'] == 'Archlinux'

    #
    # Remi build-list logic (RedHat only)
    #
    # A live Remi side-by-side (SCL) install conflicts with the AppStream
    # stack the converge already sets up, so — as with the AUR path above —
    # the Remi extension-map selection and prefix application are validated
    # by mirroring the install_version.yml build logic against the role's
    # vars file. Catches regressions where the Remi map drifts from the
    # php<XX>-php-* SCL naming or the prefix stops being applied.

    - name: Verify | Load RedHat role vars (Remi build-list test)
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/../../vars/RedHat.yml'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Build expected Remi package list
      ansible.builtin.set_fact:
        __verify_remi_packages: >-
          {{ ['php84-php-cli'] + ['php84-php-fpm'] +
             _mapped_final +
             (_unmapped | map('regex_replace', '^(.*)$', 'php84-php-' + '\1') | list) }}
      vars:
        _exts: [curl, mbstring, intl, gd, xdebug, redis, pcov, mysqli, xsl, pdo_sqlite, pdo_pgsql, json]
        _map: '{{ __php_extension_map_remi }}'
        _mapped_raw: "{{ _exts | select('in', _map) | map('extract', _map) | reject('equalto', '') | list }}"
        _unmapped: "{{ _exts | reject('in', _map) | list }}"
        _mapped_final: "{{ _mapped_raw | map('regex_replace', '^(.*)$', 'php84-php-' + '\\1') | list }}"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify | Assert Remi build-list contains expected packages
      ansible.builtin.assert:
        that:
          # Core SCL packages
          - "'php84-php-cli' in __verify_remi_packages"
          - "'php84-php-fpm' in __verify_remi_packages"
          # Mapped subpackages get the versioned SCL prefix applied
          - "'php84-php-mbstring' in __verify_remi_packages"
          - "'php84-php-intl' in __verify_remi_packages"
          - "'php84-php-gd' in __verify_remi_packages"
          # PECL suffixes carry the version digit
          - "'php84-php-pecl-xdebug3' in __verify_remi_packages"
          - "'php84-php-pecl-redis6' in __verify_remi_packages"
          # pcov is Remi-only, resolved through the Remi map
          - "'php84-php-pecl-pcov' in __verify_remi_packages"
          # Collapsed subpackages: mysqli -> mysqlnd, xsl -> xml
          - "'php84-php-mysqlnd' in __verify_remi_packages"
          - "'php84-php-xml' in __verify_remi_packages"
          # pdo_sqlite is bundled into the pdo subpackage
          - "'php84-php-pdo' in __verify_remi_packages"
          # pdo_pgsql ships inside the pgsql subpackage
          - "'php84-php-pgsql' in __verify_remi_packages"
          - "'php84-php-pdo_pgsql' not in __verify_remi_packages"
          # AppStream package names must not leak into the Remi path
          - "'php-gd' not in __verify_remi_packages"
          - "'php-pecl-xdebug3' not in __verify_remi_packages"
          - "'php-intl' not in __verify_remi_packages"
          # Built-in extensions (curl, json) are skipped, not installed
          - "'php84-php-curl' not in __verify_remi_packages"
          - "'php84-php-json' not in __verify_remi_packages"
        fail_msg: |
          Remi build-list assertion failed.
          Got: {{ __verify_remi_packages }}
      when: ansible_facts['os_family'] == 'RedHat'
