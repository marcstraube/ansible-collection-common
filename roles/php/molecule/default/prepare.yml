---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Install Debian prerequisites
      ansible.builtin.apt:
        name:
          - gnupg
          - ca-certificates
        state: present
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install EPEL (RedHat)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install Remi repository (RedHat)
      ansible.builtin.dnf:
        name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
        state: present
        disable_gpg_check: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Update cache after repos (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    # Required by community.general.pids, which verify.yml uses to match
    # php-fpm processes by name instead of by command line.
    - name: Prepare | Install psutil
      ansible.builtin.package:
        name: "{{ 'python-psutil' if ansible_facts['os_family'] == 'Archlinux' else 'python3-psutil' }}"
        state: present
      retries: 3
      delay: 5

    # cgi-fcgi lets verify.yml ask a running FPM worker for its effective
    # configuration, which is the only reliable way to tell a written ini from
    # an applied one. Process start times are useless here: a dynamic pool
    # recycles workers on its own.
    - name: Prepare | Install a FastCGI client
      ansible.builtin.package:
        name: "{{ 'libfcgi-bin' if ansible_facts['os_family'] == 'Debian' else 'fcgi' }}"
        state: present
      retries: 3
      delay: 5

    - name: Prepare | Deploy the FPM probe script
      ansible.builtin.copy:
        content: |
          <?php echo 'max_input_vars=', ini_get('max_input_vars');
        dest: /tmp/fpm-probe.php
        owner: root
        group: root
        mode: '0644'
