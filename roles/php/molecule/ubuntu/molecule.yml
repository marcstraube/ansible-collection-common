---
# Ubuntu-only scenario. The role reaches the Sury PPA on Ubuntu, a path
# the Debian platform of the default scenario never takes: the ppa:
# shorthand is expanded and its signing key fetched from the keyserver.
# Ubuntu is not a supported platform of this collection — this scenario
# exists to cover the code that targets it.
driver:
  name: podman
platforms:
  - name: php-ubuntu
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      php-ubuntu:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
