---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5

    # EPEL as on a managed host (package_management enables it); the
    # requested extensions themselves come from AppStream.
    - name: Prepare | Install EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present
      retries: 3
      delay: 5

    - name: Prepare | Update cache after repos
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
