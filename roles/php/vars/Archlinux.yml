---
# Official repo package patterns (for current Arch PHP version)
# AUR patterns are set dynamically in tasks for non-current versions
__php_cli_package: 'php'
__php_fpm_package: 'php-fpm'
__php_extension_prefix: 'php-'
__php_fpm_service: 'php-fpm'

# Arch does not use update-alternatives for PHP
__php_has_alternatives: false

# Configuration paths (official PHP)
# AUR paths are set dynamically in tasks
__php_conf_dirs:
  - '/etc/php/conf.d'
__php_fpm_pool_dir: '/etc/php/php-fpm.d'
__php_fpm_listen_default: '/run/php-fpm/php-fpm.sock'

# FPM pool defaults
__php_fpm_default_user: 'http'
__php_fpm_default_group: 'http'

# Extension mapping for the OFFICIAL Arch `php` package (current PHP version).
# Values are concrete package names — used verbatim by the role.
# Empty string '' = built into the core `php` package (no separate package).
# Missing keys fall back to '<__php_extension_prefix><name>' (e.g. 'php-foo').
__php_extension_map_official:
  curl: ''
  mbstring: ''
  xml: ''
  zip: ''
  intl: ''
  mysql: ''
  mysqli: ''
  pdo_mysql: ''
  mysqlnd: ''
  json: ''
  openssl: ''
  tokenizer: ''
  ctype: ''
  session: ''
  fileinfo: ''
  filter: ''
  dom: ''
  simplexml: ''
  xmlreader: ''
  xmlwriter: ''
  phar: ''
  iconv: ''
  pcre: ''
  pdo: ''
  pdo_sqlite: ''
  bcmath: ''
  bz2: ''
  calendar: ''
  dba: ''
  exif: ''
  ffi: ''
  ftp: ''
  gettext: ''
  gmp: ''
  ldap: ''
  pcntl: ''
  posix: ''
  shmop: ''
  soap: ''
  sockets: ''
  sysvmsg: ''
  sysvsem: ''
  sysvshm: ''
  opcache: ''
  gd: 'php-gd'
  imagick: 'php-imagick'
  pgsql: 'php-pgsql'
  sqlite: 'php-sqlite'
  sodium: 'php-sodium'
  tidy: 'php-tidy'
  xsl: 'php-xsl'
  snmp: 'php-snmp'
  odbc: 'php-odbc'
  enchant: 'php-enchant'
  dblib: 'php-dblib'
  apcu: 'php-apcu'
  redis: 'php-redis'
  memcached: 'php-memcached'
  mongodb: 'php-mongodb'
  igbinary: 'php-igbinary'
  grpc: 'php-grpc'
  xdebug: 'xdebug'

# Extension mapping for AUR `phpXX-*` bundles (non-current PHP versions).
# Values are SUFFIXES — the role prepends __php_extension_prefix (e.g. 'php84-').
# Empty string '' = bundled into the AUR `phpXX` core package (no separate
# sub-package — typical for json, pcre, session, filter, pdo_sqlite, ...).
# Missing keys fall back to '<__php_extension_prefix><name>'. Note that
# `phpXX-redis`, `phpXX-mongodb`, `phpXX-grpc` are not shipped by the
# standard AUR phpXX bundle and will fail to install via this fallback.
__php_extension_map_aur:
  # Built into the AUR phpXX core package
  json: ''
  pcre: ''
  session: ''
  filter: ''
  pdo_sqlite: ''
  pdo_mysql: ''
  mysqlnd: ''
  # mysqli ships inside the phpXX-mysql sub-package alongside the legacy
  # mysql extension; alias it so a `mysqli` entry installs the right one.
  mysqli: 'mysql'
  # Split as separate phpXX-* sub-packages
  curl: 'curl'
  mbstring: 'mbstring'
  xml: 'xml'
  zip: 'zip'
  intl: 'intl'
  mysql: 'mysql'
  openssl: 'openssl'
  tokenizer: 'tokenizer'
  ctype: 'ctype'
  fileinfo: 'fileinfo'
  dom: 'dom'
  simplexml: 'simplexml'
  xmlreader: 'xmlreader'
  xmlwriter: 'xmlwriter'
  phar: 'phar'
  iconv: 'iconv'
  pdo: 'pdo'
  bcmath: 'bcmath'
  bz2: 'bz2'
  calendar: 'calendar'
  dba: 'dba'
  exif: 'exif'
  ffi: 'ffi'
  firebird: 'firebird'
  ftp: 'ftp'
  gettext: 'gettext'
  gmp: 'gmp'
  imap: 'imap'
  ldap: 'ldap'
  pcntl: 'pcntl'
  pdo_sqlsrv: 'pdo_sqlsrv'
  posix: 'posix'
  pspell: 'pspell'
  shmop: 'shmop'
  soap: 'soap'
  sockets: 'sockets'
  sysvmsg: 'sysvmsg'
  sysvsem: 'sysvsem'
  sysvshm: 'sysvshm'
  opcache: 'opcache'
  gd: 'gd'
  imagick: 'imagick'
  pgsql: 'pgsql'
  sqlite: 'sqlite'
  sodium: 'sodium'
  tidy: 'tidy'
  xsl: 'xsl'
  snmp: 'snmp'
  odbc: 'odbc'
  enchant: 'enchant'
  dblib: 'dblib'
  apcu: 'apcu'
  memcached: 'memcached'
  igbinary: 'igbinary'
  xdebug: 'xdebug'
