---
# Composer package name (all OS families)
__php_composer_package: 'composer'

# Composer command installed by the distribution package
__php_composer_package_script: '/usr/bin/composer'

# Upstream composer.phar (where the source of PHP ships no Composer)
__php_composer_download_url: 'https://getcomposer.org/download/{{ php_composer_version }}/composer.phar'
__php_composer_phar: '/usr/local/lib/composer.phar'

# Directory of the composer and composer<XX> wrappers
__php_composer_wrapper_dir: '/usr/local/bin'
