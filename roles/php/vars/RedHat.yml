---
# AppStream defaults (php_redhat_repo == 'appstream'). The package names
# are set per version in install_version.yml: AppStream from the prefix in
# __php_redhat_versions, Remi from the versioned SCL prefix php<XX>-php-.
# For EL 9, see RedHat-9.yml.

__php_fpm_service: 'php-fpm'

#
# AppStream Versions
#

# Version that 'auto' resolves to on a host without PHP
__php_redhat_default_version: '8.3'

# Available AppStream versions and the package prefix of each. EL 10 ships
# the default as php-* and PHP 8.4 as the alternative set php8.4-*: same
# paths, same php-fpm service, the two sets conflict with each other.
__php_redhat_versions:
  '8.3': 'php-'
  '8.4': 'php8.4-'

# Versions served as module streams (none on EL 10, modularity was removed)
__php_redhat_streams: []

# RHEL does not use update-alternatives for PHP (single stream at a time)
__php_has_alternatives: false

# AppStream paths. The CLI and FPM SAPIs share /etc/php.ini and /etc/php.d;
# /etc/php-fpm.d holds the FPM pools (FPM reads only *.conf there).
__php_conf_dirs:
  - '/etc/php.d'
__php_fpm_pool_dir: '/etc/php-fpm.d'
__php_fpm_listen_default: '/run/php-fpm/www.sock'

# Socket path of a named pool: this prefix plus '<name>.sock'. EL names the
# socket of the www pool after the pool (www.sock), so named pools follow suit.
__php_fpm_listen_pool_prefix: '/run/php-fpm/'

# FPM binary and master config, for the configuration test after a pool change
__php_fpm_binary: '/usr/sbin/php-fpm'
__php_fpm_config: '/etc/php-fpm.conf'

# FPM pool defaults
__php_fpm_default_user: 'apache'
__php_fpm_default_group: 'apache'

# Extension name mapping: generic name → AppStream package SUFFIX, appended
# to the prefix of the selected version ('mbstring' → php-mbstring or
# php8.4-mbstring), like the Remi and Arch AUR maps. Empty string = built
# into the php package (no separate package needed). Missing keys fall back
# to '<__php_extension_prefix><name>'.
__php_extension_map:
  # Built into the core php package on AppStream
  curl: ''
  openssl: ''
  json: ''
  tokenizer: ''
  ctype: ''
  session: ''
  fileinfo: ''
  filter: ''
  iconv: ''
  pcre: ''
  phar: ''
  # Shipped as separate AppStream packages, despite being core extensions
  # upstream. php-pdo also arrives as a dependency of php-mysqlnd, which is why
  # a host with a database extension appears to have it without asking.
  mbstring: 'mbstring'
  pdo: 'pdo'
  # Naming differences vs. generic extension names
  mysql: 'mysqlnd'
  mysqli: 'mysqlnd'
  mysqlnd: 'mysqlnd'
  pdo_mysql: 'mysqlnd'
  dom: 'xml'
  simplexml: 'xml'
  xmlreader: 'xml'
  xmlwriter: 'xml'
  xsl: 'xml'
  # Separate AppStream packages
  bcmath: 'bcmath'
  dba: 'dba'
  enchant: 'enchant'
  gd: 'gd'
  gmp: 'gmp'
  intl: 'intl'
  ldap: 'ldap'
  odbc: 'odbc'
  opcache: 'opcache'
  pdo_sqlite: 'pdo'
  pgsql: 'pgsql'
  # The PDO driver ships in the pgsql package; there is no pdo_pgsql package
  pdo_pgsql: 'pgsql'
  process: 'process'
  snmp: 'snmp'
  soap: 'soap'
  sodium: 'sodium'
  sqlite: 'pdo'
  xml: 'xml'
  zip: 'pecl-zip'
  # PECL extensions (in AppStream or EPEL). EPEL builds only against the
  # default version, so on EL 10 the EPEL-only ones (imagick, memcache,
  # mongodb) exist as php-pecl-* and not as php8.4-pecl-*.
  apcu: 'pecl-apcu'
  imagick: 'pecl-imagick'
  memcached: 'pecl-memcache'
  mongodb: 'pecl-mongodb'
  redis: 'pecl-redis'
  xdebug: 'pecl-xdebug3'
  # pcov is not packaged for AppStream or EPEL — it is only available via
  # the Remi repository (php_redhat_repo: 'remi', see
  # __php_extension_map_remi below). Mapped to '' so that an AppStream
  # request is an intentional no-op rather than a failing install.
  pcov: ''

# Extension name mapping for the Remi SCL layout (php_redhat_repo == 'remi').
# Like __php_extension_map above, these values are SUFFIXES, appended to the
# versioned Remi prefix 'php<XX>-php-' (e.g. 'pecl-xdebug3' ->
# 'php84-php-pecl-xdebug3'), mirroring the Arch AUR map. Empty string = built into the base php<XX>-php package
# (php<XX>-php-common). Missing keys fall back to '<prefix><name>'. Suffixes
# verified against rpms.remirepo.net; version digits (redis6, xdebug3,
# imagick-im7) track Remi's current packaging and may shift on updates.
__php_extension_map_remi:
  # Built into the base php<XX>-php package (via php<XX>-php-common)
  curl: ''
  openssl: ''
  json: ''
  tokenizer: ''
  ctype: ''
  session: ''
  fileinfo: ''
  filter: ''
  iconv: ''
  pcre: ''
  phar: ''
  # Bundled subpackages — several generic names share one subpackage
  mbstring: 'mbstring'
  mysql: 'mysqlnd'
  mysqli: 'mysqlnd'
  mysqlnd: 'mysqlnd'
  pdo_mysql: 'mysqlnd'
  pdo: 'pdo'
  pdo_sqlite: 'pdo'
  sqlite: 'pdo'
  dom: 'xml'
  simplexml: 'xml'
  xmlreader: 'xml'
  xmlwriter: 'xml'
  xsl: 'xml'
  xml: 'xml'
  process: 'process'
  # Separate subpackages
  bcmath: 'bcmath'
  dba: 'dba'
  enchant: 'enchant'
  gd: 'gd'
  gmp: 'gmp'
  intl: 'intl'
  ldap: 'ldap'
  odbc: 'odbc'
  opcache: 'opcache'
  pgsql: 'pgsql'
  # The PDO driver ships in the pgsql subpackage; there is no pdo_pgsql one
  pdo_pgsql: 'pgsql'
  snmp: 'snmp'
  soap: 'soap'
  sodium: 'sodium'
  # PECL extensions (php<XX>-php-pecl-*). Remi ships no unversioned imagick —
  # it splits by ImageMagick major version; im7 is the modern default.
  apcu: 'pecl-apcu'
  imagick: 'pecl-imagick-im7'
  memcached: 'pecl-memcached'
  mongodb: 'pecl-mongodb'
  redis: 'pecl-redis6'
  xdebug: 'pecl-xdebug3'
  zip: 'pecl-zip'
  pcov: 'pecl-pcov'
