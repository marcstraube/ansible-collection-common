---
# AppStream PHP defaults (used when php_redhat_repo == 'appstream', the
# default). Remi patterns are applied as overrides in install_version.yml
# when php_redhat_repo == 'remi' — they need __php_ver_compact, which is
# set per-version inside the install loop.

__php_cli_package: 'php-cli'
__php_fpm_package: 'php-fpm'
__php_extension_prefix: 'php-'
__php_fpm_service: 'php-fpm'

# RHEL does not use update-alternatives for PHP (single stream at a time)
__php_has_alternatives: false

# AppStream paths
__php_conf_dirs:
  - '/etc/php.d'
  - '/etc/php-fpm.d'
__php_fpm_pool_dir: '/etc/php-fpm.d'
__php_fpm_listen_default: '/run/php-fpm/www.sock'

# FPM pool defaults
__php_fpm_default_user: 'apache'
__php_fpm_default_group: 'apache'

# Extension name mapping: generic name → RHEL AppStream package name.
# Empty string = built into the php package (no separate package needed).
# Missing keys fall back to '<__php_extension_prefix><name>'.
__php_extension_map:
  # Built into the core php package on AppStream
  curl: ''
  mbstring: ''
  openssl: ''
  json: ''
  tokenizer: ''
  ctype: ''
  session: ''
  fileinfo: ''
  filter: ''
  iconv: ''
  pcre: ''
  pdo: ''
  phar: ''
  # Naming differences vs. generic extension names
  mysql: 'php-mysqlnd'
  mysqli: 'php-mysqlnd'
  mysqlnd: 'php-mysqlnd'
  pdo_mysql: 'php-mysqlnd'
  dom: 'php-xml'
  simplexml: 'php-xml'
  xmlreader: 'php-xml'
  xmlwriter: 'php-xml'
  xsl: 'php-xml'
  # Separate AppStream packages
  bcmath: 'php-bcmath'
  dba: 'php-dba'
  enchant: 'php-enchant'
  gd: 'php-gd'
  gmp: 'php-gmp'
  intl: 'php-intl'
  ldap: 'php-ldap'
  odbc: 'php-odbc'
  opcache: 'php-opcache'
  pdo_sqlite: 'php-pdo'
  pgsql: 'php-pgsql'
  process: 'php-process'
  snmp: 'php-snmp'
  soap: 'php-soap'
  sodium: 'php-sodium'
  sqlite: 'php-pdo'
  xml: 'php-xml'
  zip: 'php-pecl-zip'
  # PECL extensions (in EPEL or AppStream)
  apcu: 'php-pecl-apcu'
  imagick: 'php-pecl-imagick'
  memcached: 'php-pecl-memcache'
  mongodb: 'php-pecl-mongodb'
  redis: 'php-pecl-redis'
  xdebug: 'php-pecl-xdebug3'
  # pcov is not packaged for AppStream or EPEL — it is only available via
  # the Remi repository (php_redhat_repo: 'remi', see
  # __php_extension_map_remi below). Mapped to '' so that an AppStream
  # request is an intentional no-op rather than a failing install.
  pcov: ''

# Extension name mapping for the Remi SCL layout (php_redhat_repo == 'remi').
# Unlike __php_extension_map above (full AppStream package names used
# verbatim), these values are SUFFIXES appended to the versioned Remi prefix
# 'php<XX>-php-' (e.g. 'pecl-xdebug3' -> 'php84-php-pecl-xdebug3'), mirroring
# the Arch AUR map. Empty string = built into the base php<XX>-php package
# (php<XX>-php-common). Missing keys fall back to '<prefix><name>'. Suffixes
# verified against rpms.remirepo.net; version digits (redis6, xdebug3,
# imagick-im7) track Remi's current packaging and may shift on updates.
__php_extension_map_remi:
  # Built into the base php<XX>-php package (via php<XX>-php-common)
  curl: ''
  openssl: ''
  json: ''
  tokenizer: ''
  ctype: ''
  session: ''
  fileinfo: ''
  filter: ''
  iconv: ''
  pcre: ''
  phar: ''
  # Bundled subpackages — several generic names share one subpackage
  mbstring: 'mbstring'
  mysql: 'mysqlnd'
  mysqli: 'mysqlnd'
  mysqlnd: 'mysqlnd'
  pdo_mysql: 'mysqlnd'
  pdo: 'pdo'
  pdo_sqlite: 'pdo'
  sqlite: 'pdo'
  dom: 'xml'
  simplexml: 'xml'
  xmlreader: 'xml'
  xmlwriter: 'xml'
  xsl: 'xml'
  xml: 'xml'
  process: 'process'
  # Separate subpackages
  bcmath: 'bcmath'
  dba: 'dba'
  enchant: 'enchant'
  gd: 'gd'
  gmp: 'gmp'
  intl: 'intl'
  ldap: 'ldap'
  odbc: 'odbc'
  opcache: 'opcache'
  pgsql: 'pgsql'
  snmp: 'snmp'
  soap: 'soap'
  sodium: 'sodium'
  # PECL extensions (php<XX>-php-pecl-*). Remi ships no unversioned imagick —
  # it splits by ImageMagick major version; im7 is the modern default.
  apcu: 'pecl-apcu'
  imagick: 'pecl-imagick-im7'
  memcached: 'pecl-memcached'
  mongodb: 'pecl-mongodb'
  redis: 'pecl-redis6'
  xdebug: 'pecl-xdebug3'
  zip: 'pecl-zip'
  pcov: 'pecl-pcov'
