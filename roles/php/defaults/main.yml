---
#
# Role Control
#

# Enable the php role
php_enabled: true

#
# PHP-FPM
#

# Enable and start PHP-FPM services
php_fpm_enabled: true

#
# PHP Versions
#

# PHP versions to install side by side
# Each entry supports: version (required), extensions (list, default: []), fpm (bool, default: true)
# Per-version config overrides via ini (dict, keys without the php_ini_ prefix)
# and fpm_pools (list of FPM pools, see PHP-FPM Pools below).
# Example:
#   php_versions:
#     - version: '8.3'
#       extensions:
#         - curl
#         - mbstring
#       fpm: false
#     - version: '8.4'
#       extensions:
#         - curl
#         - mbstring
#         - xml
#         - zip
#       fpm: true
#       ini:
#         memory_limit: '512M'
#         display_errors: 'On'
#       fpm_pools:
#         - name: 'www'
#           pm_max_children: 50
php_versions:
  - version: 'auto'
    extensions: []
    fpm: true

# Default PHP version for CLI (update-alternatives on Debian, symlinks on RHEL/Arch)
# Use 'auto' to match the system-provided PHP version.
php_default_version: 'auto'

# RHEL/Rocky/Alma: choose the PHP source repository.
#
#   'appstream' (default): Distro AppStream PHP, a single version per host.
#                          The version selects the module stream on EL 9
#                          (8.0 default, 8.1 to 8.3) and the package set on
#                          EL 10 (8.3 default as php-*, 8.4 as php8.4-*);
#                          'auto' installs the default.
#                          Package names: php-cli, php-fpm, php-<ext>
#                                         (php8.4-* for 8.4 on EL 10)
#                          Paths:         /etc/php.d/, /etc/php-fpm.d/
#                          Conservative lifecycle, no third-party repo.
#
#   'remi':                Remi Collet's repository. Side-by-side multi-version
#                          installs, newest PHP releases available immediately.
#                          Package names: php<XX>-php-cli, php<XX>-php-<ext>
#                          Paths:         /etc/opt/remi/php<XX>/...
#                          Pulls in remi-release; recommended for hosts that
#                          need several PHP versions in parallel.
#
# Ignored on Arch and Debian (those have only one upstream source each).
php_redhat_repo: 'appstream'

#
# Package Updates
#

# State of the PHP packages of every configured version:
#   'present' installs missing packages and never updates (default).
#   'latest'  updates all installed PHP packages of each version in one
#             transaction and restarts the affected PHP-FPM services.
# Pass 'latest' for a targeted update instead of setting it in inventory:
#   --tags php -e php_packages_state=latest
# Ignored on Arch Linux: updating single packages is a partial upgrade there,
# PHP updates with the full system upgrade.
php_packages_state: 'present'

# Lowest acceptable version per PHP branch, checked after the package task.
# Meant to be passed with the update command to confirm that the repository
# already carries a fix; the run fails when an installed branch is older:
#   -e '{"php_packages_minimum": {"8.3": "8.3.34"}}'
# Branches that are not configured on the host are ignored.
php_packages_minimum: {}

#
# PHP Configuration (php.ini)
#
# Drop-in override deployed to conf.d/99-ansible.ini.
# Only commonly tuned settings — upstream defaults for everything else.
# Per-version overrides via php_versions[].ini dict (keys without php_ini_ prefix).

# Resource limits
php_ini_memory_limit: '128M'
php_ini_max_execution_time: 30
php_ini_max_input_time: 60
php_ini_max_input_vars: 1000

# Upload
php_ini_file_uploads: 'On'
php_ini_upload_max_filesize: '2M'
php_ini_post_max_size: '8M'

# Error handling
php_ini_error_reporting: 'E_ALL & ~E_DEPRECATED & ~E_STRICT'
php_ini_display_errors: 'Off'
php_ini_display_startup_errors: 'Off'
php_ini_log_errors: 'On'
# Where PHP writes those errors. This drop-in applies to every SAPI, CLI
# included, so a file path would have to be writable by every user running php
# on the command line. 'syslog' avoids that and still guarantees a destination;
# set a file per pool through php_fpm_pool_admin_values when a dedicated log is
# wanted. An empty value omits the directive and leaves the destination to the
# distribution's own php.ini.
php_ini_error_log: 'syslog'

# Security
php_ini_expose_php: 'Off'

# Date/Time
php_ini_date_timezone: 'UTC'

# Session
php_ini_session_gc_maxlifetime: 1440
php_ini_session_use_strict_mode: 1
php_ini_session_cookie_httponly: 1

# OPcache
php_ini_opcache_enable: 1
php_ini_opcache_memory_consumption: 128
php_ini_opcache_max_accelerated_files: 10000
php_ini_opcache_validate_timestamps: 1
php_ini_opcache_revalidate_freq: 2

# Additional ini directives not covered by the variables above, as a dict of
# directive name to value. Keys are written verbatim, so dotted names such as
# session.save_path work without further mapping. Rendered after all settings
# above, so a key listed here wins over the same directive set earlier.
# Per-version overrides go into php_versions[].ini.extra_settings and are merged
# on top of this dict.
php_ini_extra_settings: {}

#
# PHP-FPM Pools
#
# Global defaults for every FPM pool. The role always writes the www pool
# (www.conf); php_versions[].fpm_pools adds named pools per version, each
# written to <pool dir>/<name>.conf. An entry takes the settings below as keys
# without the php_fpm_pool_ prefix and falls back to these defaults for every
# key it leaves out. An entry named www configures www.conf. Further entry keys:
#   name  - pool name, [a-z0-9_-]+, unique per version (required)
#   state - 'present' (default) or 'absent', which removes <name>.conf; not
#           allowed for www, the package ships that file
# The pool users and groups must exist before the role runs.
# Example:
#   php_versions:
#     - version: 'auto'
#       fpm_pools:
#         - name: 'app'
#           user: 'app'
#           group: 'app'
#           listen_owner: 'www-data'
#           admin_values:
#             open_basedir: '/srv/app:/tmp'
#         - name: 'legacy'
#           state: 'absent'
#
# DEPRECATED: removed in v4.0.0. php_versions[].fpm_pool (dict, keys without
# the php_fpm_pool_ prefix) still configures the www pool and prints a
# deprecation warning; move its keys into an fpm_pools entry named www. A
# version cannot set both.

# Pool user/group (empty = OS default from vars/)
php_fpm_pool_user: ''
php_fpm_pool_group: ''

# Listen address of the www pool (empty = default socket per version and OS).
# Named pools ignore it and default to a socket of their own next to it, e.g.
# /run/php/php8.4-fpm-<name>.sock on Debian; their entries set listen to
# change it.
php_fpm_pool_listen: ''
php_fpm_pool_listen_owner: ''
php_fpm_pool_listen_group: ''
php_fpm_pool_listen_mode: '0660'

# Process manager: static | dynamic | ondemand
php_fpm_pool_pm: 'dynamic'
php_fpm_pool_pm_max_children: 5
php_fpm_pool_pm_start_servers: 2
php_fpm_pool_pm_min_spare_servers: 1
php_fpm_pool_pm_max_spare_servers: 3
php_fpm_pool_pm_max_requests: 0
php_fpm_pool_pm_process_idle_timeout: '10s'

# Request limits
php_fpm_pool_request_terminate_timeout: 0
php_fpm_pool_request_slowlog_timeout: 0

# Security
php_fpm_pool_security_limit_extensions: '.php'

# Logging
# Whether FPM captures worker stdout/stderr into its own error log. The FPM
# default of 'no' discards it, which hides everything PHP writes outside the
# php.ini error log — extension startup warnings and engine-level messages among
# them. Enabling it sends that output to the FPM master log, where several pools
# share one file and stray application output accumulates.
php_fpm_pool_catch_workers_output: 'no'

# Per-pool php_admin_value / php_admin_flag directives, as a mapping of
# directive name to value. Unlike php.ini settings these are set per pool and
# cannot be overridden by the application at runtime, which is what makes them
# the right place for a pool-specific error_log.
php_fpm_pool_admin_values: {}
php_fpm_pool_admin_flags: {}

# Environment variables for the pool workers, as a mapping of name to value,
# written as env[NAME] = value. PHP-FPM clears the worker environment
# (clear_env = yes), so these are the only variables an application finds in
# its environment through getenv(). The env key of an fpm_pools entry is
# merged over this mapping, as are admin_values and admin_flags over theirs.
php_fpm_pool_env: {}
# Example — outbound proxy for HTTP clients such as Guzzle:
#   php_fpm_pool_env:
#     HTTPS_PROXY: 'http://proxy.example.com:3128'
#     NO_PROXY: 'localhost,127.0.0.1'

# Remove pool files from the pool directory of each version that are neither
# listed in fpm_pools nor in php_fpm_pools_keep. Only files whose content
# starts with the ansible_managed header are removed, so pools shipped by a
# package or written by hand are never touched; www.conf always counts as
# listed. Opt-in because it deletes files.
php_fpm_pools_exclusive: false

# Pool file names to keep in exclusive mode even when unlisted
# Example:
#   - 'legacy.conf'
php_fpm_pools_keep: []

#
# Composer
#

# Enable Composer (PHP dependency manager). Installs one Composer and the
# wrappers /usr/local/bin/composer (runs on php_default_version) and
# /usr/local/bin/composer<XX> for every version in php_versions.
php_composer_enabled: false

# Composer release downloaded from getcomposer.org where the source of PHP
# ships no Composer package (Sury, Remi, EL 10 php8.4-*, AUR versions only);
# elsewhere the distribution package is installed. A channel such as
# 'latest-stable' or 'latest-2.2.x' (LTS, PHP 5.3 to 7.2) follows upstream,
# with php_composer_checksum set to the matching .sha256sum URL.
php_composer_version: '2.11.1'

# SHA-256 checksum of composer.phar of php_composer_version, set together
# with it: 'sha256:<hash>' or 'sha256:<url of the .sha256sum file>'
php_composer_checksum: 'sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c'

# Optional HTTP(S) proxy for the composer.phar download — applied as
# HTTPS_PROXY/HTTP_PROXY env vars on the download task. Required in networks
# that have no direct DNS/internet access to getcomposer.org.
# Empty (default) = no proxy. Example: http://proxy.example.com:3128
php_composer_proxy: ''
