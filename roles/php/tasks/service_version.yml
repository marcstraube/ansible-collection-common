---
- name: Service Version | Resolve auto version to system default
  ansible.builtin.set_fact:
    __php_resolved_version: >-
      {{ (__php_service_item.version == 'auto')
         | ternary(__php_system_version, __php_service_item.version) }}
  when: __php_service_item.fpm | default(true) | bool

- name: Service Version | Set version facts
  ansible.builtin.set_fact:
    __php_ver: '{{ __php_resolved_version }}'
    __php_ver_compact: "{{ __php_resolved_version | replace('.', '') }}"
  when: __php_service_item.fpm | default(true) | bool

# Reset Arch service name to official default
- name: Service Version | Reset Arch service name
  ansible.builtin.set_fact:
    __php_fpm_service: 'php-fpm'
  when:
    - __php_service_item.fpm | default(true) | bool
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_ver == __php_system_version

# Override for AUR versions
- name: Service Version | Set Arch AUR service name
  ansible.builtin.set_fact:
    __php_fpm_service: 'php{{ __php_ver_compact }}-fpm'
  when:
    - __php_service_item.fpm | default(true) | bool
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_ver != __php_system_version

# Override for RedHat Remi (versioned SCL service, one per side-by-side version).
# install_version.yml bakes __php_fpm_service to the last installed version, so
# recompute it per version here or only that version's service gets managed.
- name: Service Version | Set RedHat Remi service name
  ansible.builtin.set_fact:
    __php_fpm_service: 'php{{ __php_ver_compact }}-php-fpm'
  when:
    - __php_service_item.fpm | default(true) | bool
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'remi'

- name: Service Version | Manage PHP-FPM
  ansible.builtin.systemd_service:
    name: '{{ __php_fpm_service }}'
    enabled: "{{ php_fpm_enabled | bool }}"
    state: "{{ php_fpm_enabled | bool | ternary('started', 'stopped') }}"
    daemon_reload: true
  when: __php_service_item.fpm | default(true) | bool
