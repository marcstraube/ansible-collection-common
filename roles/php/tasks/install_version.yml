---
- name: Install Version | Resolve auto version to system default
  ansible.builtin.set_fact:
    __php_resolved_version: >-
      {{ (__php_version_item.version == 'auto')
         | ternary(__php_system_version, __php_version_item.version) }}

- name: Install Version | Validate AppStream version matches active stream
  ansible.builtin.assert:
    that:
      - (__php_resolved_version | string) == (__php_system_version | string)
    fail_msg: |
      The active AppStream PHP module stream is {{ __php_system_version }},
      but the inventory requested PHP {{ __php_resolved_version }}.
      AppStream streams are exclusive — switch the active stream with
      'sudo dnf module reset -y php && sudo dnf module enable -y php:{{ __php_resolved_version }}'
      before re-running this role, or set php_redhat_repo: 'remi' to use
      Remi side-by-side packages instead.
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'appstream'

- name: Install Version | Set version facts
  ansible.builtin.set_fact:
    __php_ver: '{{ __php_resolved_version }}'
    __php_ver_compact: "{{ __php_resolved_version | replace('.', '') }}"
    __php_use_aur: false
    # Whether the active extension map holds suffixes (prefix applied) rather
    # than full package names. True on the Arch AUR and RedHat Remi paths.
    __php_extension_map_suffix: false

# Reset Arch patterns to official repo defaults (overridden by set_fact in previous AUR iterations)
- name: Install Version | Reset Arch package patterns
  ansible.builtin.set_fact:
    __php_cli_package: 'php'
    __php_fpm_package: 'php-fpm'
    __php_extension_prefix: 'php-'
    __php_fpm_service: 'php-fpm'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_ver == __php_system_version

# Override for AUR versions (non-current PHP on Arch)
- name: Install Version | Set Arch AUR package patterns
  ansible.builtin.set_fact:
    __php_cli_package: 'php{{ __php_ver_compact }}'
    __php_fpm_package: 'php{{ __php_ver_compact }}-fpm'
    __php_extension_prefix: 'php{{ __php_ver_compact }}-'
    __php_fpm_service: 'php{{ __php_ver_compact }}-fpm'
    __php_use_aur: true
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_ver != __php_system_version

# Override for Remi (RHEL multi-version side-by-side install).
# vars/RedHat.yml ships AppStream defaults; switch to Remi naming +
# paths when the inventory selects php_redhat_repo: 'remi'.
- name: Install Version | Set RedHat Remi package patterns
  ansible.builtin.set_fact:
    __php_cli_package: 'php{{ __php_ver_compact }}-php-cli'
    __php_fpm_package: 'php{{ __php_ver_compact }}-php-fpm'
    __php_extension_prefix: 'php{{ __php_ver_compact }}-php-'
    __php_fpm_service: 'php{{ __php_ver_compact }}-php-fpm'
    __php_conf_dirs:
      - '/etc/opt/remi/php{{ __php_ver_compact }}/php.d'
    __php_fpm_pool_dir: '/etc/opt/remi/php{{ __php_ver_compact }}/php-fpm.d'
    __php_fpm_listen_default: >-
      /var/opt/remi/php{{ __php_ver_compact }}/run/php-fpm/www.sock
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'remi'

# Select the active extension map. On Arch, the official `php` and AUR
# `phpXX-*` package layouts disagree on what is split out, what is built-in,
# and on the prefix scheme — they need separate maps. Other OSes use the
# single map defined in their respective vars/ file.
- name: Install Version | Select Arch AUR extension map
  ansible.builtin.set_fact:
    __php_extension_map: '{{ __php_extension_map_aur }}'
    __php_extension_map_suffix: true
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool

- name: Install Version | Select Arch official extension map
  ansible.builtin.set_fact:
    __php_extension_map: '{{ __php_extension_map_official }}'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - not (__php_use_aur | bool)

# On Remi, base and extension packages use versioned SCL names
# (php<XX>-php-<...>). vars/RedHat.yml ships the AppStream map (full package
# names) as the default, so switch to the Remi suffix map and prefix its
# values with __php_extension_prefix like the Arch AUR path.
- name: Install Version | Select RedHat Remi extension map
  ansible.builtin.set_fact:
    __php_extension_map: '{{ __php_extension_map_remi }}'
    __php_extension_map_suffix: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'remi'

# Build the package list. When the active map holds suffixes (Arch AUR,
# RedHat Remi) they must be prefixed with __php_extension_prefix (e.g.
# 'php84-' or 'php84-php-'); otherwise the map values are full package names
# and are used verbatim.
- name: Install Version | Build package list
  ansible.builtin.set_fact:
    __php_version_packages: >-
      {{ [__php_cli_package] +
         ((__php_version_item.fpm | default(true) | bool) | ternary([__php_fpm_package], [])) +
         _mapped_final +
         (_unmapped | map('regex_replace', '^(.*)$', __php_extension_prefix + '\1') | list) }}
  vars:
    _map: "{{ __php_extension_map | default({}) }}"
    _exts: "{{ __php_version_item.extensions | default([]) }}"
    _mapped_raw: "{{ _exts | select('in', _map) | map('extract', _map) | reject('equalto', '') | list }}"
    _unmapped: "{{ _exts | reject('in', _map) | list }}"
    _mapped_final: >-
      {{ (__php_extension_map_suffix | default(false) | bool)
         | ternary(_mapped_raw | map('regex_replace', '^(.*)$', __php_extension_prefix + '\1') | list,
                   _mapped_raw) }}

- name: Install Version | PHP packages
  ansible.builtin.package:
    name: '{{ __php_version_packages }}'
    state: present
  retries: 3
  delay: 5
  when: not (__php_use_aur | bool)

# Installed parts of the split package that are not in the configured
# list (e.g. phpXX-pdo or phpXX-cli, pulled in earlier as dependencies)
# pin the exact base version too and would block the upgrade — merge
# them into the same transaction.
# check_mode: false — read-only lookup, must run under --check so the
# merge below operates on the actual package list.
- name: Install Version | Detect installed split-package parts (Arch)
  ansible.builtin.command:
    cmd: pacman -Qq
  register: __php_installed_query
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool

- name: Install Version | Merge installed split-package parts (Arch)
  ansible.builtin.set_fact:
    __php_version_packages: >-
      {{ (__php_version_packages
          + (__php_installed_query.stdout_lines
             | select('match', '^' + (__php_extension_prefix | regex_escape) + '.+')
             | list))
         | unique | list }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool

# Version jump handling: the extensions need the NEW base installed to
# build (makedep), but pacman refuses to upgrade the base while the OLD
# extensions still pin it exactly — a circle paru cannot resolve
# (Morganamilo/paru#707). Detect the jump by comparing the installed
# base version against the AUR target and drop the pinned extension
# parts first (-Rdd, base stays); the install below then rebuilds
# everything in one go. A prior AUR system upgrade (e.g. via a system
# update role) makes this a no-op.
# check_mode: false — read-only lookup, must run under --check.
- name: Install Version | Query AUR target version (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  ansible.builtin.command:
    argv: ['paru', '-Si', '{{ __php_cli_package }}']
  environment:
    LC_ALL: 'C'
  register: __php_aur_target_info
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool

# check_mode: false — read-only lookup, must run under --check.
- name: Install Version | Query installed base version (Arch)
  ansible.builtin.command:
    argv: ['pacman', '-Q', '{{ __php_cli_package }}']
  register: __php_installed_base
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool

- name: Install Version | Remove pinned split-package parts before version jump (Arch)
  ansible.builtin.command:
    argv: >-
      {{ ['pacman', '-Rdd', '--noconfirm']
         + (__php_installed_query.stdout_lines
            | select('match', '^' + (__php_extension_prefix | regex_escape) + '.+')
            | list) }}
  register: __php_parts_removed
  changed_when: true
  vars:
    __php_aur_target_version: >-
      {{ (__php_aur_target_info.stdout_lines | default([])
          | select('match', '^Version')
          | map('regex_replace', '^Version\s*:\s*', '')
          | first | default('')) | trim }}
    __php_installed_base_version: >-
      {{ ((__php_installed_base.stdout | default('')).split() | last | default('')) }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool
    - __php_installed_base.rc | default(1) == 0
    - __php_aur_target_version | length > 0
    - __php_installed_base_version | length > 0
    - __php_aur_target_version != __php_installed_base_version
    - __php_installed_query.stdout_lines
      | select('match', '^' + (__php_extension_prefix | regex_escape) + '.+')
      | list | length > 0

# The AUR phpXX packages form a split package whose parts pin the exact
# base version (phpXX-<ext> depends on phpXX=<version>). kewlfft.aur.aur
# installs packages one at a time, which can never satisfy that pin once
# upstream moved past the installed version: the freshly built base
# conflicts with the still-pinned installed extensions. Call paru once
# with the full list instead, so the base and every extension move in a
# single transaction. --batchinstall makes paru defer the install of
# every built package to one final pacman transaction instead of
# installing after each build (paru's default staging otherwise prepares
# a base-only transaction that the still-pinned installed extensions
# reject — Morganamilo/paru#707). --needed keeps the call idempotent
# when everything is already current.
# --nocheck: the split-package check() phases are fragile against the
# live system libraries (e.g. the imagick SVG rendering comparison test
# breaks with current ImageMagick/librsvg) and rerun the full PHP test
# suite on every build. Upstream test coverage is the AUR maintainer's
# CI concern, not a deploy-time gate. The retries cover transient
# download failures; already built packages are reused from the cache
# on a retry.
- name: Install Version | PHP packages from AUR (Arch)
  become: true
  become_user: "{{ aur_builder_user | default('aur_builder') }}"
  ansible.builtin.command:
    argv: >-
      {{ ['paru', '-S', '--noconfirm', '--needed', '--cleanafter',
          '--batchinstall', '--mflags', '--nocheck'] + __php_version_packages }}
  environment:
    LC_ALL: 'C'
  register: __php_aur_install
  changed_when: "'there is nothing to do' not in __php_aur_install.stdout"
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - __php_use_aur | bool
