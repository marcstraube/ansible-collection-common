---
#
# Sury PHP Repository (Debian)
#

- name: Repos | Ensure apt prerequisites
  ansible.builtin.package:
    name:
      - 'ca-certificates'
      - 'python3-debian'
    state: present
  retries: 3
  delay: 5
  when: ansible_facts['os_family'] == 'Debian'

- name: Repos | Add Sury PHP repository (Debian)
  ansible.builtin.deb822_repository:
    name: php-sury
    types: deb
    uris: '{{ __php_sury_repo_uris }}'
    suites: '{{ __php_sury_repo_suites }}'
    components: '{{ __php_sury_repo_components }}'
    signed_by: '{{ __php_sury_gpg_url }}'
    state: present
  retries: 5
  delay: 10
  register: __php_sury_repo
  when: ansible_facts['distribution'] == 'Debian'

# The key is NOT passed to signed_by as a keyserver URL:
# keyserver.ubuntu.com is a cluster whose nodes serialize the same key
# differently, so the module would rewrite the keyring on every run and
# never report converged. It is fetched once instead, and signed_by
# points at the file. A rotated PPA key is therefore not picked up
# automatically — remove the keyring file to force a refetch.
- name: Repos | Stat Sury PPA signing key (Ubuntu)
  ansible.builtin.stat:
    path: '{{ __php_sury_ppa_keyring }}'
  register: __php_sury_ppa_key_stat
  check_mode: false
  when: ansible_facts['distribution'] == 'Ubuntu'

# check_mode: false — a read-only lookup that must run under --check,
# otherwise the fetch task below has no fingerprint to work with.
- name: Repos | Look up Sury PPA signing key fingerprint (Ubuntu)
  ansible.builtin.uri:
    url: >-
      {{ __php_sury_ppa_api_url }}/~{{ __php_sury_ppa_owner }}/+archive/ubuntu/{{ __php_sury_ppa_name }}
    return_content: true
  register: __php_sury_ppa_lookup
  retries: 5
  delay: 10
  check_mode: false
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - not (__php_sury_ppa_key_stat.stat.exists | default(false))

- name: Repos | Fetch Sury PPA signing key (Ubuntu)
  ansible.builtin.get_url:
    url: '{{ __php_sury_ppa_keyserver_url }}{{ __php_sury_ppa_lookup.json.signing_key_fingerprint }}'
    dest: '{{ __php_sury_ppa_keyring }}'
    owner: root
    group: root
    mode: '0644'
  retries: 5
  delay: 10
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - __php_sury_ppa_lookup.json is defined

- name: Repos | Add Sury PHP PPA (Ubuntu)
  ansible.builtin.deb822_repository:
    name: '{{ __php_sury_ppa_owner }}-ubuntu-{{ __php_sury_ppa_name }}'
    types: 'deb'
    uris: '{{ __php_sury_ppa_content_url }}/{{ __php_sury_ppa_owner }}/{{ __php_sury_ppa_name }}/ubuntu'
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: 'main'
    signed_by: '{{ __php_sury_ppa_keyring }}'
    state: present
  retries: 5
  delay: 10
  register: __php_sury_ppa
  when: ansible_facts['distribution'] == 'Ubuntu'

# apt_repository named its file ondrej-ubuntu-php-<release>.list. The
# module writes ondrej-ubuntu-php.sources, so the old file would leave
# the PPA configured twice.
- name: Repos | Remove legacy Sury PPA list entry (Ubuntu)
  ansible.builtin.file:
    path: >-
      /etc/apt/sources.list.d/{{ __php_sury_ppa_file }}.list
    state: absent
  vars:
    __php_sury_ppa_release: "{{ ansible_facts['distribution_release'] }}"
    __php_sury_ppa_file: '{{ __php_sury_ppa_owner }}-ubuntu-{{ __php_sury_ppa_name }}-{{ __php_sury_ppa_release }}'
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Repos | Update apt cache after repo change
  ansible.builtin.apt:
    update_cache: true
  retries: 3
  delay: 5
  when:
    - ansible_facts['os_family'] == 'Debian'
    - (__php_sury_repo is changed) or (__php_sury_ppa is changed)

#
# Remi (RHEL/Rocky/Alma): the Remi repository itself is multi-purpose
# (PHP, MariaDB, Redis, …) and lives in marcstraube.common.package_management
# under dnf_remi_enabled. The php role only validates that the repo is on
# the host when php_redhat_repo: 'remi' is requested — see install.yml.
#
