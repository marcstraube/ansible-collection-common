---
- name: Install | Detect current Arch PHP version
  ansible.builtin.command:
    cmd: pacman -Si php
  register: __php_arch_repo_info
  changed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install | Set Arch current PHP version fact
  ansible.builtin.set_fact:
    __php_arch_current_version: >-
      {{ (__php_arch_repo_info.stdout | regex_search('Version\s*:\s*(\d+)\.(\d+)', '\1', '\2')) | join('.') }}
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install | Detect current Debian PHP version
  ansible.builtin.shell:
    cmd: set -o pipefail && apt-cache show php | grep -m1 '^Depends:' | grep -oP 'php\K\d+\.\d+'
    executable: /bin/bash
  register: __php_debian_repo_info
  changed_when: false
  check_mode: false
  failed_when: __php_debian_repo_info.stdout | default('') | trim | length == 0
  when: ansible_facts['os_family'] == 'Debian'

- name: Install | Set Debian current PHP version fact
  ansible.builtin.set_fact:
    __php_debian_current_version: '{{ __php_debian_repo_info.stdout | trim }}'
  when:
    - ansible_facts['os_family'] == 'Debian'
    - __php_debian_repo_info.stdout | default('') | trim | length > 0

# When php_redhat_repo: 'remi' is requested, the Remi repo itself must
# already be on the host (deployed by marcstraube.common.package_management
# via dnf_remi_enabled — Remi is multi-purpose and lives there, not here).
- name: Install | Check Remi repo presence (RedHat)
  ansible.builtin.command:
    cmd: dnf repolist --enabled remi-safe
  register: __php_remi_repolist
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'remi'

- name: Install | Assert Remi repo is enabled when requested (RedHat)
  ansible.builtin.assert:
    that:
      - "'remi-safe' in (__php_remi_repolist.stdout | default(''))"
    fail_msg: |
      php_redhat_repo is 'remi' but the Remi repository is not enabled
      on this host. Remi is multi-purpose (PHP, MariaDB, Redis, ...) and
      is managed by marcstraube.common.package_management — enable it
      in inventory with:

        dnf_remi_enabled: true

      Optionally pin the active PHP module stream with:

        dnf_remi_php_version: '8.2'

      Then re-run the package_management role before this one.
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - php_redhat_repo == 'remi'

# The installed PHP version is read from the installed packages: the EL 10
# php8.4-* set has no package named php-cli (php8.4-cli only provides it), so
# 'dnf info php-cli' would report the default 8.3 on a host that runs 8.4.
# The facts also feed the update transaction and the minimum version check.
- name: Install | Gather package facts (RedHat)
  ansible.builtin.package_facts:
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install | Set RedHat installed PHP version fact
  ansible.builtin.set_fact:
    __php_redhat_installed_version: >-
      {{ __php_redhat_versions.values() | unique
         | map('regex_replace', '^(.*)$', '\1cli')
         | select('in', ansible_facts['packages'])
         | map('extract', ansible_facts['packages']) | map('first')
         | map(attribute='version')
         | map('regex_search', '^[0-9]+\.[0-9]+')
         | first | default('') }}
  when: ansible_facts['os_family'] == 'RedHat'

# EL 9 serves PHP 8.1 and later as module streams; the enabled stream
# decides which version the php-* packages resolve to.
# check_mode: false — read-only lookup, must run under --check.
- name: Install | Detect enabled PHP module stream (RedHat)
  ansible.builtin.command:
    cmd: dnf module list --enabled php
  register: __php_redhat_module_list
  changed_when: false
  check_mode: false
  # Exits non-zero when no stream is enabled
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - __php_redhat_streams | length > 0

- name: Install | Set RedHat enabled PHP module stream fact
  ansible.builtin.set_fact:
    __php_redhat_enabled_stream: >-
      {{ __php_redhat_module_list.stdout | default('')
         | regex_search('^php\s+(\S+)\s+(?:\[d\])?\[e\]', '\1', multiline=True)
         | default([], true) | first | default('') }}
  when: ansible_facts['os_family'] == 'RedHat'

# The installed version wins, then the enabled stream, then the AppStream
# default of the release.
- name: Install | Set RedHat current PHP version fact
  ansible.builtin.set_fact:
    __php_redhat_current_version: >-
      {{ (__php_redhat_installed_version | length > 0)
         | ternary(__php_redhat_installed_version,
                   (__php_redhat_stream_version | length > 0)
                   | ternary(__php_redhat_stream_version, __php_redhat_default_version)) }}
  vars:
    __php_redhat_stream_version: >-
      {{ __php_redhat_enabled_stream | regex_search('[0-9]+\.[0-9]+') | default('', true) }}
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install | Set unified system PHP version fact
  ansible.builtin.set_fact:
    __php_system_version: >-
      {{ __php_arch_current_version
         | default(__php_debian_current_version
         | default(__php_redhat_current_version
         | default('8.4'))) }}

- name: Install | Initialize FPM restart queue
  ansible.builtin.set_fact:
    __php_fpm_restart_services: []

# A targeted update must see the current repository state; dnf otherwise
# keeps cached metadata for up to metadata_expire. The cache is cleared
# rather than refreshed: dnf on EL 9 keeps the cached mirror list on
# makecache --refresh and stays on the mirror it picked first, even when
# that mirror has stopped syncing. Clearing the cache fetches a new list.
# check_mode: false — the metadata cache holds no package, and --check
# must report the update the real run would install.
- name: Install | Clear package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf clean metadata
  changed_when: false
  check_mode: false
  when:
    - php_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (RedHat)
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false
  check_mode: false
  when:
    - php_packages_state == 'latest'
    - ansible_facts['os_family'] == 'RedHat'

- name: Install | Refresh package metadata for update (Debian)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  check_mode: false
  when:
    - php_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

# Installed packages, for merging PHP packages outside the configured list
# into the update transaction (RedHat gathers them above).
- name: Install | Gather package facts for update (Debian)
  ansible.builtin.package_facts:
  when:
    - php_packages_state == 'latest'
    - ansible_facts['os_family'] == 'Debian'

- name: Install | PHP versions
  ansible.builtin.include_tasks:
    file: install_version.yml
    apply:
      tags:
        - php
        - php:install
  loop: '{{ php_versions }}'
  loop_control:
    loop_var: __php_version_item
  tags:
    - php
    - php:install
