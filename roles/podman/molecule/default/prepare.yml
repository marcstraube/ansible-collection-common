---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Create rootless test user
      ansible.builtin.user:
        name: johndoe
        create_home: true
        shell: /bin/bash

    - name: Prepare | Install sudo for visudo validation
      ansible.builtin.package:
        name: sudo
        state: present
      retries: 3
      delay: 5

    # Sudo PAM bypass — required for tasks using `become_user` on
    # geerlingguy Rocky containers under GitHub-hosted runners
    # (test container only).

    - name: Prepare | Bypass sudo PAM stack (RedHat container)
      ansible.builtin.copy:
        content: |
          #%PAM-1.0
          auth       sufficient   pam_permit.so
          account    sufficient   pam_permit.so
          password   sufficient   pam_permit.so
          session    sufficient   pam_permit.so
        dest: /etc/pam.d/sudo
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Disable sudoers authentication (RedHat container)
      ansible.builtin.copy:
        content: 'Defaults !authenticate'
        dest: /etc/sudoers.d/molecule-no-auth
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
      when: ansible_facts['os_family'] == 'RedHat'

    # The Rocky 10 test image ships newuidmap/newgidmap without the file
    # capabilities the shadow-utils package sets on a real host; rootless
    # podman as the test user cannot create its user namespace without
    # them (test container only).
    - name: Prepare | Restore the ID map helper capabilities (Rocky 10 container)
      community.general.capabilities:
        path: '/usr/bin/{{ item.helper }}'
        capability: '{{ item.capability }}'
        state: present
      loop:
        - { helper: newuidmap, capability: cap_setuid+ep }
        - { helper: newgidmap, capability: cap_setgid+ep }
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['distribution_major_version'] == '10'

    # State a previous run left behind with a user since dropped from
    # podman_nopasswd_sudo_users. Converge must drop that entry.
    - name: Prepare | Seed the podman sudoers file with a removed user
      ansible.builtin.copy:
        content: "olduser ALL=(ALL) NOPASSWD: /usr/bin/podman\n"
        dest: /etc/sudoers.d/60-role-podman
        owner: root
        group: root
        mode: '0440'
