---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install sudo for visudo validation
      ansible.builtin.package:
        name: sudo
        state: present
      retries: 3
      delay: 5

    # State a previous run left behind with a user since dropped from
    # podman_nopasswd_sudo_users. Converge must drop that entry.
    - name: Prepare | Seed the podman sudoers file with a removed user
      ansible.builtin.copy:
        content: "olduser ALL=(ALL) NOPASSWD: /usr/bin/podman\n"
        dest: /etc/sudoers.d/60-role-podman
        owner: root
        group: root
        mode: '0440'
