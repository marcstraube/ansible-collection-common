---
- name: Rootless | Configure subuid for users
  ansible.builtin.lineinfile:
    path: '/etc/subuid'
    regexp: '^{{ item.username }}:'
    line: >-
      {{ item.username }}:{{ item.subuid_start | default(100000) }}:{{
        item.subuid_count | default(podman_subid_count)
      }}
    create: true
    owner: root
    group: root
    mode: '0644'
  loop: '{{ podman_rootless_users }}'
  loop_control:
    label: '{{ item.username }}'

- name: Rootless | Configure subgid for users
  ansible.builtin.lineinfile:
    path: '/etc/subgid'
    regexp: '^{{ item.username }}:'
    line: >-
      {{ item.username }}:{{ item.subgid_start | default(100000) }}:{{
        item.subgid_count | default(podman_subid_count)
      }}
    create: true
    owner: root
    group: root
    mode: '0644'
  loop: '{{ podman_rootless_users }}'
  loop_control:
    label: '{{ item.username }}'

- name: Rootless | Check linger status for users
  ansible.builtin.stat:
    path: '/var/lib/systemd/linger/{{ item.username }}'
  loop: '{{ podman_rootless_users }}'
  loop_control:
    label: '{{ item.username }}'
  when: item.linger | default(false)
  register: __podman_linger_status

- name: Rootless | Enable linger for users
  ansible.builtin.command:
    cmd: 'loginctl enable-linger {{ item.item.username }}'
  loop: '{{ __podman_linger_status.results | default([]) }}'
  loop_control:
    label: '{{ item.item.username }}'
  when:
    - item is not skipped
    - not item.stat.exists
  changed_when: true

- name: Rootless | Create user config directories
  ansible.builtin.file:
    path: '~{{ item.username }}/.config/containers'
    state: directory
    owner: '{{ item.username }}'
    group: '{{ item.username }}'
    mode: '0755'
  loop: '{{ podman_rootless_users }}'
  loop_control:
    label: '{{ item.username }}'
  become: true
  become_user: '{{ item.username }}'

# On podman 6 a graphroot in the system storage.conf applies to rootless
# users as well. With a non-default podman_storage_root, point every listed
# user back at the per-user default so their storage stays in their home.
# The file is a safety net: an existing per-user storage.conf is never
# overwritten, so users keep their own graphroot.
- name: Rootless | Look up home directories
  ansible.builtin.getent:
    database: passwd
  when:
    - podman_rootless_users | length > 0
    - podman_storage_root != __podman_storage_default_root

- name: Rootless | Deploy per-user storage configuration
  ansible.builtin.template:
    src: storage-user.conf.j2
    dest: "{{ ansible_facts['getent_passwd'][item.username][4] }}/.config/containers/storage.conf"
    owner: '{{ item.username }}'
    group: '{{ item.username }}'
    mode: '0644'
    force: false
  loop: '{{ podman_rootless_users }}'
  loop_control:
    label: '{{ item.username }}'
  when: podman_storage_root != __podman_storage_default_root

- name: Rootless | Include BTRFS tasks for users
  ansible.builtin.include_tasks:
    file: rootless_btrfs.yml
    apply:
      tags:
        - podman
        - podman:rootless
  loop: '{{ podman_rootless_users }}'
  loop_control:
    loop_var: __podman_rootless_user
    label: '{{ __podman_rootless_user.username }}'
  when: podman_rootless_btrfs_subvolume_enabled | bool
  tags:
    - podman
    - podman:rootless
