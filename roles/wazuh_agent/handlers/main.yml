---
- name: Reload Wazuh agent systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: wazuh_agent_enabled | bool
  failed_when: false

# In check mode a first run only simulates the install, so the unit does
# not exist yet while the package facts do not list the agent.
- name: Restart Wazuh agent
  ansible.builtin.systemd_service:
    name: '{{ __wazuh_agent_service_name }}'
    state: restarted
  when:
    - wazuh_agent_service_enabled | bool
    - not (ansible_check_mode and ansible_facts.packages is defined
           and __wazuh_agent_package_name not in ansible_facts.packages)
