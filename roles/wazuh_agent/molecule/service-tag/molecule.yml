---
# Service sub-tag scenario. Runs the role in check mode with
# --tags wazuh-agent:service against a fresh instance, before the agent is
# installed: the run must gather the package facts it needs to skip the
# missing unit. The tags are passed as an ansible-playbook argument, the
# only way the sub-tag filter reaches the role; molecule adds it to the
# prepare step too, so prepare.yml tags its play always.
driver:
  name: podman
platforms:
  - name: wazuh-agent-service-tag-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-agent-service-tag-debian-trixie
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-agent-service-tag-rocky-9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
  - name: wazuh-agent-service-tag-rocky-10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  # The tag filter of the issue. Molecule passes these arguments to the
  # driver's create and destroy playbooks as well, whose tasks carry no
  # tags; 'untagged' keeps them running. Every task of the role is tagged,
  # so the role sees the same filter as on the command line.
  ansible_args:
    - '--tags'
    - 'wazuh-agent:service,untagged'
  inventory:
    host_vars:
      wazuh-agent-service-tag-archlinux:
        ansible_python_interpreter: /usr/bin/python
      wazuh-agent-service-tag-debian-trixie:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-agent-service-tag-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
      wazuh-agent-service-tag-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    # The sub-tag run in check mode is the test: it passes when the role
    # skips the service task on the instance without the agent
    - check
    - destroy
