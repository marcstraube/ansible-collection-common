---
- name: Converge — Service sub-tag
  hosts: all
  gather_facts: true

  vars:
    wazuh_agent_enabled: true
    # Nothing listens on loopback; the service task is skipped anyway
    wazuh_agent_managers:
      - address: '127.0.0.1'

  tasks:
    # Static import: --tags wazuh-agent:service (molecule.yml) must reach
    # the tasks of the role, which a dynamic include_role hides behind the
    # untagged include
    - name: Converge | Import wazuh_agent role  # noqa: role-name[path]
      ansible.builtin.import_role:
        name: '{{ playbook_dir }}/../..'
