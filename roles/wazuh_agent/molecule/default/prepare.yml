---
- name: Prepare
  hosts: all
  gather_facts: true

  vars:
    __prepare_packages:
      Archlinux:
        - base-devel
      Debian:
        - gnupg
        - ca-certificates
      RedHat: []

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Prepare | Install container dependencies
      ansible.builtin.package:
        name: '{{ __prepare_packages[ansible_facts["os_family"]] }}'
        state: present
      retries: 3
      delay: 5
      when: __prepare_packages[ansible_facts["os_family"]] | length > 0

    # The pacman ignore drop-in setup of marcstraube.common.package_management;
    # pacman fails on an Include glob without a match, so a file is in place
    # before the Include line
    - name: Prepare | Create pacman ignore drop-in directory (Arch)
      ansible.builtin.file:
        path: /etc/pacman.d/ignore.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Create pacman ignore drop-in (Arch)
      ansible.builtin.copy:
        content: "# molecule\n"
        dest: /etc/pacman.d/ignore.d/00-molecule.conf
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Include pacman ignore drop-ins (Arch)
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        line: 'Include = /etc/pacman.d/ignore.d/*.conf'
        insertafter: '^\[options\]'
        firstmatch: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Create aur_builder user for AUR packages (Arch)
      ansible.builtin.user:
        name: aur_builder
        group: wheel
        create_home: true
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Prepare | Allow aur_builder passwordless sudo (Arch)
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/99-aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        create: true
        owner: root
        group: root
        mode: '0440'
      when: ansible_facts['os_family'] == 'Archlinux'

    # The enrollment certificates the role consumes, issued by a local CA
    # through marcstraube.common.pki — the documented way to provide them.

    - name: Prepare | Issue test certificates
      ansible.builtin.include_role:
        name: marcstraube.common.pki
      vars:
        pki_enabled: true
        pki_system_config_enabled: false
        pki_ca_enabled: true
        pki_ca_organization: 'Wazuh Test'
        pki_ca_common_name: 'Wazuh Test Root CA'
        pki_ca_passphrase: ''
        pki_client_certs:
          - name: 'wazuh-agent'
            common_name: 'wazuh-agent-test'
