---
- name: Main | Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

# Empty on an installed system; the new system's mount point in installer mode.
- name: Main | Set path prefix
  ansible.builtin.set_fact:
    __storage_path_prefix: >-
      {{ storage_chroot_path | regex_replace('/$', '')
         if storage_installer_mode | bool else '' }}
  tags:
    - always

- name: Main | Import validate tasks
  ansible.builtin.import_tasks: validate.yml
  when: storage_enabled | bool
  tags:
    - always

- name: Main | Import install tasks
  ansible.builtin.import_tasks: install.yml
  when:
    - storage_enabled | bool
    - not storage_installer_mode | bool
  tags:
    - storage
    - storage:install

- name: Main | Include volume tasks
  ansible.builtin.include_tasks:
    file: volume.yml
    apply:
      tags:
        - storage
        - storage:volumes
  loop: '{{ storage_volumes }}'
  loop_control:
    loop_var: __storage_volume
    label: '{{ __storage_volume.name }}'
  when: storage_enabled | bool
  tags:
    - storage
    - storage:volumes

- name: Main | Import service tasks
  ansible.builtin.import_tasks: service.yml
  when:
    - storage_enabled | bool
    - not storage_installer_mode | bool
  tags:
    - storage
    - storage:service
