---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    __converge_disk_dir: '/var/lib/molecule-storage'
    __converge_chroot: '/mnt/molecule/chroot'
    __converge_passphrase: 'molecule-test-passphrase'  # pragma: allowlist secret
    __converge_snapper_sysconfig:
      Archlinux: '/etc/conf.d/snapper'
      Debian: '/etc/default/snapper'

    storage_ntfs_enabled: true
    storage_exfat_enabled: true
    storage_lvm_enabled: true

  pre_tasks:
    - name: Converge | Look up test disks
      ansible.builtin.command:
        cmd: >-
          losetup --noheadings --output NAME
          --associated {{ __converge_disk_dir }}/{{ item }}.img
      register: __converge_loops
      loop:
        - 'luks-btrfs'
        - 'luks-lvm'
        - 'ext4-force'
        - 'installer'
      changed_when: false
      check_mode: false

    - name: Converge | Map test disks
      ansible.builtin.set_fact:
        __converge_disks: >-
          {{ dict(__converge_loops.results | map(attribute='item')
                  | zip(__converge_loops.results | map(attribute='stdout'))) }}

    # btrfs is not available on EL; the other layouts run everywhere.
    - name: Converge | Define test volumes
      ansible.builtin.set_fact:
        storage_volumes: >-
          {{ ([__converge_btrfs_volume]
              if ansible_facts['os_family'] != 'RedHat' else [])
             + [__converge_lvm_volume, __converge_ext4_volume] }}
      vars:
        __converge_btrfs_volume:
          name: 'mbtrfs'
          device: '{{ __converge_disks["luks-btrfs"] }}'
          format: true
          luks:
            enabled: true
            passphrase: '{{ __converge_passphrase }}'
          layout: 'btrfs'
          mount_options: 'compress-force=zstd:3,nodev,nosuid'
          subvolumes:
            - name: '@/data'
              path: '/mnt/molecule/data'
              owner: 'vagrant'
              group: 'vagrant'
              mode: '0750'
              snapper: true
              snapper_settings:
                TIMELINE_LIMIT_DAILY: '14'
            - name: '@/cache'
              path: '/mnt/molecule/cache'
              mount_options: 'noexec'
        __converge_lvm_volume:
          name: 'mlvm'
          device: '{{ __converge_disks["luks-lvm"] }}'
          format: true
          luks:
            enabled: true
            passphrase: '{{ __converge_passphrase }}'
            options: 'luks,discard'
          layout: 'lvm'
          mount_options: 'nodev,nosuid'
          logical_volumes:
            - name: 'restic'
              size: '300m'
              path: '/mnt/molecule/restic'
              owner: 'root'
              group: 'root'
              mode: '0700'
            - name: 'archive'
              size: '100%FREE'
              path: '/mnt/molecule/archive'
        __converge_ext4_volume:
          name: 'mext4'
          device: '{{ __converge_disks["ext4-force"] }}'
          format: true
          force: true
          layout: 'ext4'
          path: '/mnt/molecule/scratch'
          mode: '1777'

  tasks:
    - name: Converge | Include storage role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'

    #
    # Kept volume after a reinstall
    #
    # The system lost the snapper config and the keyfile while the subvolume
    # keeps its .snapshots and the container its keyslots; the role must
    # register the config again and re-enroll the keyfile in the same slot.
    #

    # The marker keeps the simulation out of the idempotence run.
    - name: Converge | Check the reinstall marker
      ansible.builtin.stat:
        path: '{{ __converge_disk_dir }}/.reinstall-simulated'
      register: __converge_reinstall_marker

    - name: Converge | Simulate a reinstall without the snapper config and the keyfile
      when:
        - ansible_facts['os_family'] != 'RedHat'
        - not __converge_reinstall_marker.stat.exists
      block:
        - name: Converge | Remove the snapper config
          ansible.builtin.file:
            path: /etc/snapper/configs/mnt_molecule_data
            state: absent

        - name: Converge | Unregister the snapper config
          ansible.builtin.replace:
            path: '{{ __converge_snapper_sysconfig[ansible_facts["os_family"]] }}'
            regexp: '^SNAPPER_CONFIGS=.*$'
            replace: 'SNAPPER_CONFIGS=""'

        - name: Converge | Remove the keyfile
          ansible.builtin.file:
            path: /etc/cryptsetup-keys.d/crypt_mbtrfs.key
            state: absent

        - name: Converge | Include storage role again  # noqa: role-name[path]
          ansible.builtin.include_role:
            name: '{{ playbook_dir }}/../..'

        - name: Converge | Set the reinstall marker
          ansible.builtin.file:
            path: '{{ __converge_disk_dir }}/.reinstall-simulated'
            state: touch
            owner: root
            group: root
            mode: '0644'

    #
    # Installer Mode
    #
    # A directory stands in for the new system an installer has mounted.
    #

    - name: Converge | Create chroot directory
      ansible.builtin.file:
        path: '{{ __converge_chroot }}/etc'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Converge | Include storage role in installer mode  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
      vars:
        storage_installer_mode: true
        storage_chroot_path: '{{ __converge_chroot }}'
        storage_volumes:
          - name: 'minst'
            device: '{{ __converge_disks["installer"] }}'
            format: true
            luks:
              enabled: true
              passphrase: '{{ __converge_passphrase }}'
            layout: 'ext4'
            path: '/srv/inst'
            mode: '0750'

    - name: Converge | Assert the installer package list
      ansible.builtin.assert:
        that:
          - "'cryptsetup' in storage_installer_packages"
          - "'e2fsprogs' in storage_installer_packages"
          - "'parted' in storage_installer_packages"
        quiet: true
