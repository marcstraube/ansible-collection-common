---
#
# Role Control
#

# Enable the storage role
storage_enabled: true

#
# Volumes
#
# Additional disks set up end to end: partition, optional LUKS2, layout
# (btrfs subvolumes, LVM with ext4, or plain ext4), crypttab, fstab.

# Volumes to set up
storage_volumes: []
# Example:
#   - name: 'data'                      # [a-z0-9_-]; derives partition label,
#                                       # LUKS mapper name and VG name
#     device: '/dev/disk/by-id/nvme-Example_SSD_1TB_SERIAL'
#     format: true                      # partition + format a blank device
#     force: false                      # with format: wipe existing signatures
#     luks:
#       enabled: true
#       passphrase: '{{ vault_storage_data_passphrase }}'
#       name: 'crypt_data'              # optional mapper name
#       options: 'luks,discard'         # optional crypttab options
#     layout: 'btrfs'                   # btrfs | lvm | ext4
#     mount_options: 'compress-force=zstd:3,ssd,nodev,nosuid'
#     subvolumes:                       # layout btrfs
#       - name: '@/data'
#         path: '/data'
#         owner: 'johndoe'
#         group: 'johndoe'
#         mode: '0750'
#         mount_options: 'noexec'       # optional, appended
#         snapper: true
#         snapper_config: 'data'        # optional, default derived from path
#         snapper_settings:             # optional, merged over defaults
#           TIMELINE_LIMIT_DAILY: '14'
#
#   - name: 'backup'
#     device: '/dev/disk/by-id/ata-Example_HDD_2TB_SERIAL'
#     format: true
#     luks:
#       enabled: true
#       passphrase: '{{ vault_storage_backup_passphrase }}'
#     layout: 'lvm'
#     vg_name: 'vg_backup'              # optional, default vg_<name>
#     mount_options: 'nodev,nosuid,noexec'
#     logical_volumes:                  # layout lvm, ext4 per logical volume
#       - name: 'restic'
#         size: '1T'
#         path: '/srv/backup/restic'
#         owner: 'root'
#         group: 'root'
#         mode: '0700'
#       - name: 'archive'
#         size: '100%FREE'
#         path: '/srv/backup/archive'
#
#   - name: 'scratch'
#     device: '/dev/disk/by-id/ata-Example_SSD_500GB_SERIAL'
#     format: true
#     layout: 'ext4'
#     path: '/scratch'                  # layout ext4
#     owner: 'root'
#     group: 'root'
#     mode: '1777'

#
# Installer Mode
#
# Set by an installer role that runs from a live medium with the new system
# mounted below `storage_chroot_path`. The role then writes crypttab and
# keyfiles into that tree and mounts the volumes below it; it leaves fstab
# to the installer's fstab generation and skips packages, snapper and
# systemd. The packages the new system needs are exported in the fact
# `storage_installer_packages` for the installer to install.

# Operate on a system mounted below storage_chroot_path
storage_installer_mode: false

# Mount point of the new system in installer mode
storage_chroot_path: '/mnt'

#
# Snapper
#
# Settings for the snapper configs of btrfs subvolumes with `snapper: true`.
# Keys are snapper config variables; a subvolume's `snapper_settings` are
# merged over these.

# Default snapper config settings
storage_snapper_settings:
  TIMELINE_CREATE: 'yes'
  TIMELINE_CLEANUP: 'yes'
  TIMELINE_LIMIT_HOURLY: '5'
  TIMELINE_LIMIT_DAILY: '7'
  TIMELINE_LIMIT_WEEKLY: '0'
  TIMELINE_LIMIT_MONTHLY: '0'
  TIMELINE_LIMIT_YEARLY: '0'
  NUMBER_CLEANUP: 'yes'
  NUMBER_LIMIT: '50'

#
# Filesystem Tools
#
# Tools for filesystems the role does not set up itself. The toggles only
# install; they never remove a package (lvm2 is part of the base system on
# EL, for example).

# NTFS tools (mkfs, fsck, labels); mounting uses the ntfs3 kernel driver
storage_ntfs_enabled: false

# exFAT tools (USB sticks, SD cards)
storage_exfat_enabled: false

# LVM tools without an lvm volume (installed anyway when a volume uses lvm)
storage_lvm_enabled: false
