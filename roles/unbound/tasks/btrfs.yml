---
# BTRFS NoCOW for write-heavy directories.
# Auto-detected: only runs on BTRFS filesystems.

- name: BTRFS | Check data directory filesystem type
  ansible.builtin.command:
    cmd: stat -f -c %T /var/lib/unbound
  register: __unbound_data_fstype
  changed_when: false
  check_mode: false
  failed_when: false

- name: BTRFS | Check NoCOW attribute on data directory
  ansible.builtin.command:
    cmd: lsattr -d /var/lib/unbound
  register: __unbound_lsattr
  changed_when: false
  check_mode: false
  failed_when: false
  when: __unbound_data_fstype.stdout | default('') == 'btrfs'

# Only sets the attribute; owner and mode stay with the task or package
# that creates the directory.
- name: BTRFS | Set NoCOW attribute on data directory  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: /var/lib/unbound
    state: directory
    attributes: '+C'
  when:
    - __unbound_data_fstype.stdout | default('') == 'btrfs'
    - "'C' not in (__unbound_lsattr.stdout | default(''))"
