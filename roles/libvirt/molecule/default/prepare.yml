---
- name: Prepare
  hosts: all
  gather_facts: true

  tasks:
    - name: Prepare | Update package cache (Arch)
      community.general.pacman:
        update_cache: true
        upgrade: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Archlinux'

    # A kernel upgrade removes the modules of the running kernel; the default
    # network loads bridge and nf_tables on demand, so boot the new kernel.
    - name: Prepare | Check modules of the running kernel
      ansible.builtin.stat:
        path: '/usr/lib/modules/{{ ansible_facts["kernel"] }}'
      register: __prepare_kernel_modules

    - name: Prepare | Reboot into the upgraded kernel
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: not __prepare_kernel_modules.stat.exists

    - name: Prepare | Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Update package cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      retries: 3
      delay: 5
      when: ansible_facts['os_family'] == 'RedHat'
