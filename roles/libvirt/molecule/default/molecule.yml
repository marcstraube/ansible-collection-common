---
# Vagrant-based: the default NAT network needs a bridge, dnsmasq and kernel
# firewall tables, and the daemons need a full systemd host.

driver:
  name: default
  options:
    managed: false
    login_cmd_template: bash -c 'cd ${MOLECULE_EPHEMERAL_DIRECTORY} && vagrant ssh {instance}'

platforms:
  - name: libvirt-archlinux
    groups:
      - test_hosts
  - name: libvirt-debian-trixie
    groups:
      - test_hosts
  - name: libvirt-rocky-9
    groups:
      - test_hosts
  - name: libvirt-rocky-10
    groups:
      - test_hosts

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
      stdout_callback: default
      result_format: yaml
      inject_facts_as_vars: false
      allow_broken_conditionals: true
  inventory:
    host_vars:
      libvirt-archlinux:
        ansible_python_interpreter: /usr/bin/python
        ansible_port: 2222
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY')
          }}/.vagrant/machines/libvirt-archlinux/virtualbox/private_key
      libvirt-debian-trixie:
        ansible_port: 2223
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY')
          }}/.vagrant/machines/libvirt-debian-trixie/virtualbox/private_key
      libvirt-rocky-9:
        ansible_python_interpreter: /usr/bin/python3
        ansible_port: 2224
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY')
          }}/.vagrant/machines/libvirt-rocky-9/virtualbox/private_key
      libvirt-rocky-10:
        ansible_python_interpreter: /usr/bin/python3
        ansible_port: 2225
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY')
          }}/.vagrant/machines/libvirt-rocky-10/virtualbox/private_key
    group_vars:
      test_hosts:
        ansible_connection: ssh
        ansible_user: vagrant
        ansible_become: true
        ansible_host: 127.0.0.1
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - verify
    - destroy
