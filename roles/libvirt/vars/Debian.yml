---
# dnsmasq-base ships the binary without a system dnsmasq service. The network
# driver pulls in a firewall backend (iptables or nftables) as a dependency.
__libvirt_packages:
  - 'libvirt-daemon-system'
  - 'libvirt-clients'
  - 'qemu-system-x86'
  - 'dnsmasq-base'

# Monolithic daemon
__libvirt_daemons:
  - 'libvirtd'
