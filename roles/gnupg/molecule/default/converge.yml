---
- name: Converge | Managed mode
  hosts: all
  gather_facts: true

  vars:
    gnupg_enabled: true
    gnupg_gui_enabled: false
    gnupg_tools_enabled: false
    gnupg_agent_ssh_enabled: true
    gnupg_agent_allow_preset_passphrase: true
    gnupg_no_greeting: true
    gnupg_throw_keyids: false
    gnupg_dirmngr_resolver_timeout: 15
    gnupg_users:
      - username: root
        mode: 'managed'
        agent_ssh: false
      - username: testuser
        mode: 'managed'
        agent_ssh: true
      - username: disableduser
        mode: 'disabled'
        agent_ssh: false
      - username: socklessuser
        mode: 'managed'
        agent_ssh: true
        ssh_auth_sock: false

  pre_tasks:
    - name: Converge | Create test user
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true

    - name: Converge | Create SSH-without-export test user
      ansible.builtin.user:
        name: socklessuser
        state: present
        create_home: true

    - name: Converge | Ensure socklessuser environment.d directory
      ansible.builtin.file:
        path: /home/socklessuser/.config/environment.d
        state: directory
        owner: socklessuser
        group: socklessuser
        mode: '0755'

    - name: Converge | Pre-seed stale SSH_AUTH_SOCK export to prove removal
      ansible.builtin.copy:
        content: |
          SSH_AUTH_SOCK=/run/user/0/gnupg/S.gpg-agent.ssh
        dest: /home/socklessuser/.config/environment.d/50-gpg-ssh.conf
        owner: socklessuser
        group: socklessuser
        mode: '0644'
      # Re-seeding on the idempotence run would report a change.
      tags:
        - molecule-idempotence-notest

    - name: Converge | Create disabled test user
      ansible.builtin.user:
        name: disableduser
        state: present
        create_home: true

  tasks:
    - name: Converge | Include gnupg role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


- name: Converge | Initial mode (per-user gating)
  hosts: all
  gather_facts: false

  vars:
    gnupg_enabled: true
    gnupg_gui_enabled: false
    gnupg_tools_enabled: false
    gnupg_agent_ssh_enabled: false
    gnupg_user_config_mode: 'initial'
    gnupg_users:
      - username: 'initialnewuser'
        agent_ssh: false
      - username: 'initialexistuser'
        agent_ssh: false

  pre_tasks:
    - name: Converge | Create initial-mode users
      ansible.builtin.user:
        name: '{{ item }}'
        state: present
        create_home: true
      loop:
        - initialnewuser
        - initialexistuser

    - name: Converge | Ensure existing user .gnupg directory
      ansible.builtin.file:
        path: /home/initialexistuser/.gnupg
        state: directory
        owner: initialexistuser
        group: initialexistuser
        mode: '0700'

    - name: Converge | Pre-seed existing user gpg.conf to prove it is left untouched
      ansible.builtin.copy:
        content: |
          # molecule-fixture: pre-existing user content
          trust-model classic
        dest: /home/initialexistuser/.gnupg/gpg.conf
        owner: initialexistuser
        group: initialexistuser
        mode: '0600'


  tasks:
    - name: Converge | Include gnupg role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'


- name: Converge | Disabled mode (global)
  hosts: all
  gather_facts: false

  vars:
    gnupg_enabled: true
    gnupg_gui_enabled: false
    gnupg_tools_enabled: false
    gnupg_agent_ssh_enabled: true
    gnupg_user_config_mode: 'disabled'
    gnupg_users:
      - username: 'globaldisableduser'
        agent_ssh: true

  pre_tasks:
    - name: Converge | Create global-disabled-mode user
      ansible.builtin.user:
        name: globaldisableduser
        state: present
        create_home: true


  tasks:
    - name: Converge | Include gnupg role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
