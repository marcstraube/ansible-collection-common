---
- name: Converge
  hosts: all
  gather_facts: true

  vars:
    # Mirror the role default so the post-include simulation task can
    # reference it (include_role defaults are not exposed to the play).
    paru_clone_dir: '/var/cache/paru/clone'
    __pm_conversion_marker: '/var/tmp/molecule-paru-perms-converted'

  tasks:
    # The first converge converts the tree that prepare.yml left in the
    # state of the shared group; the idempotence run finds the marker
    - name: Converge | Check for the conversion marker
      ansible.builtin.stat:
        path: '{{ __pm_conversion_marker }}'
      register: __pm_conversion_marker_stat

    - name: Converge | Run paru configuration tasks  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: archlinux/paru.yml

    - name: Converge | Assert the first run reported the conversion
      ansible.builtin.assert:
        that:
          - __package_management_clone_dir_foreign.stdout | length > 0
          - __package_management_clone_dir_recovered is changed
        fail_msg: >-
          The run did not report the conversion of the entries of the shared
          group in {{ paru_clone_dir }}.
      when: not __pm_conversion_marker_stat.stat.exists

    - name: Converge | Record the checked conversion
      ansible.builtin.copy:
        content: ''
        dest: '{{ __pm_conversion_marker }}'
        owner: root
        group: root
        mode: '0644'

    # Simulate the builder creating a fresh entry under the enforced 022
    # build umask (makepkg.conf / sudoers runas-default in the full role).
    # runuser is used so the nologin system user can act without a
    # PAM/login shell. The `creates` guard keeps the idempotence run clean.
    - name: Converge | Simulate aur_builder creating a build dir
      ansible.builtin.command:
        cmd: >-
          runuser -u aur_builder -- bash -c
          'umask 0022; mkdir -p {{ paru_clone_dir }}/testpkg;
          echo x > {{ paru_clone_dir }}/testpkg/PKGBUILD'
        creates: '{{ paru_clone_dir }}/testpkg/PKGBUILD'

    # pkgfile is not installed in the image; disabling it must not fail on
    # the missing timer unit
    - name: Converge | Run the tools tasks with pkgfile disabled  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: archlinux/tools.yml
      vars:
        pacman_pkgfile_enabled: false
        pacman_rebuild_detector_enabled: false
        pacman_informant_enabled: false
