---
# Focused scenario for the shared paru clone-directory permission model
# (SGID + builder ownership, no ACLs — issue #286). Runs only
# tasks/archlinux/paru.yml (not the AUR helper build) on Arch, then
# asserts that legacy default ACLs are stripped, foreign-owned entries
# are adopted by the builder, and new entries inherit aur_shared group
# access through the SGID bit.
driver:
  name: podman
platforms:
  - name: package-management-paru-perms-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      package-management-paru-perms-archlinux:
        ansible_python_interpreter: /usr/bin/python
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
