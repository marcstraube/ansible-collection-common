---
# Focused scenario for the shared paru clone-directory permission model
# (aur_builder:aur_builder 0755 without SGID, no ACLs — issues #286, #604).
# Runs only tasks/archlinux/paru.yml (not the AUR helper build) on Arch,
# then asserts that legacy default ACLs are stripped, foreign-owned entries
# are adopted by the builder, a tree of the former aur_shared group is
# converted with a reported change, and a wheel login user cannot write to
# the clone directory.
driver:
  name: podman
platforms:
  - name: package-management-paru-perms-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      package-management-paru-perms-archlinux:
        ansible_python_interpreter: /usr/bin/python
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
