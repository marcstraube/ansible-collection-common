---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    paru_clone_dir: '/var/cache/paru/clone'

  tasks:
    - name: Verify | Read ACL of the shared clone directory
      ansible.builtin.command:
        cmd: 'getfacl -p {{ paru_clone_dir }}'
      register: __pm_clone_acl
      changed_when: false

    - name: Verify | Assert no default ACLs remain on the clone tree
      ansible.builtin.assert:
        that:
          - "'default:' not in __pm_clone_acl.stdout"
        fail_msg: >-
          Default ACLs present on the shared clone directory — they make
          libarchive/bsdtar skip its final chmod during source extraction
          and broken modes end up inside built packages.

    - name: Verify | Stat the shared clone directory
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}'
      register: __pm_clone_stat

    - name: Verify | Assert builder ownership and SGID mode
      ansible.builtin.assert:
        that:
          - __pm_clone_stat.stat.pw_name == 'aur_builder'
          - __pm_clone_stat.stat.gr_name == 'aur_shared'
          - __pm_clone_stat.stat.mode == '2775'
        fail_msg: 'Clone directory is not aur_builder:aur_shared with mode 2775'

    - name: Verify | Stat the legacy entry
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/legacypkg/PKGBUILD'
      register: __pm_legacy_stat

    - name: Verify | Assert the legacy root-owned entry was adopted
      ansible.builtin.assert:
        that:
          - __pm_legacy_stat.stat.pw_name == 'aur_builder'
          - __pm_legacy_stat.stat.gr_name == 'aur_shared'
        fail_msg: 'Legacy clone entry was not adopted by the builder'

    - name: Verify | Stat the legacy directory
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/legacypkg'
      register: __pm_legacy_dir_stat

    - name: Verify | Assert the legacy 0700 directory was made group-readable
      ansible.builtin.assert:
        that:
          - __pm_legacy_dir_stat.stat.rgrp
          - __pm_legacy_dir_stat.stat.xgrp
        fail_msg: >-
          Legacy directory kept its restrictive 0700 mode — chown alone does
          not repair modes, so the aur_shared group stays locked out.

    - name: Verify | Stat the builder-created entry
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/testpkg'
      register: __pm_testpkg_stat

    - name: Verify | Assert SGID group inheritance and group access
      ansible.builtin.assert:
        that:
          - __pm_testpkg_stat.stat.gr_name == 'aur_shared'
          - __pm_testpkg_stat.stat.rgrp
          - __pm_testpkg_stat.stat.xgrp
        fail_msg: >-
          Builder-created entry did not inherit aur_shared group access
          through the SGID bit under the enforced 022 umask.

    - name: Verify | Stat the manual-invocation wrapper
      ansible.builtin.stat:
        path: /usr/local/bin/paru
      register: __pm_wrapper_stat

    - name: Verify | Read the wrapper contents
      ansible.builtin.slurp:
        src: /usr/local/bin/paru
      register: __pm_wrapper_content

    - name: Verify | Assert the wrapper re-executes paru as the builder user
      ansible.builtin.assert:
        that:
          - __pm_wrapper_stat.stat.exists
          - __pm_wrapper_stat.stat.executable
          - "'sudo -u aur_builder' in (__pm_wrapper_content.content | b64decode)"
          - "'/usr/bin/paru' in (__pm_wrapper_content.content | b64decode)"
        fail_msg: >-
          /usr/local/bin/paru wrapper is missing, not executable, or does not
          re-execute /usr/bin/paru as the aur_builder user.

    # The wrapper shadows /usr/bin/paru in PATH, so automation running the
    # helper as the builder user reaches the wrapper too. Without the re-entry
    # guard it would sudo a second time and be refused: the builder holds no
    # sudoers rule for paru. Tracing the wrapper shows which branch is taken.
    - name: Verify | Trace the wrapper invoked as the builder user
      ansible.builtin.command:
        cmd: 'runuser -u aur_builder -- sh -x /usr/local/bin/paru --version'
      register: __pm_wrapper_trace
      changed_when: false
      failed_when: false

    - name: Verify | Assert the traced wrapper execs the helper without sudo
      vars:
        __pm_trace: >-
          {{ __pm_wrapper_trace.stdout | default('')
             ~ __pm_wrapper_trace.stderr | default('') }}
      ansible.builtin.assert:
        that:
          - "'exec sudo' not in __pm_trace"
          - "'/usr/bin/paru --version' in __pm_trace"
        fail_msg: >-
          Traced as aur_builder, the wrapper still routed through sudo instead
          of exec'ing the helper directly. Trace was: {{ __pm_trace }}

    #
    # Local PKGBUILD builds (issue #609)
    #

    # The wrapper picks its route from the operation flag. A copy with every
    # exec turned into an echo prints the command a call would run, without
    # running it; the first line is the route taken.
    - name: Verify | Write a routing stub of the wrapper
      ansible.builtin.copy:
        content: "{{ __pm_wrapper_content.content | b64decode | replace('exec ', 'echo ') }}"
        dest: /tmp/pm-paru-route
        owner: root
        group: root
        mode: '0755'

    - name: Verify | Run the routing stub for each flag form
      ansible.builtin.command:
        argv: >-
          {{ (['env'] if item.route == 'root' else
               ['runuser', '-u', 'localuser', '--', 'env', 'HOME=/home/localuser'])
             + item.env | default([])
             + ['sh', '/tmp/pm-paru-route'] + item.args }}
      register: __pm_routes
      changed_when: false
      loop:
        - {args: ['-B', '.'], route: caller}
        - {args: ['-Bi', '.'], route: caller}
        - {args: ['-U'], route: caller}
        - {args: ['-Ui'], route: caller}
        - {args: ['-iU'], route: caller}
        - {args: ['--upgrade'], route: caller}
        - {args: ['--build', '.'], route: caller}
        - {args: ['--noconfirm', '-B', '.'], route: caller}
        - {args: ['--chroot', '-Ui'], route: caller}
        - {args: ['-U', './pm-localtest-1-1-any.pkg.tar.zst'], route: caller}
        - {args: ['-G', 'foo'], route: caller}
        - {args: ['--getpkgbuild', 'foo'], route: caller}
        - {args: ['-Gp', 'foo'], route: caller}
        - {args: ['-Syu'], route: builder}
        - {args: [], route: builder}
        - {args: ['-S', 'foo'], route: builder}
        - {args: ['-Qu'], route: builder}
        - {args: ['-Sc'], route: builder}
        - {args: ['--sync', 'foo'], route: builder}
        - {args: ['--version'], route: builder}
        - {args: ['--noconfirm', '-Syu'], route: builder}
        - {args: ['-Q', '--', '-U'], route: builder}
        - {args: ['-Q', '--', '-G'], route: builder}
        - {args: ['-SN', 'foo'], route: builder}
        - {args: ['-B', '.'], route: root}
        - {args: ['-Ui'], route: root}
        - {args: ['-B', '.'], env: ['XDG_CACHE_HOME=/home/localuser/xdg'], route: xdg}
      loop_control:
        label: '{{ item.route }}: {{ item.args | join(" ") }}'

    - name: Verify | Assert each call takes the expected route
      vars:
        __pm_prefix:
          caller: '/usr/bin/paru --clonedir /home/localuser/.cache/paru/clone --nocleanafter'
          xdg: '/usr/bin/paru --clonedir /home/localuser/xdg/paru/clone --nocleanafter'
          builder: 'sudo -u aur_builder -H /usr/bin/paru'
          root: 'sudo -u aur_builder -H /usr/bin/paru'
        __pm_expected: >-
          {{ ([__pm_prefix[item.item.route]] + item.item.args) | join(' ') }}
      ansible.builtin.assert:
        that:
          - item.stdout_lines[0] == __pm_expected
        fail_msg: >-
          {{ item.item.args | join(' ') }} as {{ item.item.route }} ran
          "{{ item.stdout_lines[0] | default('') }}", expected
          "{{ __pm_expected }}".
      loop: '{{ __pm_routes.results }}'
      loop_control:
        label: '{{ item.item.route }}: {{ item.item.args | join(" ") }}'

    # An untracked file in the caller's checkout must survive the build:
    # the CleanAfter of /etc/paru.conf would delete it, the built package
    # included, unless the wrapper passes --nocleanafter.
    - name: Verify | Put an untracked file into the login user's checkout
      ansible.builtin.copy:
        content: 'keep me'
        dest: /home/localuser/localpkg/untracked-keep
        owner: localuser
        group: localuser
        mode: '0644'

    # The real build: the PKGBUILD lies in a mode 0700 home the builder cannot
    # read, so routing it through the builder fails with EACCES.
    - name: Verify | Build the local PKGBUILD as the login user
      become: true
      become_user: localuser
      ansible.builtin.command:
        argv: ['/usr/local/bin/paru', '-B', '--noconfirm', '--skipreview', '.']
        chdir: /home/localuser/localpkg
      changed_when: false

    - name: Verify | Stat the package built by the login user
      ansible.builtin.stat:
        path: /home/localuser/localpkg/pm-localtest-1-1-any.pkg.tar.zst
      register: __pm_user_pkg

    - name: Verify | Stat the untracked file in the login user's checkout
      ansible.builtin.stat:
        path: /home/localuser/localpkg/untracked-keep
      register: __pm_user_untracked

    - name: Verify | Assert the login user built the package as themself
      ansible.builtin.assert:
        that:
          - __pm_user_pkg.stat.exists
          - __pm_user_pkg.stat.pw_name == 'localuser'
          - __pm_user_untracked.stat.exists
        fail_msg: >-
          paru -B in the 0700 home did not leave a package owned by localuser
          next to the untracked file: package {{ __pm_user_pkg.stat }},
          untracked file present {{ __pm_user_untracked.stat.exists }}

    # makepkg refuses root, so a working build as root proves the wrapper
    # still hands root's local builds to the builder. That route keeps the
    # CleanAfter of /etc/paru.conf, so --nocleanafter keeps the package.
    - name: Verify | Build the local PKGBUILD as root
      ansible.builtin.command:
        argv: ['/usr/local/bin/paru', '-B', '--noconfirm', '--skipreview', '--nocleanafter', '.']
        chdir: /var/cache/aur_builder/rootpkg
      changed_when: false

    - name: Verify | Stat the package built for root
      ansible.builtin.stat:
        path: /var/cache/aur_builder/rootpkg/pm-localtest-1-1-any.pkg.tar.zst
      register: __pm_root_pkg

    - name: Verify | Assert root's build ran as the builder
      ansible.builtin.assert:
        that:
          - __pm_root_pkg.stat.exists
          - __pm_root_pkg.stat.pw_name == 'aur_builder'
        fail_msg: >-
          paru -B as root did not leave a package owned by aur_builder:
          {{ __pm_root_pkg.stat }}

    # -G clones the PKGBUILD repository into the current directory, which the
    # builder cannot write inside the 0700 home.
    - name: Verify | Fetch a PKGBUILD as the login user
      become: true
      become_user: localuser
      ansible.builtin.command:
        argv: ['/usr/local/bin/paru', '-G', 'paru-bin']
        chdir: /home/localuser
        creates: /home/localuser/paru-bin/PKGBUILD
      retries: 5
      delay: 10

    - name: Verify | Stat the fetched PKGBUILD
      ansible.builtin.stat:
        path: /home/localuser/paru-bin/PKGBUILD
      register: __pm_user_getpkgbuild

    - name: Verify | Assert the login user fetched the PKGBUILD as themself
      ansible.builtin.assert:
        that:
          - __pm_user_getpkgbuild.stat.exists
          - __pm_user_getpkgbuild.stat.pw_name == 'localuser'
        fail_msg: >-
          paru -G in the 0700 home did not leave a PKGBUILD owned by localuser:
          {{ __pm_user_getpkgbuild.stat }}

    - name: Verify | Find shared clone entries owned by the login user
      ansible.builtin.command:
        argv: ['find', '{{ paru_clone_dir }}', '-user', 'localuser']
      register: __pm_user_entries
      changed_when: false

    - name: Verify | Assert the shared clone tree gained no login user entries
      ansible.builtin.assert:
        that:
          - __pm_user_entries.stdout_lines | length == 0
        fail_msg: >-
          The local build left entries owned by localuser in the shared clone
          tree: {{ __pm_user_entries.stdout_lines }}

    - name: Verify | Validate the builder sudoers file
      ansible.builtin.command:
        cmd: 'visudo -cf /etc/sudoers.d/99-role-package_management'
      changed_when: false

    - name: Verify | Read the builder sudoers file
      ansible.builtin.slurp:
        src: /etc/sudoers.d/99-role-package_management
      register: __pm_sudoers_content

    - name: Verify | Assert the wheel-to-builder paru rule is present
      ansible.builtin.assert:
        that:
          - "'%wheel ALL=(aur_builder) /usr/bin/paru' in (__pm_sudoers_content.content | b64decode)"
        fail_msg: 'The wheel-to-aur_builder paru sudoers rule is missing.'

    - name: Verify | Check pkgfile is not installed
      ansible.builtin.command:
        argv:
          - pacman
          - -Q
          - pkgfile
      register: __pm_pkgfile_query
      changed_when: false
      # pacman -Q exits 1 when the package is missing
      failed_when: __pm_pkgfile_query.rc not in [0, 1]

    - name: Verify | Assert pkgfile stayed absent
      ansible.builtin.assert:
        that:
          - __pm_pkgfile_query.rc == 1
        fail_msg: 'pkgfile is installed: {{ __pm_pkgfile_query.stdout }}'
