---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    paru_clone_dir: '/var/cache/paru/clone'

  tasks:
    - name: Verify | Read ACL of the shared clone directory
      ansible.builtin.command:
        cmd: 'getfacl -p {{ paru_clone_dir }}'
      register: __pm_clone_acl
      changed_when: false

    - name: Verify | Assert no default ACLs remain on the clone tree
      ansible.builtin.assert:
        that:
          - "'default:' not in __pm_clone_acl.stdout"
        fail_msg: >-
          Default ACLs present on the shared clone directory — they make
          libarchive/bsdtar skip its final chmod during source extraction
          and broken modes end up inside built packages.

    - name: Verify | Stat the shared clone directory
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}'
      register: __pm_clone_stat

    - name: Verify | Assert builder ownership and mode 0755
      ansible.builtin.assert:
        that:
          - __pm_clone_stat.stat.pw_name == 'aur_builder'
          - __pm_clone_stat.stat.gr_name == 'aur_builder'
          - __pm_clone_stat.stat.mode == '0755'
        fail_msg: >-
          Clone directory is {{ __pm_clone_stat.stat.pw_name }}:{{ __pm_clone_stat.stat.gr_name }}
          {{ __pm_clone_stat.stat.mode }}, expected aur_builder:aur_builder 0755
          without the SGID bit.

    - name: Verify | Stat the clone entries
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/{{ item }}'
      loop:
        - legacypkg
        - legacypkg/PKGBUILD
        - sharedpkg
        - sharedpkg/PKGBUILD
        - testpkg
        - testpkg/PKGBUILD
      register: __pm_entry_stats

    # legacypkg was root-owned with mode 0700, sharedpkg belonged to the
    # shared group with the SGID bit and a group-writable PKGBUILD, testpkg
    # was created by the builder after the conversion
    - name: Verify | Assert the clone entries belong to the builder and are readable
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == 'aur_builder'
          - item.stat.gr_name == 'aur_builder'
          - item.stat.rgrp and item.stat.roth
          - not item.stat.isdir or (item.stat.xgrp and item.stat.xoth)
          - not item.stat.wgrp
          - not item.stat.isgid
        fail_msg: >-
          {{ item.item }} is {{ item.stat.pw_name }}:{{ item.stat.gr_name }}
          {{ item.stat.mode }}, expected aur_builder:aur_builder, readable by
          group and others, without group write access and the SGID bit.
      loop: '{{ __pm_entry_stats.results }}'
      loop_control:
        label: '{{ item.item }}'

    # molecule_login is a wheel member and still in the former shared group
    - name: Verify | Try to create an entry in the clone directory as a login user
      ansible.builtin.command:
        cmd: 'runuser -u molecule_login -- touch {{ paru_clone_dir }}/molecule-intruder'
      register: __pm_login_write
      changed_when: false
      failed_when: false

    - name: Verify | Assert the login user cannot write to the clone directory
      ansible.builtin.assert:
        that:
          - __pm_login_write.rc != 0
        fail_msg: 'The wheel login user created an entry in {{ paru_clone_dir }}.'

    # Check mode with a clone directory that does not exist yet (a new host
    # or a changed paru_clone_dir): the checks of the tree must skip instead
    # of failing on the missing path
    - name: Verify | Run paru configuration tasks in check mode with a new clone directory  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: '{{ playbook_dir }}/../..'
        tasks_from: archlinux/paru.yml
        apply:
          check_mode: true
      vars:
        paru_clone_dir: '/var/cache/paru/molecule-new-clone'

    - name: Verify | Stat the new clone directory
      ansible.builtin.stat:
        path: '/var/cache/paru/molecule-new-clone'
      register: __pm_new_clone_stat

    - name: Verify | Assert check mode skipped the checks and created nothing
      ansible.builtin.assert:
        that:
          - not __pm_new_clone_stat.stat.exists
          - __package_management_clone_dir_foreign is skipped
        fail_msg: >-
          Check mode created the new clone directory or ran find on it.

    - name: Verify | Stat the manual-invocation wrapper
      ansible.builtin.stat:
        path: /usr/local/bin/paru
      register: __pm_wrapper_stat

    - name: Verify | Read the wrapper contents
      ansible.builtin.slurp:
        src: /usr/local/bin/paru
      register: __pm_wrapper_content

    - name: Verify | Assert the wrapper re-executes paru as the builder user
      ansible.builtin.assert:
        that:
          - __pm_wrapper_stat.stat.exists
          - __pm_wrapper_stat.stat.executable
          - "'sudo -u aur_builder' in (__pm_wrapper_content.content | b64decode)"
          - "'/usr/bin/paru' in (__pm_wrapper_content.content | b64decode)"
        fail_msg: >-
          /usr/local/bin/paru wrapper is missing, not executable, or does not
          re-execute /usr/bin/paru as the aur_builder user.

    # The wrapper shadows /usr/bin/paru in PATH, so automation running the
    # helper as the builder user reaches the wrapper too. Without the re-entry
    # guard it would sudo a second time and be refused: the builder holds no
    # sudoers rule for paru. Tracing the wrapper shows which branch is taken
    # without needing the helper installed, which it is not in a container.
    - name: Verify | Trace the wrapper invoked as the builder user
      ansible.builtin.command:
        cmd: 'runuser -u aur_builder -- sh -x /usr/local/bin/paru --version'
      register: __pm_wrapper_trace
      changed_when: false
      failed_when: false

    - name: Verify | Assert the traced wrapper execs the helper without sudo
      vars:
        __pm_trace: >-
          {{ __pm_wrapper_trace.stdout | default('')
             ~ __pm_wrapper_trace.stderr | default('') }}
      ansible.builtin.assert:
        that:
          - "'exec sudo' not in __pm_trace"
          - "'/usr/bin/paru --version' in __pm_trace"
        fail_msg: >-
          Traced as aur_builder, the wrapper still routed through sudo instead
          of exec'ing the helper directly. Trace was: {{ __pm_trace }}

    - name: Verify | Validate the builder sudoers file
      ansible.builtin.command:
        cmd: 'visudo -cf /etc/sudoers.d/99-role-package_management'
      changed_when: false

    - name: Verify | Read the builder sudoers file
      ansible.builtin.slurp:
        src: /etc/sudoers.d/99-role-package_management
      register: __pm_sudoers_content

    - name: Verify | Assert the wheel-to-builder paru rule is present
      ansible.builtin.assert:
        that:
          - "'%wheel ALL=(aur_builder) /usr/bin/paru' in (__pm_sudoers_content.content | b64decode)"
        fail_msg: 'The wheel-to-aur_builder paru sudoers rule is missing.'

    - name: Verify | Check pkgfile is not installed
      ansible.builtin.command:
        argv:
          - pacman
          - -Q
          - pkgfile
      register: __pm_pkgfile_query
      changed_when: false
      # pacman -Q exits 1 when the package is missing
      failed_when: __pm_pkgfile_query.rc not in [0, 1]

    - name: Verify | Assert pkgfile stayed absent
      ansible.builtin.assert:
        that:
          - __pm_pkgfile_query.rc == 1
        fail_msg: 'pkgfile is installed: {{ __pm_pkgfile_query.stdout }}'
