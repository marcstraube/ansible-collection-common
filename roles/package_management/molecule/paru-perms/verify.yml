---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    paru_clone_dir: '/var/cache/paru/clone'

  tasks:
    - name: Verify | Read ACL of the shared clone directory
      ansible.builtin.command:
        cmd: 'getfacl -p {{ paru_clone_dir }}'
      register: __pm_clone_acl
      changed_when: false

    - name: Verify | Assert no default ACLs remain on the clone tree
      ansible.builtin.assert:
        that:
          - "'default:' not in __pm_clone_acl.stdout"
        fail_msg: >-
          Default ACLs present on the shared clone directory — they make
          libarchive/bsdtar skip its final chmod during source extraction
          and broken modes end up inside built packages.

    - name: Verify | Stat the shared clone directory
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}'
      register: __pm_clone_stat

    - name: Verify | Assert builder ownership and SGID mode
      ansible.builtin.assert:
        that:
          - __pm_clone_stat.stat.pw_name == 'aur_builder'
          - __pm_clone_stat.stat.gr_name == 'aur_shared'
          - __pm_clone_stat.stat.mode == '2775'
        fail_msg: 'Clone directory is not aur_builder:aur_shared with mode 2775'

    - name: Verify | Stat the legacy entry
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/legacypkg/PKGBUILD'
      register: __pm_legacy_stat

    - name: Verify | Assert the legacy root-owned entry was adopted
      ansible.builtin.assert:
        that:
          - __pm_legacy_stat.stat.pw_name == 'aur_builder'
          - __pm_legacy_stat.stat.gr_name == 'aur_shared'
        fail_msg: 'Legacy clone entry was not adopted by the builder'

    - name: Verify | Stat the legacy directory
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/legacypkg'
      register: __pm_legacy_dir_stat

    - name: Verify | Assert the legacy 0700 directory was made group-readable
      ansible.builtin.assert:
        that:
          - __pm_legacy_dir_stat.stat.rgrp
          - __pm_legacy_dir_stat.stat.xgrp
        fail_msg: >-
          Legacy directory kept its restrictive 0700 mode — chown alone does
          not repair modes, so the aur_shared group stays locked out.

    - name: Verify | Stat the builder-created entry
      ansible.builtin.stat:
        path: '{{ paru_clone_dir }}/testpkg'
      register: __pm_testpkg_stat

    - name: Verify | Assert SGID group inheritance and group access
      ansible.builtin.assert:
        that:
          - __pm_testpkg_stat.stat.gr_name == 'aur_shared'
          - __pm_testpkg_stat.stat.rgrp
          - __pm_testpkg_stat.stat.xgrp
        fail_msg: >-
          Builder-created entry did not inherit aur_shared group access
          through the SGID bit under the enforced 022 umask.

    - name: Verify | Stat the manual-invocation wrapper
      ansible.builtin.stat:
        path: /usr/local/bin/paru
      register: __pm_wrapper_stat

    - name: Verify | Read the wrapper contents
      ansible.builtin.slurp:
        src: /usr/local/bin/paru
      register: __pm_wrapper_content

    - name: Verify | Assert the wrapper re-executes paru as the builder user
      ansible.builtin.assert:
        that:
          - __pm_wrapper_stat.stat.exists
          - __pm_wrapper_stat.stat.executable
          - "'sudo -u aur_builder' in (__pm_wrapper_content.content | b64decode)"
          - "'/usr/bin/paru' in (__pm_wrapper_content.content | b64decode)"
        fail_msg: >-
          /usr/local/bin/paru wrapper is missing, not executable, or does not
          re-execute /usr/bin/paru as the aur_builder user.

    # The wrapper shadows /usr/bin/paru in PATH, so automation running the
    # helper as the builder user reaches the wrapper too. Without the re-entry
    # guard it would sudo a second time and be refused: the builder holds no
    # sudoers rule for paru. Tracing the wrapper shows which branch is taken
    # without needing the helper installed, which it is not in a container.
    - name: Verify | Trace the wrapper invoked as the builder user
      ansible.builtin.command:
        cmd: 'runuser -u aur_builder -- sh -x /usr/local/bin/paru --version'
      register: __pm_wrapper_trace
      changed_when: false
      failed_when: false

    - name: Verify | Assert the traced wrapper execs the helper without sudo
      vars:
        __pm_trace: >-
          {{ __pm_wrapper_trace.stdout | default('')
             ~ __pm_wrapper_trace.stderr | default('') }}
      ansible.builtin.assert:
        that:
          - "'exec sudo' not in __pm_trace"
          - "'/usr/bin/paru --version' in __pm_trace"
        fail_msg: >-
          Traced as aur_builder, the wrapper still routed through sudo instead
          of exec'ing the helper directly. Trace was: {{ __pm_trace }}

    - name: Verify | Validate the builder sudoers file
      ansible.builtin.command:
        cmd: 'visudo -cf /etc/sudoers.d/99-role-package_management'
      changed_when: false

    - name: Verify | Read the builder sudoers file
      ansible.builtin.slurp:
        src: /etc/sudoers.d/99-role-package_management
      register: __pm_sudoers_content

    - name: Verify | Assert the wheel-to-builder paru rule is present
      ansible.builtin.assert:
        that:
          - "'%wheel ALL=(aur_builder) /usr/bin/paru' in (__pm_sudoers_content.content | b64decode)"
        fail_msg: 'The wheel-to-aur_builder paru sudoers rule is missing.'
