---
# Focused scenario for the yay side of the shared AUR build infrastructure
# (issue #229). Runs only tasks/archlinux/yay.yml (not the AUR helper
# build) on Arch, then asserts that the shared clone directory carries the
# same SGID/ownership model as the paru one, that buildDir reaches every
# account's config.json without discarding settings already in the file,
# and that the manual-invocation wrapper pins --builddir.
driver:
  name: podman
platforms:
  - name: package-management-yay-perms-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      package-management-yay-perms-archlinux:
        ansible_python_interpreter: /usr/bin/python
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
