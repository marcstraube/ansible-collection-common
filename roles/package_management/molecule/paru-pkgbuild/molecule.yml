---
# Focused scenario for paru PKGBUILD repositories (issue #592). Runs the
# whole role on Arch with aur_helper 'paru' and one 'url' repository (a
# local Git repository through file://, limited to a subdirectory) and one
# 'path' repository. Asserts the rendered paru.conf sections, the download
# of the URL repository, packages from both installed through the AUR
# builder, and the early failures for yay and invalid entries.
# side_effect points the url to a second, unrelated repository and converges
# again; the second idempotence run proves the replaced clone stays put.
driver:
  name: podman
platforms:
  - name: package-management-paru-pkgbuild-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    host_vars:
      package-management-paru-pkgbuild-archlinux:
        ansible_python_interpreter: /usr/bin/python
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - idempotence
    - verify
    - destroy
