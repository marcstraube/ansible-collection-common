---
# Ubuntu-only scenario. The role carries Ubuntu-specific paths that the
# Debian platform of the default scenario never reaches: apt_ppas is
# expanded from the ppa: shorthand and its signing key is resolved
# through the Launchpad API. Ubuntu is not a supported platform of this
# collection — this scenario exists to cover the code that targets it.
driver:
  name: podman
platforms:
  - name: package-management-ubuntu
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      package-management-ubuntu:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
