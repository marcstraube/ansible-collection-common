---
#
# Launchpad PPA endpoints (Ubuntu)
#
# deb822_repository has no 'ppa:' shorthand, so tasks/debian/repos.yml
# expands each entry of apt_ppas itself. The API serves the signing key
# fingerprint of a PPA, the content host serves its packages, and the
# keyserver serves the key that signed_by consumes.
#

__apt_keyring_dir: '/etc/apt/keyrings'  # noqa: var-naming[no-role-prefix]
__apt_ppa_api_url: 'https://api.launchpad.net/1.0'  # noqa: var-naming[no-role-prefix]
__apt_ppa_content_url: 'https://ppa.launchpadcontent.net'  # noqa: var-naming[no-role-prefix]
__apt_ppa_keyserver_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x'  # noqa: var-naming[no-role-prefix]

#
# sudoers drop-in (Arch Linux AUR builder)
#
# Named after the owning role (NN-role-<role>) so the sudo role's purge of
# sudoers.d leaves it in place. 99 keeps it last in the read order.
#

__package_management_sudoers_file: '/etc/sudoers.d/99-role-package_management'

#
# Proxy for repository release packages (RedHat)
#
# ansible.builtin.dnf downloads an RPM given by URL itself (Python urllib)
# before dnf runs, so the proxy in dnf.conf does not apply to it. The download
# only honors the *_proxy environment variables, which these tasks set from
# dnf_proxy.
#

__package_management_url_proxy_env: >-
  {{ {'https_proxy': dnf_proxy, 'http_proxy': dnf_proxy}
     if dnf_proxy | length > 0 else {} }}

#
# pacman IgnorePkg drop-ins (Arch Linux)
#
# pacman.conf includes every *.conf file in this directory, so other roles
# add packages to the ignore list without touching pacman.conf. pacman fails
# on an Include glob that matches no file; the base file keeps it matched.
#

__package_management_pacman_ignore_dir: '/etc/pacman.d/ignore.d'
__package_management_pacman_ignore_base_file: '00-package-management.conf'

#
# paru PKGBUILD repositories (Arch Linux)
#
# Keys a paru_pkgbuild_repositories entry may carry, and the section names
# paru reserves for its own use or rejects as repository names. A URL
# repository is cloned below <paru_clone_dir>/<subdir>/<name>. paru drops
# the default port of these schemes from a Url before it clones.
#

__package_management_pkgbuild_repo_keys:
  - 'name'
  - 'url'
  - 'path'
  - 'subdirectory'
  - 'depth'
  - 'skip_review'
  - 'generate_srcinfo'
__package_management_pkgbuild_repo_reserved_names:
  - 'options'
  - 'bin'
  - 'env'
  - 'local'
  - 'aur'
  - 'pkg'
  - 'base'
__package_management_pkgbuild_repo_clone_subdir: 'repo'
__package_management_pkgbuild_repo_default_ports:
  https: 443

# Entries by kind: URL repositories are cloned, path repositories read in place
__package_management_pkgbuild_url_repos: >-
  {{ paru_pkgbuild_repositories
     | selectattr('url', 'defined') | rejectattr('url', 'equalto', '')
     | list }}
__package_management_pkgbuild_path_repos: >-
  {{ paru_pkgbuild_repositories
     | selectattr('path', 'defined') | rejectattr('path', 'equalto', '')
     | list }}
