---
- name: Makepkg | Install base-devel
  ansible.builtin.package:
    name: 'base-devel'
    state: present
  retries: 3
  delay: 5

- name: Makepkg | Deploy makepkg.conf
  ansible.builtin.template:
    src: 'archlinux/makepkg.conf.j2'
    dest: '/etc/makepkg.conf'
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Makepkg | Install ccache
  ansible.builtin.package:
    name: 'ccache'
    state: present
  retries: 3
  delay: 5
  when: makepkg_ccache_enabled | bool

- name: Makepkg | Install sccache
  ansible.builtin.package:
    name: 'sccache'
    state: present
  retries: 3
  delay: 5
  when: makepkg_sccache_enabled | bool

- name: Makepkg | Install distcc
  ansible.builtin.package:
    name: 'distcc'
    state: present
  retries: 3
  delay: 5
  when: makepkg_distcc_enabled | bool

- name: Makepkg | Install devtools
  ansible.builtin.package:
    name: 'devtools'
    state: present
  retries: 3
  delay: 5
  when: makepkg_devtools_enabled | bool

- name: Makepkg | Install nvchecker
  ansible.builtin.package:
    name: 'nvchecker'
    state: present
  retries: 3
  delay: 5
  when: makepkg_nvchecker_enabled | bool

#
# Per-User makepkg.conf
#

- name: Makepkg | Stat existing per-user makepkg.conf
  ansible.builtin.stat:
    path: >-
      {{ __makepkg_user.home
         | default("/home/" + __makepkg_user.username) }}/.makepkg.conf
  loop: '{{ makepkg_users }}'
  loop_control:
    loop_var: __makepkg_user
    label: '{{ __makepkg_user.username }}'
  register: __makepkg_user_config_stats
  when:
    - makepkg_users | length > 0
    - (__makepkg_user.mode | default(makepkg_user_config_mode)) != 'disabled'

- name: Makepkg | Build per-user deploy decision
  ansible.builtin.set_fact:
    __makepkg_should_deploy: >-
      {{
        dict(__makepkg_user_config_stats.results
             | rejectattr('skipped', 'defined')
             | map(attribute='__makepkg_user.username')
             | zip(__makepkg_user_config_stats.results
                   | rejectattr('skipped', 'defined')
                   | map(attribute='stat.exists')
                   | map('ternary', false, true)))
      }}
  when: makepkg_users | length > 0

- name: Makepkg | Deploy user makepkg.conf
  ansible.builtin.template:
    src: 'archlinux/makepkg.user.conf.j2'
    dest: '{{ __makepkg_user.home | default("/home/" + __makepkg_user.username) }}/.makepkg.conf'
    owner: '{{ __makepkg_user.username }}'
    group: '{{ __makepkg_user.group | default(__makepkg_user.username) }}'
    mode: '0644'
  loop: '{{ makepkg_users }}'
  loop_control:
    loop_var: __makepkg_user
    label: '{{ __makepkg_user.username }}'
  when:
    - makepkg_users | length > 0
    - (__makepkg_user.mode | default(makepkg_user_config_mode)) != 'disabled'
    - >-
      (__makepkg_user.mode | default(makepkg_user_config_mode)) == 'managed'
      or __makepkg_should_deploy[__makepkg_user.username] | default(true)
