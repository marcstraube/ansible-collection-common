---
- name: Yay | Import shared AUR infrastructure tasks
  ansible.builtin.import_tasks: archlinux/aur_shared.yml

- name: Yay | Include shared clone directory tasks
  ansible.builtin.include_tasks:
    file: archlinux/aur_clone_dir.yml
    apply:
      tags:
        - package-management
        - package-management:configure
  vars:
    __aur_clone_dir: '{{ yay_clone_dir }}'
  tags:
    - package-management
    - package-management:configure

#
# Per-user configuration
#
# yay has no system-wide configuration file: it reads
# $XDG_CONFIG_HOME/yay/config.json, falling back to
# ~/.config/yay/config.json. The build directory therefore has to be
# written for every account that runs yay — the builder user, because
# kewlfft.aur builds as that account, and each shared user for their
# own manual invocations.
#

- name: Yay | Read passwd database
  ansible.builtin.getent:
    database: passwd

- name: Yay | Ensure yay config directory exists
  ansible.builtin.file:
    path: '{{ getent_passwd[item][4] }}/.config/yay'
    state: directory
    owner: '{{ item }}'
    group: '{{ getent_passwd[item][2] }}'
    mode: '0755'
  loop: '{{ [aur_builder_user] + aur_shared_users }}'
  when: getent_passwd[item] is defined

# Read any existing config first and merge the build directory into it,
# so settings a user saved through `yay --save` survive. Ansible owns
# buildDir; everything else in the file is left as found.
- name: Yay | Read existing yay configuration
  ansible.builtin.slurp:
    src: '{{ getent_passwd[item][4] }}/.config/yay/config.json'
  register: __yay_existing_config
  loop: '{{ [aur_builder_user] + aur_shared_users }}'
  # Absent on first run
  failed_when: false
  when: getent_passwd[item] is defined

- name: Yay | Write yay configuration with the shared build directory
  ansible.builtin.copy:
    content: |
      {{ __yay_config | to_nice_json }}
    dest: '{{ getent_passwd[item.item][4] }}/.config/yay/config.json'
    owner: '{{ item.item }}'
    group: '{{ getent_passwd[item.item][2] }}'
    mode: '0644'
  vars:
    __yay_config: >-
      {{ (item.content | default('') | b64decode | from_json
          if (item.content is defined)
          else {})
         | combine({'buildDir': yay_clone_dir}) }}
  loop: '{{ __yay_existing_config.results | default([]) }}'
  loop_control:
    label: '{{ item.item | default("") }}'
  when:
    - item.item is defined
    - getent_passwd[item.item] is defined

# Manual yay runs must happen as the builder user, otherwise the shared
# clone tree gains entries owned by the login user and locks the builder
# out on the next Ansible run. The wrapper shadows /usr/bin/yay in PATH
# and transparently re-executes it as the builder user via sudo, so a
# bare "yay -Syu" is safe from any wheel account or as root.
- name: Yay | Install manual-invocation wrapper
  ansible.builtin.template:
    src: 'archlinux/yay-wrapper.j2'
    dest: '/usr/local/bin/yay'
    owner: root
    group: root
    mode: '0755'

# Companion rule for the wrapper: let wheel members run yay as the builder
# user. Authentication is required on purpose (no NOPASSWD) — the same bar
# as "sudo pacman", so a manual upgrade still asks for the caller's
# password. root does not need this rule.
- name: Yay | Allow wheel to run yay as the builder user
  ansible.builtin.lineinfile:
    path: '/etc/sudoers.d/99-{{ aur_builder_user }}'
    line: '%wheel ALL=({{ aur_builder_user }}) /usr/bin/yay'
    create: true
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
