---
- name: Yay | Include shared clone directory tasks
  ansible.builtin.include_tasks:
    file: archlinux/aur_clone_dir.yml
    apply:
      tags:
        - package-management
        - package-management:configure
  vars:
    __aur_clone_dir: '{{ yay_clone_dir }}'
  tags:
    - package-management
    - package-management:configure

#
# Builder configuration
#
# yay has no system-wide configuration file: it reads
# $XDG_CONFIG_HOME/yay/config.json, falling back to
# ~/.config/yay/config.json. The build directory is written there for the
# builder user, which every build runs as, so a call of /usr/bin/yay as the
# builder also lands in the shared tree. The wrapper passes --builddir on
# top, so login users need no configuration of their own.
#

- name: Yay | Read passwd database
  ansible.builtin.getent:
    database: passwd

- name: Yay | Ensure yay config directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts["getent_passwd"][aur_builder_user][4] }}/.config/yay'
    state: directory
    owner: '{{ aur_builder_user }}'
    group: '{{ ansible_facts["getent_passwd"][aur_builder_user][2] }}'
    mode: '0755'
  when: ansible_facts["getent_passwd"][aur_builder_user] is defined

# Read any existing config first and merge the build directory into it,
# so settings saved through `yay --save` survive. Ansible owns buildDir;
# everything else in the file is left as found.
- name: Yay | Read existing yay configuration
  ansible.builtin.slurp:
    src: '{{ ansible_facts["getent_passwd"][aur_builder_user][4] }}/.config/yay/config.json'
  register: __yay_existing_config
  # Absent on first run
  failed_when: false
  when: ansible_facts["getent_passwd"][aur_builder_user] is defined

- name: Yay | Write yay configuration with the shared build directory
  ansible.builtin.copy:
    content: |
      {{ __yay_config | to_nice_json }}
    dest: '{{ ansible_facts["getent_passwd"][aur_builder_user][4] }}/.config/yay/config.json'
    owner: '{{ aur_builder_user }}'
    group: '{{ ansible_facts["getent_passwd"][aur_builder_user][2] }}'
    mode: '0644'
  vars:
    __yay_config: >-
      {{ (__yay_existing_config.content | b64decode | from_json
          if (__yay_existing_config.content is defined)
          else {})
         | combine({'buildDir': yay_clone_dir}) }}
  when: ansible_facts["getent_passwd"][aur_builder_user] is defined

# Manual yay runs must happen as the builder user, the only user that can
# write to the shared clone tree; root would leave entries there that the
# next Ansible run hands back to the builder. The wrapper shadows
# /usr/bin/yay in PATH and transparently re-executes it as the builder
# user via sudo, so a bare "yay -Syu" works from any wheel account or as
# root. Only operations that work in the caller's directory (-B, -G) run
# as the calling login user, with yay's per-user build directory.
- name: Yay | Install manual-invocation wrapper
  ansible.builtin.template:
    src: 'archlinux/yay-wrapper.j2'
    dest: '/usr/local/bin/yay'
    owner: root
    group: root
    mode: '0755'

# Companion rule for the wrapper: let wheel members run yay as the builder
# user. Authentication is required on purpose (no NOPASSWD) — the same bar
# as "sudo pacman", so a manual upgrade still asks for the caller's
# password. root does not need this rule.
- name: Yay | Allow wheel to run yay as the builder user
  ansible.builtin.lineinfile:
    path: '{{ __package_management_sudoers_file }}'
    line: '%wheel ALL=({{ aur_builder_user }}) /usr/bin/yay'
    create: true
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
