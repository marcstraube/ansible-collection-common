---
- name: Tools | Install rebuild-detector
  ansible.builtin.package:
    name: 'rebuild-detector'
    state: present
  retries: 3
  delay: 5
  when: pacman_rebuild_detector_enabled | bool

- name: Tools | Install pkgfile
  ansible.builtin.package:
    name: 'pkgfile'
    state: present
  retries: 3
  delay: 5
  when: pacman_pkgfile_enabled | bool
  notify: 'pkgfile installed'

- name: Tools | Look for the pkgfile update timer unit
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '/usr/lib/systemd/system/pkgfile-update.timer'
    - '/etc/systemd/system/pkgfile-update.timer'
  register: pkgfile_update_timer_unit

- name: Tools | Manage pkgfile update timer
  ansible.builtin.systemd_service:
    name: 'pkgfile-update.timer'
    enabled: "{{ pacman_pkgfile_enabled | bool }}"
    state: "{{ pacman_pkgfile_enabled | bool | ternary('started', 'stopped') }}"
  when: >-
    pacman_pkgfile_enabled | bool
    or pkgfile_update_timer_unit.results | selectattr('stat.exists') | list | length > 0

- name: Tools | Install informant
  become: true
  become_user: '{{ aur_builder_user }}'
  kewlfft.aur.aur:
    name: 'informant'
    use: '{{ aur_helper }}'
    state: present
  retries: 3
  delay: 5
  when:
    - pacman_informant_enabled | bool
    - aur_helper | length > 0
