---
- name: Paru | Derive shared users from wheel group (exclude system users)  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    paru_shared_users: >-
      {{ (users_list
          | selectattr('groups', 'defined')
          | selectattr('groups', 'contains', 'wheel')
          | selectattr('system', 'undefined') | list
          + users_list
          | selectattr('groups', 'defined')
          | selectattr('groups', 'contains', 'wheel')
          | selectattr('system', 'defined')
          | rejectattr('system', 'equalto', true) | list)
         | map(attribute='name') | list }}
  when:
    - paru_shared_users | length == 0
    - users_list is defined
    - users_list | length > 0

- name: Paru | Create shared AUR group
  ansible.builtin.group:
    name: aur_shared
    system: true
    state: present

- name: Paru | Add aur_builder to shared AUR group
  ansible.builtin.user:
    name: '{{ aur_builder_user }}'
    groups: aur_shared
    append: true

- name: Paru | Add users to shared AUR group
  ansible.builtin.user:
    name: '{{ item }}'
    groups: aur_shared
    append: true
  loop: '{{ paru_shared_users }}'

# Owned by the builder user: makepkg chmods paths inside the tree and
# POSIX only permits that for the owner. Group access for the other
# aur_shared members comes from SGID + the default ACLs below.
- name: Paru | Create shared clone directory
  ansible.builtin.file:
    path: '{{ paru_clone_dir }}'
    state: directory
    owner: '{{ aur_builder_user }}'
    group: aur_shared
    mode: '2775'

# The SGID bit propagates the aur_shared group ownership, but a restrictive
# umask (e.g. hardening's 0077) strips group permissions from files that
# aur_builder creates. Default ACLs force group-rwX on new entries regardless
# of the creating user's umask, so other aur_shared members can rebuild.
- name: Paru | Set default owning-group ACL on shared clone directory
  ansible.posix.acl:
    path: '{{ paru_clone_dir }}'
    default: true
    etype: group
    permissions: rwX
    state: present

- name: Paru | Set default aur_shared ACL on shared clone directory
  ansible.posix.acl:
    path: '{{ paru_clone_dir }}'
    default: true
    etype: group
    entity: aur_shared
    permissions: rwX
    state: present

# One-off recovery: restore group access on entries created before the default
# ACLs were in place, so live hosts recover without manual cleanup. setfacl -R
# is used directly because ansible.posix.acl's recursive mode is not idempotent
# across versions; changed_when is false because the default ACLs above already
# guarantee correct permissions for any newly created entry.
- name: Paru | Recover group permissions on existing clone entries
  ansible.builtin.command:
    cmd: 'setfacl -R -m g:aur_shared:rwX -m d:g:aur_shared:rwX {{ paru_clone_dir }}'
  changed_when: false

# makepkg chmods paths inside the clone tree and POSIX only permits that
# for the owner — group write access and ACLs do not help. Builds run as
# the builder user, so normalise ownership of existing entries; clones
# created interactively by other group members are adopted on the next
# run. changed_when is false: this is a top-up like the ACL recovery
# above, newly built entries are owned by the builder anyway.
- name: Paru | Recover ownership on existing clone entries
  ansible.builtin.command:
    cmd: 'chown -R {{ aur_builder_user }}:aur_shared {{ paru_clone_dir }}'
  changed_when: false

# git refuses to operate on repositories owned by another user
# (CVE-2022-24765 safe.directory check). In the shared clone directory
# that is the normal case: any aur_shared member may have cloned a
# package first, while paru builds run as the builder user. Shared
# write access inside the group is the deliberate design here (SGID +
# default ACLs), so mark the clone tree as safe system-wide.
- name: Paru | Mark shared clone directory as git-safe
  community.general.git_config:
    scope: system
    name: safe.directory
    value: '{{ paru_clone_dir }}/*'
    add_mode: add

# The module creates /etc/gitconfig subject to the root umask; under a
# hardened umask (0077) that yields 0600 and git silently skips an
# unreadable system config — the safe.directory entry would never reach
# the builder user.
- name: Paru | Ensure system gitconfig is world-readable
  ansible.builtin.file:
    path: /etc/gitconfig
    owner: root
    group: root
    mode: '0644'

- name: Paru | Disable Copy-on-Write on shared clone directory (BTRFS)
  ansible.builtin.file:
    path: '{{ paru_clone_dir }}'
    attr: +C
  # BTRFS attribute only works on BTRFS filesystems
  failed_when: false

- name: Paru | Deploy paru.conf
  ansible.builtin.template:
    src: 'archlinux/paru.conf.j2'
    dest: '/etc/paru.conf'
    owner: root
    group: root
    mode: '0644'
