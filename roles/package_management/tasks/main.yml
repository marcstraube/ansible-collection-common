---
- name: Main | Include Archlinux tasks
  when:
    - package_management_enabled | bool
    - ansible_facts['os_family'] == 'Archlinux'
  tags:
    - package-management
  block:
    # Only paru reads PKGBUILD repositories; yay has no equivalent. Checked
    # first, before the helper is built.
    - name: Main | Validate PKGBUILD repositories against the AUR helper
      ansible.builtin.assert:
        that:
          - paru_pkgbuild_repositories | length == 0 or aur_helper == 'paru'
        fail_msg: >-
          paru_pkgbuild_repositories needs aur_helper 'paru', got
          '{{ aur_helper }}'
        quiet: true
      tags:
        - always

    # paru rejects the section names options, bin, env, local, aur, pkg and
    # base and names with a dot; Url must be an absolute URL with a scheme.
    # The name also becomes the clone directory below paru_clone_dir/repo.
    # Every value ends up on a line of paru.conf, so whitespace and control
    # characters are rejected: a line break would start a section of its
    # own. \Z instead of $, which also matches before a final line break.
    # The loop runs over indexes, so neither the output nor a failure shows
    # a url, which could hold credentials.
    - name: Main | Validate PKGBUILD repository entries
      vars:
        __package_management_repo: '{{ paru_pkgbuild_repositories[item] }}'
        __package_management_repo_url: >-
          {{ __package_management_repo.url | default('')
             if __package_management_repo is mapping else '' }}
        __package_management_repo_path: >-
          {{ __package_management_repo.path | default('')
             if __package_management_repo is mapping else '' }}
        __package_management_repo_subdirectory: >-
          {{ __package_management_repo.subdirectory | default('')
             if __package_management_repo is mapping else '' }}
      ansible.builtin.assert:
        that:
          - __package_management_repo is mapping
          - __package_management_repo.keys() | difference(__package_management_pkgbuild_repo_keys) | length == 0
          - __package_management_repo.name | default('') is string
          - __package_management_repo.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_+-]*\Z')
          - __package_management_repo.name | lower not in __package_management_pkgbuild_repo_reserved_names
          - (__package_management_repo_url | length > 0) != (__package_management_repo_path | length > 0)
          - >-
            __package_management_repo_url | length == 0
            or __package_management_repo_url is match('^[A-Za-z][A-Za-z0-9+.-]*://')
          - >-
            __package_management_repo_path | length == 0
            or __package_management_repo_path is match('^/[^\x00-\x20\x7f-\x9f]*\Z')
          - >-
            __package_management_repo_subdirectory | length == 0
            or (__package_management_repo_url | length > 0
                and __package_management_repo_subdirectory is match('^[^/\x00-\x20\x7f-\x9f][^\x00-\x20\x7f-\x9f]*\Z')
                and __package_management_repo_subdirectory is not search('(^|/)[.][.](/|\Z)'))
          - >-
            __package_management_repo.depth is not defined
            or (__package_management_repo.depth is integer and __package_management_repo.depth > 0)
        fail_msg: >-
          Invalid paru_pkgbuild_repositories entry
          {{ "'" ~ __package_management_repo.name ~ "'"
             if __package_management_repo is mapping and __package_management_repo.name is defined
             else 'at index ' ~ item }}:
          it needs a name (letters, digits, '_', '+', '-'; not one of
          {{ __package_management_pkgbuild_repo_reserved_names | join(', ') }}),
          exactly one of url (with a scheme, e.g. 'https://' or 'file:///')
          and path (absolute), subdirectory only with url and relative without
          '..', depth as a positive integer and no keys besides
          {{ __package_management_pkgbuild_repo_keys | join(', ') }}. path
          and subdirectory must not contain whitespace or control characters.
        quiet: true
      loop: '{{ range(paru_pkgbuild_repositories | length) | list }}'
      loop_control:
        label: '{{ item }}'
      tags:
        - always

    # Only https, ssh and local file URLs: http and git have no transport
    # protection for build recipes that are installed as root. paru
    # normalizes a Url before it clones (WHATWG URL rules), and the role
    # compares the origin of an existing clone with the url to notice a
    # change. A url that paru would rewrite never matches and would be
    # cloned again on every run, so it has to be written the way paru
    # stores it: printable ASCII without the characters paru percent-encodes,
    # lowercase scheme and host, no default port, a path after an https host
    # and no '.' or '..' segments, which paru resolves (also as %2e).
    # Credentials in the url would end up in the world-readable paru.conf.
    - name: Main | Validate PKGBUILD repository URLs
      vars:
        __package_management_repo: '{{ paru_pkgbuild_repositories[item] }}'
        __package_management_repo_url: '{{ __package_management_repo.url }}'
        __package_management_pkgbuild_checked_urls: '{{ [__package_management_repo_url] }}'
        __package_management_repo_scheme: "{{ __package_management_repo_url | urlsplit('scheme') }}"
        __package_management_repo_netloc: "{{ __package_management_repo_url | urlsplit('netloc') }}"
        __package_management_repo_host: >-
          {{ (__package_management_repo_netloc.split('@') | last).split(':') | first }}
        __package_management_repo_port: "{{ __package_management_repo_url | urlsplit('port') }}"
        __package_management_repo_urlpath: "{{ __package_management_repo_url | urlsplit('path') }}"
      ansible.builtin.assert:
        that:
          - __package_management_repo_url is match('^[][A-Za-z0-9._~:/@!$&()*+,;=%-]+\Z')
          - __package_management_repo_url is match('^((https|ssh)://[^/]|file:///)')
          - __package_management_pkgbuild_urls_with_credentials | int == 0
          - __package_management_repo_host == __package_management_repo_host | lower
          - "'%' not in __package_management_repo_host"
          - >-
            __package_management_repo_port | string
            != __package_management_pkgbuild_repo_default_ports[__package_management_repo_scheme] | default('') | string
          - __package_management_repo_scheme != 'https' or __package_management_repo_urlpath | length > 0
          - __package_management_repo_urlpath is not search('(?i)(^|/)([.]|%2e){1,2}(/|\Z)')
        fail_msg: >-
          paru_pkgbuild_repositories url of '{{ __package_management_repo.name }}'
          is not accepted. It must start with 'https://', 'ssh://' or
          'file:///', contain no credentials (no 'user:password@', and no user
          or token before '@' in an https url; use an SSH key for
          {{ aur_builder_user }} instead) and be in the form paru stores:
          printable ASCII without whitespace and without '"<>\^`{|}#?',
          lowercase scheme and host, no default port, a path of at least '/'
          after an https host and no '.' or '..' path segments.
        quiet: true
      loop: '{{ range(paru_pkgbuild_repositories | length) | list }}'
      loop_control:
        label: '{{ item }}'
      when: paru_pkgbuild_repositories[item].url | default('') | length > 0
      tags:
        - always

    - name: Main | Validate PKGBUILD repository names are unique
      ansible.builtin.assert:
        that:
          - >-
            paru_pkgbuild_repositories | map(attribute='name') | unique | length
            == paru_pkgbuild_repositories | length
        fail_msg: >-
          paru_pkgbuild_repositories names must be unique, got
          {{ paru_pkgbuild_repositories | map(attribute='name') | list }}
        quiet: true
      tags:
        - always

    # paru builds the packages of a path repository inside it as the builder
    # user and installs them as root; tasks/archlinux/paru.yml hands the
    # directory to the builder user and the shared group. Before any change,
    # the path must be a canonical path of a directory (symlinks are not
    # followed) holding a Git directory, neither a system directory nor the
    # home of an account, apart from the shared clone directories, without
    # entries others can write to, without credentials in its remote URLs,
    # and only root may be able to replace it: every parent directory is
    # owned by root and not writable by group or others.
    - name: Main | Check PKGBUILD repository paths
      ansible.builtin.stat:
        path: '{{ item.path }}'
        follow: false
        get_checksum: false
      loop: '{{ __package_management_pkgbuild_path_repos }}'
      loop_control:
        label: '{{ item.name }}'
      register: __package_management_pkgbuild_paths
      tags:
        - always

    # Symlinks inside the repository are skipped: their mode means nothing
    # and find does not follow them. Read-only, so it also runs in check mode.
    - name: Main | Find PKGBUILD repository entries writable by others
      ansible.builtin.command:
        argv:
          - find
          - -P
          - '{{ item.item.path }}'
          - '!'
          - -type
          - l
          - -perm
          - '-o+w'
          - -print
          - -quit
      loop: '{{ __package_management_pkgbuild_paths.results }}'
      loop_control:
        label: '{{ item.item.name }}'
      register: __package_management_pkgbuild_path_writable
      changed_when: false
      check_mode: false
      when: item.stat.isdir | default(false)
      tags:
        - always

    # Every later task uses the path as written, so it must be canonical: no
    # symlink in a parent, no '.', '..', '//' or trailing '/' (with a
    # trailing '/' the check above follows a symlink). realpath resolves it
    # for the comparison; the parents are then checked on that same path.
    - name: Main | Resolve PKGBUILD repository paths
      ansible.builtin.command:
        argv:
          - realpath
          - -e
          - --
          - '{{ item.item.path }}'
      loop: '{{ __package_management_pkgbuild_paths.results }}'
      loop_control:
        label: '{{ item.item.name }}'
      register: __package_management_pkgbuild_path_realpaths
      changed_when: false
      check_mode: false
      when: item.stat.isdir | default(false)
      tags:
        - always

    # Only a Git directory inside the tree: a .git file (worktree,
    # submodule) points to a Git directory elsewhere, whose configuration
    # git runs commands from as the builder user, and which the role neither
    # checks nor manages. Read without following a symlink.
    - name: Main | Check PKGBUILD repository Git directories
      ansible.builtin.stat:
        path: '{{ item.item.path }}/.git'
        follow: false
        get_checksum: false
      loop: '{{ __package_management_pkgbuild_paths.results }}'
      loop_control:
        label: '{{ item.item.name }}'
      register: __package_management_pkgbuild_path_gitdirs
      when: item.stat.isdir | default(false)
      tags:
        - always

    - name: Main | Check PKGBUILD repository parent directories
      vars:
        __package_management_pkgbuild_path_parents: >-
          {%- set ns = namespace(dirs=[], cur='') -%}
          {%- for res in __package_management_pkgbuild_path_realpaths.results if res is not skipped -%}
          {%-   set ns.cur = '' -%}
          {%-   set ns.dirs = ns.dirs + [{'name': res.item.item.name, 'dir': '/'}] -%}
          {%-   for part in (res.stdout | dirname).split('/') if part | length > 0 -%}
          {%-     set ns.cur = ns.cur ~ '/' ~ part -%}
          {%-     set ns.dirs = ns.dirs + [{'name': res.item.item.name, 'dir': ns.cur}] -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ ns.dirs | to_json }}
      ansible.builtin.stat:
        path: '{{ item.dir }}'
        follow: false
        get_checksum: false
      loop: '{{ __package_management_pkgbuild_path_parents | from_json }}'
      loop_control:
        label: '{{ item.name }}: {{ item.dir }}'
      register: __package_management_pkgbuild_path_parent_stats
      tags:
        - always

    # The takeover would hand a home directory to the builder user, so a
    # path must not be the home of any account. A command instead of
    # ansible.builtin.getent, which stores duplicate entries as nested lists.
    # Read-only, so it also runs in check mode.
    - name: Main | Read accounts for PKGBUILD repository paths
      ansible.builtin.command:
        argv:
          - getent
          - passwd
      register: __package_management_pkgbuild_passwd
      changed_when: false
      check_mode: false
      when: __package_management_pkgbuild_path_repos | length > 0
      tags:
        - always

    # Compared as canonical paths like the repository paths; -m also
    # resolves homes that do not exist. Read-only, so it also runs in check
    # mode.
    - name: Main | Resolve home directories of accounts
      ansible.builtin.command:
        argv: >-
          {{ ['realpath', '-m', '--']
             + (__package_management_pkgbuild_accounts | from_json | map(attribute='home') | list) }}
      register: __package_management_pkgbuild_home_realpaths
      changed_when: false
      check_mode: false
      when:
        - __package_management_pkgbuild_path_repos | length > 0
        - __package_management_pkgbuild_accounts | from_json | length > 0
      tags:
        - always

    # The shared clone directories get the same setup with another
    # safe.directory entry and paru cleans path repositories with git, so a
    # path must neither be one of them nor lie inside or above one. Compared
    # as written, like everything else that uses them.
    - name: Main | Validate PKGBUILD repository paths are safe
      vars:
        __package_management_path_realpath: >-
          {{ __package_management_pkgbuild_path_realpaths.results[__package_management_index].stdout
             | default('') }}
        __package_management_path_gitdir: >-
          {{ __package_management_pkgbuild_path_gitdirs.results[__package_management_index].stat
             | default({}) }}
        __package_management_path_clone_dirs: >-
          {%- set ns = namespace(dirs=[]) -%}
          {%- set path = item.item.path ~ '/' -%}
          {%- for dir in [paru_clone_dir, yay_clone_dir] if dir is string and dir | length > 0 -%}
          {%-   set clone = dir | regex_replace('/+\Z', '') ~ '/' -%}
          {%-   if path.startswith(clone) or clone.startswith(path) -%}
          {%-     set ns.dirs = ns.dirs + [dir] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.dirs | to_json }}
        __package_management_path_writable: >-
          {{ __package_management_pkgbuild_path_writable.results[__package_management_index].stdout
             | default('') }}
        __package_management_path_home_accounts: >-
          {%- set ns = namespace(names=[]) -%}
          {%- set homes = __package_management_pkgbuild_home_realpaths.stdout_lines | default([]) -%}
          {%- for account in __package_management_pkgbuild_accounts | from_json -%}
          {%-   if homes[loop.index0] | default('') == item.item.path -%}
          {%-     set ns.names = ns.names + [account.name] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.names | to_json }}
        __package_management_path_parent_stats: >-
          {{ __package_management_pkgbuild_path_parent_stats.results
             | selectattr('item.name', 'equalto', item.item.name) | list }}
        __package_management_path_unsafe_parents: >-
          {{ (__package_management_path_parent_stats | rejectattr('stat.uid', 'equalto', 0) | list
              + __package_management_path_parent_stats | selectattr('stat.wgrp') | list
              + __package_management_path_parent_stats | selectattr('stat.woth') | list)
             | map(attribute='item.dir') | unique | list }}
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - __package_management_path_realpath == item.item.path
          - item.item.path not in __package_management_pkgbuild_path_system_dirs
          - __package_management_path_home_accounts | from_json | length == 0
          - __package_management_path_unsafe_parents | length == 0
          - __package_management_path_clone_dirs | from_json | length == 0
          - __package_management_path_writable | length == 0
          - __package_management_path_gitdir.isdir | default(false)
        fail_msg: >-
          paru_pkgbuild_repositories path {{ item.item.path }} of
          '{{ item.item.name }}'
          {{ 'does not exist' if not item.stat.exists
             else 'is not a directory (symlinks are not followed)' if not item.stat.isdir
             else 'must be a canonical absolute path (no symlinks, \'.\', \'..\', \'//\' or '
                  ~ 'trailing \'/\'), it resolves to ' ~ __package_management_path_realpath
                  if __package_management_path_realpath != item.item.path
             else 'is a system directory' if item.item.path in __package_management_pkgbuild_path_system_dirs
             else 'is the home directory of '
                  ~ (__package_management_path_home_accounts | from_json | join(', '))
                  if __package_management_path_home_accounts | from_json | length > 0
             else 'has parent directories that are not owned by root or are writable by group or others: '
                  ~ __package_management_path_unsafe_parents | join(', ')
                  if __package_management_path_unsafe_parents | length > 0
             else 'overlaps the shared clone directory '
                  ~ (__package_management_path_clone_dirs | from_json | join(', '))
                  if __package_management_path_clone_dirs | from_json | length > 0
             else 'contains an entry writable by others: ' ~ __package_management_path_writable
                  if __package_management_path_writable | length > 0
             else 'has no Git directory .git (a .git file of a worktree or submodule is not accepted)' }}.
          Packages built from it are installed as root. Use the canonical
          path of a Git work tree of its own (not a home or system
          directory) outside the shared clone directories, without entries
          writable by others (chmod -R o-w), below parent directories that
          only root can write to.
        quiet: true
      loop: '{{ __package_management_pkgbuild_paths.results }}'
      loop_control:
        label: '{{ item.item.name }}'
        index_var: __package_management_index
      tags:
        - always

    # Every file of a path repository becomes readable by all users, its
    # .git/config included. Read with --file, so neither the configuration
    # of the repository nor its includes run anything; only the remote URLs.
    # rc 1 means there are none. no_log, as the output holds the URLs.
    # Read-only, so it also runs in check mode.
    - name: Main | Read PKGBUILD repository remote URLs
      ansible.builtin.command:
        argv:
          - git
          - config
          - --file
          - '{{ item.path }}/.git/config'
          - --get-regexp
          - '^remote\..*\.(url|pushurl)$'
      loop: '{{ __package_management_pkgbuild_path_repos }}'
      loop_control:
        label: '{{ item.name }}'
      register: __package_management_pkgbuild_path_remotes
      changed_when: false
      failed_when: __package_management_pkgbuild_path_remotes.rc not in [0, 1]
      check_mode: false
      no_log: true
      tags:
        - always

    # The same rule as for a url. Each line is '<key> <url>'. The loop runs
    # over indexes, so neither the output nor a failure shows a URL.
    - name: Main | Validate PKGBUILD repository remote URLs
      vars:
        __package_management_repo: '{{ __package_management_pkgbuild_path_repos[item] }}'
        __package_management_pkgbuild_checked_urls: >-
          {{ __package_management_pkgbuild_path_remotes.results[item].stdout_lines
             | map('regex_replace', '^\S+ ', '') | list }}
      ansible.builtin.assert:
        that:
          - __package_management_pkgbuild_urls_with_credentials | int == 0
        fail_msg: >-
          paru_pkgbuild_repositories path {{ __package_management_repo.path }} of
          '{{ __package_management_repo.name }}' has a remote URL with
          credentials in .git/config, which becomes readable by all users.
          Remove them from the URL (git remote set-url) and use an SSH key or
          a credential helper of {{ aur_builder_user }} instead.
        quiet: true
      loop: '{{ range(__package_management_pkgbuild_path_repos | length) | list }}'
      loop_control:
        label: '{{ item }}'
      tags:
        - always

    - name: Main | Import Reflector tasks
      ansible.builtin.import_tasks: archlinux/reflector.yml
      when: reflector_enabled | bool
      tags:
        - package-management
        - package-management:repos

    - name: Main | Import Pacman tasks
      ansible.builtin.import_tasks: archlinux/pacman.yml
      tags:
        - package-management
        - package-management:configure

    # After pacman.conf, keys and cache are in place; before the AUR helper
    # and every later role install a package that needs a listed provider
    - name: Main | Import Dependencies tasks
      ansible.builtin.import_tasks: archlinux/dependencies.yml
      when: pacman_dependency_packages | length > 0
      tags:
        - package-management
        - package-management:dependencies

    - name: Main | Import Makepkg tasks
      ansible.builtin.import_tasks: archlinux/makepkg.yml
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import AUR tasks
      ansible.builtin.import_tasks: archlinux/aur.yml
      when: aur_helper | length > 0
      tags:
        - package-management
        - package-management:install

    - name: Main | Import Paru tasks
      ansible.builtin.import_tasks: archlinux/paru.yml
      when: aur_helper == 'paru'
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Yay tasks
      ansible.builtin.import_tasks: archlinux/yay.yml
      when: aur_helper == 'yay'
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Tools tasks
      ansible.builtin.import_tasks: archlinux/tools.yml
      tags:
        - package-management
        - package-management:tools

- name: Main | Include Debian tasks
  when:
    - package_management_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  tags:
    - package-management
  block:
    - name: Main | Import APT tasks
      ansible.builtin.import_tasks: debian/apt.yml
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Repos tasks
      ansible.builtin.import_tasks: debian/repos.yml
      tags:
        - package-management
        - package-management:repos

    - name: Main | Import unattended-upgrades tasks
      ansible.builtin.import_tasks: debian/unattended.yml
      when: apt_unattended_upgrades_enabled | bool
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Tools tasks
      ansible.builtin.import_tasks: debian/tools.yml
      tags:
        - package-management
        - package-management:tools

- name: Main | Include RedHat tasks
  when:
    - package_management_enabled | bool
    - ansible_facts['os_family'] == 'RedHat'
  tags:
    - package-management
  block:
    - name: Main | Import DNF tasks
      ansible.builtin.import_tasks: redhat/dnf.yml
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Repos tasks
      ansible.builtin.import_tasks: redhat/repos.yml
      tags:
        - package-management
        - package-management:repos

    - name: Main | Import dnf-automatic tasks
      ansible.builtin.import_tasks: redhat/automatic.yml
      when: dnf_automatic_enabled | bool
      tags:
        - package-management
        - package-management:configure

    - name: Main | Import Tools tasks
      ansible.builtin.import_tasks: redhat/tools.yml
      tags:
        - package-management
        - package-management:tools
