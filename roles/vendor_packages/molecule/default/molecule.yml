---
# Arch Linux only: the aur.yml entry point builds AUR packages. The fixture
# packages (files/aur) are served from local bare repositories that
# prepare.yml creates inside the container; converge.yml points the role at
# them instead of the AUR.
driver:
  name: podman
platforms:
  - name: vendor-packages-archlinux
    image: docker.io/marcstraube/archlinux-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: rw,nosuid,nodev,size=65536k
      /tmp: rw,nosuid,nodev
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      vendor-packages-archlinux:
        ansible_python_interpreter: /usr/bin/python
  config_options:
    defaults:
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
