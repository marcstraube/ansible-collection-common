---
- name: Connections | Check existing Ethernet connections
  ansible.builtin.command: nmcli -t -f NAME connection show
  register: __nm_existing_connections
  changed_when: false
  # nmcli may fail if NetworkManager is not running or no connections exist
  failed_when: false
  check_mode: false

- name: Connections | Create placeholder for Ethernet connections
  community.general.nmcli:
    type: ethernet
    conn_name: "{{ item.key }}"
    ifname: "{{ item.value.ifname | default(omit) }}"
    state: present
    autoconnect: false
  loop: "{{ networkmanager_connections.ethernet | dict2items | default([]) }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.state | default("present") == "present"
    - item.key not in __nm_existing_connections.stdout_lines | default([])

- name: Connections | Configure NetworkManager ethernet connections
  community.general.nmcli:
    type: ethernet
    conn_name: "{{ item.key }}"
    ifname: "{{ item.value.ifname | default(omit) }}"
    ip4: "{{ item.value.ip4 | default(omit) }}"
    gw4: "{{ item.value.gw4 | default(omit) }}"
    gw4_ignore_auto: "{{ item.value.gw4_ignore_auto | default(omit) }}"
    ip6: "{{ item.value.ip6 | default(omit) }}"
    gw6: "{{ item.value.gw6 | default(omit) }}"
    gw6_ignore_auto: "{{ item.value.gw6_ignore_auto | default(omit) }}"
    autoconnect: "{{ item.value.autoconnect | default(true) }}"
    autoconnect_priority: "{{ item.value.autoconnect_priority | default(omit) }}"
    # DNS Configuration
    dns4: >-
      {{ item.value.dns4 | default(
         networkmanager_global_dns4
         if networkmanager_apply_global_dns else omit) }}
    dns4_search: >-
      {{ item.value.dns4_search | default(
         networkmanager_global_dns4_search
         if networkmanager_apply_global_dns else omit) }}
    dns4_ignore_auto: "{{ item.value.dns4_ignore_auto | default(omit) }}"
    dns4_options: >-
      {{ item.value.dns4_options | default(
         networkmanager_global_dns4_options
         if networkmanager_apply_global_dns else omit) }}
    dns6: >-
      {{ item.value.dns6 | default(
         networkmanager_global_dns6
         if networkmanager_apply_global_dns else omit) }}
    dns6_search: >-
      {{ item.value.dns6_search | default(
         networkmanager_global_dns6_search
         if networkmanager_apply_global_dns else omit) }}
    dns6_ignore_auto: "{{ item.value.dns6_ignore_auto | default(omit) }}"
    dns6_options: >-
      {{ item.value.dns6_options | default(
         networkmanager_global_dns6_options
         if networkmanager_apply_global_dns else omit) }}
    # Routing Configuration
    routes4: "{{ item.value.routes4 | default(omit) }}"
    routes4_extended: "{{ item.value.routes4_extended | default(omit) }}"
    routes6: "{{ item.value.routes6 | default(omit) }}"
    routes6_extended: "{{ item.value.routes6_extended | default(omit) }}"
    route_metric4: "{{ item.value.route_metric4 | default(omit) }}"
    route_metric6: "{{ item.value.route_metric6 | default(omit) }}"
    routing_rules4: "{{ item.value.routing_rules4 | default(omit) }}"
    # Other Options
    never_default4: "{{ item.value.never_default4 | default(omit) }}"
    may_fail4: "{{ item.value.may_fail4 | default(omit) }}"
    method4: "{{ item.value.method4 | default(omit) }}"
    method6: "{{ item.value.method6 | default(omit) }}"
    zone: "{{ item.value.zone | default(omit) }}"
    state: "{{ item.value.state | default('present') }}"
  loop: "{{ networkmanager_connections.ethernet | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: ethernet_connections_result

- name: Connections | Force NetworkManager WiFi scan before creating WiFi connections
  ansible.builtin.shell: |
    nmcli device wifi rescan || true
    sleep 2
  when: networkmanager_connections.wifi | default({}) | length > 0
  changed_when: false

- name: Connections | Create placeholder for WiFi connections
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.key }}"
    ifname: "{{ item.value.ifname | default(omit) }}"
    ssid: "{{ item.value.ssid }}"
    state: present
    autoconnect: false
  loop: "{{ networkmanager_connections.wifi | dict2items | default([]) }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.state | default("present") == "present"
    - item.key not in __nm_existing_connections.stdout_lines | default([])

- name: Connections | Configure NetworkManager WiFi connections
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.key }}"
    ifname: "{{ item.value.ifname | default(omit) }}"
    ssid: "{{ item.value.ssid }}"
    ip4: "{{ item.value.ip4 | default(omit) }}"
    gw4: "{{ item.value.gw4 | default(omit) }}"
    gw4_ignore_auto: "{{ item.value.gw4_ignore_auto | default(omit) }}"
    ip6: "{{ item.value.ip6 | default(omit) }}"
    gw6: "{{ item.value.gw6 | default(omit) }}"
    gw6_ignore_auto: "{{ item.value.gw6_ignore_auto | default(omit) }}"
    autoconnect: "{{ item.value.autoconnect | default(true) }}"
    autoconnect_priority: "{{ item.value.autoconnect_priority | default(omit) }}"
    # DNS Configuration
    dns4: >-
      {{ item.value.dns4 | default(
         networkmanager_global_dns4
         if networkmanager_apply_global_dns else omit) }}
    dns4_search: >-
      {{ item.value.dns4_search | default(
         networkmanager_global_dns4_search
         if networkmanager_apply_global_dns else omit) }}
    dns4_ignore_auto: "{{ item.value.dns4_ignore_auto | default(omit) }}"
    dns4_options: >-
      {{ item.value.dns4_options | default(
         networkmanager_global_dns4_options
         if networkmanager_apply_global_dns else omit) }}
    dns6: >-
      {{ item.value.dns6 | default(
         networkmanager_global_dns6
         if networkmanager_apply_global_dns else omit) }}
    dns6_search: >-
      {{ item.value.dns6_search | default(
         networkmanager_global_dns6_search
         if networkmanager_apply_global_dns else omit) }}
    dns6_ignore_auto: "{{ item.value.dns6_ignore_auto | default(omit) }}"
    dns6_options: >-
      {{ item.value.dns6_options | default(
         networkmanager_global_dns6_options
         if networkmanager_apply_global_dns else omit) }}
    # Routing Configuration
    routes4: "{{ item.value.routes4 | default(omit) }}"
    routes4_extended: "{{ item.value.routes4_extended | default(omit) }}"
    routes6: "{{ item.value.routes6 | default(omit) }}"
    routes6_extended: "{{ item.value.routes6_extended | default(omit) }}"
    route_metric4: "{{ item.value.route_metric4 | default(omit) }}"
    route_metric6: "{{ item.value.route_metric6 | default(omit) }}"
    routing_rules4: "{{ item.value.routing_rules4 | default(omit) }}"
    # Other Options
    never_default4: "{{ item.value.never_default4 | default(omit) }}"
    may_fail4: "{{ item.value.may_fail4 | default(omit) }}"
    method4: "{{ item.value.method4 | default(omit) }}"
    method6: "{{ item.value.method6 | default(omit) }}"
    zone: "{{ item.value.zone | default(omit) }}"
    state: "{{ item.value.state | default('present') }}"
  loop: "{{ networkmanager_connections.wifi | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: wifi_connections_result

# Generic settings dict: a single check + modify + reapply pipeline for any
# nmcli-native key. Replaces the per-setting check+modify pairs that used to
# live here (cloned-mac, ipv4.dhcp-send-hostname, ipv6.dhcp-send-hostname).
# Any setting the user puts in `connection.settings:` is queried, diffed
# against the current stored value, and applied with one `nmcli connection
# modify` per connection.

- name: Connections | Flatten settings into (conn, ifname, key, value) entries
  ansible.builtin.set_fact:
    __nm_settings_flat: >-
      {{ __nm_settings_flat | default([])
         + (item.value.settings | dict2items
            | map('combine', {
                'conn_name': item.key,
                'ifname': item.value.ifname | default('')
              })
            | list) }}
  loop: >-
    {{ (networkmanager_connections.ethernet | default({}) | dict2items)
       + (networkmanager_connections.wifi | default({}) | dict2items) }}
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.state | default('present') == 'present'
    - item.value.settings | default({}) | length > 0

# Per-key query (rather than `-f all`) — NetworkManager 1.50+ omits
# deprecated properties from `-f all` output (e.g. `ipv4.dhcp-send-hostname`,
# now superseded by `dhcp-send-hostname-v2`). Asking for the exact key the
# user listed always works, deprecated or not.
- name: Connections | Query current value for each managed setting
  ansible.builtin.command:
    cmd: 'nmcli -t -f {{ item.key | quote }} connection show {{ item.conn_name | quote }}'
  loop: "{{ __nm_settings_flat | default([]) }}"
  loop_control:
    label: "{{ item.conn_name }}/{{ item.key }}"
  register: __nm_settings_query
  changed_when: false
  # nmcli may fail if NetworkManager is not running or the key is unknown
  failed_when: false
  check_mode: false

# Two preprocessing steps before comparing stored vs desired:
#   1. nmcli -t mode prefixes literal `\` and `:` in values with a backslash;
#      unescape with regex `\\(.)` -> `\1` so MAC addresses (and any value
#      containing colons) compare correctly.
#   2. nmcli normalizes ternary-boolean inputs on store: writing "yes"
#      results in stored value "1", "no" -> "0", "default" -> "-1".
#      Map both sides through the same lookup table so the user can write
#      either form interchangeably and idempotence still holds.
- name: Connections | Compute settings delta (entries needing change)
  vars:
    __nm_bool_norm:
      'yes': '1'
      'true': '1'
      '1': '1'
      'no': '0'
      'false': '0'
      '0': '0'
      'default': '-1'
      'unknown': '-1'
      '-1': '-1'
    __nm_current_raw: >-
      {{ item.stdout | default('')
         | regex_replace('^[^:]+:', '')
         | regex_replace('\\\\(.)', '\\1') }}
    __nm_desired_raw: "{{ item.item.value | string }}"
  ansible.builtin.set_fact:
    __nm_settings_delta: >-
      {{ __nm_settings_delta | default([])
         + ([item.item] if __nm_bool_norm.get(__nm_current_raw | lower, __nm_current_raw)
                        != __nm_bool_norm.get(__nm_desired_raw | lower, __nm_desired_raw)
            else []) }}
  loop: "{{ __nm_settings_query.results | default([]) }}"
  loop_control:
    label: "{{ item.item.conn_name }}/{{ item.item.key }}"

- name: Connections | Apply settings delta per connection
  ansible.builtin.command:
    argv: >-
      {{ ['nmcli', 'connection', 'modify', item.0]
         + (item.1 | map(attribute='key')
                   | zip(item.1 | map(attribute='value') | map('string') | list)
                   | flatten | list) }}
  loop: "{{ __nm_settings_delta | default([]) | groupby('conn_name') }}"
  loop_control:
    label: "{{ item.0 }}"
  changed_when: true
  notify: Reload NetworkManager connections
  register: __nm_settings_modify_result

- name: Connections | Ensure NetworkManager VPN connections exist
  community.general.nmcli:
    type: vpn
    conn_name: "{{ item.key }}"
    vpn: "{{ item.value.vpn | default({}) }}"
    autoconnect: "{{ item.value.autoconnect | default(true) }}"
    state: "{{ item.value.state | default('present') }}"
  loop: "{{ networkmanager_connections.vpn | dict2items | default([]) }}"
  no_log: true
  register: vpn_connections_result

- name: Connections | Initialize all_network_connections
  ansible.builtin.set_fact:
    all_network_connections:
      ethernet: {}
      wifi: {}
      vpn: {}

- name: Connections | Get UUIDs for connections
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f connection.uuid connection show "{{ item.item.key }}" | cut -d":" -f2
  args:
    executable: /bin/bash
  loop: >-
    {{
      (ethernet_connections_result.results | default([])) +
      (wifi_connections_result.results | default([]))
    }}
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.value.state | default("present") == "present"
  register: all_uuids
  changed_when: false
  # nmcli may fail if NetworkManager is not running or no connections exist
  failed_when: false
  # Read-only lookup, must run under --check so downstream templates have UUIDs.
  check_mode: false

- name: Connections | Add type to UUID results
  ansible.builtin.set_fact:
    all_uuids_with_type: >-
      {{
        all_uuids_with_type | default([]) + [
          item | combine({
            'type': 'wifi' if item.item.item.value.ssid is defined else 'ethernet'
          })
        ]
      }}
  loop: "{{ all_uuids.results }}"
  loop_control:
    label: "{{ item.item.item.key }}"

- name: Connections | Collect connection details with UUIDs
  ansible.builtin.set_fact:
    all_network_connections: >-
      {{
        all_network_connections | combine({
          item.type: all_network_connections[item.type] | combine({
            item.item.item.key: item.item.item.value | combine({
              "type": item.type,
              "uuid": item.stdout | trim
            })
          })
        }, recursive=true)
      }}
  loop: "{{ all_uuids_with_type | default([]) }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - item.rc == 0
    - item.stdout is defined
    - item.stdout | trim | length > 0

- name: Connections | Get UUIDs for VPN connections
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f connection.uuid connection show "{{ item.item.key }}" | cut -d":" -f2
  args:
    executable: /bin/bash
  loop: "{{ vpn_connections_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.value.state | default("present") == "present"
  register: vpn_uuids
  changed_when: false
  # nmcli may fail if NetworkManager is not running or no connections exist
  failed_when: false
  # Read-only lookup, must run under --check so downstream templates have UUIDs.
  check_mode: false

- name: Connections | Collect VPN connection details
  ansible.builtin.set_fact:
    all_network_connections: >-
      {{
        all_network_connections | combine({
          "vpn": all_network_connections.vpn | combine({
            item.item.item.key: item.item.item.value | combine({
              "type": "vpn",
              "name": item.item.item.key,
              "uuid": item.stdout | trim
            })
          })
        }, recursive=true)
      }}
  loop: "{{ vpn_uuids.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - vpn_uuids.results is defined
    - vpn_uuids.results | length > 0
    - item.rc == 0
    - item.stdout is defined
    - item.stdout | trim | length > 0

- name: Connections | Build expected present-state connection name sets
  ansible.builtin.set_fact:
    __nm_expected_ethernet_names: >-
      {{ (networkmanager_connections.ethernet | default({}) | dict2items
          | rejectattr('value.state', 'defined') | map(attribute='key') | list)
         + (networkmanager_connections.ethernet | default({}) | dict2items
            | selectattr('value.state', 'defined')
            | selectattr('value.state', 'equalto', 'present')
            | map(attribute='key') | list) }}
    __nm_expected_wifi_names: >-
      {{ (networkmanager_connections.wifi | default({}) | dict2items
          | rejectattr('value.state', 'defined') | map(attribute='key') | list)
         + (networkmanager_connections.wifi | default({}) | dict2items
            | selectattr('value.state', 'defined')
            | selectattr('value.state', 'equalto', 'present')
            | map(attribute='key') | list) }}
    __nm_expected_vpn_names: >-
      {{ (networkmanager_connections.vpn | default({}) | dict2items
          | rejectattr('value.state', 'defined') | map(attribute='key') | list)
         + (networkmanager_connections.vpn | default({}) | dict2items
            | selectattr('value.state', 'defined')
            | selectattr('value.state', 'equalto', 'present')
            | map(attribute='key') | list) }}

# Defense in depth: catches cases the check_mode: false patch on the UUID
# lookup tasks does not cover (e.g. nmcli daemon down, connection not yet
# created on first install, race conditions during configure).
- name: Connections | Verify UUIDs were collected for all configured connections
  ansible.builtin.assert:
    that:
      - __nm_expected_ethernet_names
        | difference(all_network_connections.ethernet.keys() | list)
        | length == 0
      - __nm_expected_wifi_names
        | difference(all_network_connections.wifi.keys() | list)
        | length == 0
      - __nm_expected_vpn_names
        | difference(all_network_connections.vpn.keys() | list)
        | length == 0
    fail_msg: >-
      UUID enumeration failed for one or more configured NM connections.
      Missing ethernet: {{ __nm_expected_ethernet_names
        | difference(all_network_connections.ethernet.keys() | list) | list }}.
      Missing wifi: {{ __nm_expected_wifi_names
        | difference(all_network_connections.wifi.keys() | list) | list }}.
      Missing vpn: {{ __nm_expected_vpn_names
        | difference(all_network_connections.vpn.keys() | list) | list }}.
      Run `nmcli connection show` on the target host to investigate.

- name: Connections | Build VPN UUID list for Ethernet connections
  ansible.builtin.set_fact:
    vpn_uuids_for_connection: >-
      {{ item.value.vpn
         | map('extract', all_network_connections.vpn)
         | map(attribute='uuid') | join(',') }}
  loop: "{{ networkmanager_connections.ethernet | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.vpn is defined
    - item.value.vpn | length > 0
    - item.value.state | default('present') == 'present'
  register: ethernet_vpn_uuid_list

- name: Connections | Check current connection.secondaries for Ethernet connections
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f connection.secondaries connection show "{{ item.item.key }}" | cut -d: -f2
  args:
    executable: /bin/bash
  loop: "{{ ethernet_vpn_uuid_list.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not item.skipped | default(false)
    - item.ansible_facts is defined
    - item.ansible_facts.vpn_uuids_for_connection is defined
  register: current_ethernet_secondaries
  changed_when: false
  # nmcli may fail if NetworkManager is not running or no connections exist
  failed_when: false

- name: Connections | Configure VPN auto-connect via connection.secondaries for Ethernet connections
  ansible.builtin.command:
    cmd: >-
      nmcli connection modify "{{ item.item.item.key }}"
      connection.secondaries
      "{{ item.item.ansible_facts.vpn_uuids_for_connection }}"
  loop: "{{ current_ethernet_secondaries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - not item.skipped | default(false)
    - item.stdout | trim != item.item.ansible_facts.vpn_uuids_for_connection
  changed_when: true
  register: __nm_eth_secondaries_result

- name: Connections | Build VPN UUID list for WiFi connections
  ansible.builtin.set_fact:
    vpn_uuids_for_connection: >-
      {{ item.value.vpn
         | map('extract', all_network_connections.vpn)
         | map(attribute='uuid') | join(',') }}
  loop: "{{ networkmanager_connections.wifi | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.vpn is defined
    - item.value.vpn | length > 0
    - item.value.state | default('present') == 'present'
  register: wifi_vpn_uuid_list

- name: Connections | Check current connection.secondaries for WiFi connections
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f connection.secondaries connection show "{{ item.item.key }}" | cut -d: -f2
  args:
    executable: /bin/bash
  loop: "{{ wifi_vpn_uuid_list.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not item.skipped | default(false)
    - item.ansible_facts is defined
    - item.ansible_facts.vpn_uuids_for_connection is defined
  register: current_wifi_secondaries
  changed_when: false
  # nmcli may fail if NetworkManager is not running or no connections exist
  failed_when: false

- name: Connections | Configure VPN auto-connect via connection.secondaries for WiFi connections
  ansible.builtin.command:
    cmd: >-
      nmcli connection modify "{{ item.item.item.key }}"
      connection.secondaries
      "{{ item.item.ansible_facts.vpn_uuids_for_connection }}"
  loop: "{{ current_wifi_secondaries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - not item.skipped | default(false)
    - item.stdout | trim != item.item.ansible_facts.vpn_uuids_for_connection
  changed_when: true
  register: __nm_wifi_secondaries_result

# `community.general.nmcli` and direct `nmcli connection modify` calls persist
# profile changes but do not push them to the live interface state. `nmcli
# device reapply` applies most settings (incl. ipv4.dns-search, cloned-mac,
# dhcp-send-hostname) without disrupting the active connection. "Device not
# active" / "not found" are expected when the device is down or absent and
# are silently ignored. We collect changed ifnames from every modify site,
# dedup, and reapply each device exactly once.

- name: Connections | Collect ifnames needing reapply (ethernet configure)
  ansible.builtin.set_fact:
    __nm_reapply_ifnames: >-
      {{ __nm_reapply_ifnames | default([])
         + ([item.item.value.ifname] if (item.changed | default(false)
                                         and item.item.value.ifname is defined)
            else []) }}
  loop: "{{ ethernet_connections_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Connections | Collect ifnames needing reapply (wifi configure)
  ansible.builtin.set_fact:
    __nm_reapply_ifnames: >-
      {{ __nm_reapply_ifnames | default([])
         + ([item.item.value.ifname] if (item.changed | default(false)
                                         and item.item.value.ifname is defined)
            else []) }}
  loop: "{{ wifi_connections_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Connections | Collect ifnames needing reapply (settings modify)
  ansible.builtin.set_fact:
    __nm_reapply_ifnames: >-
      {{ __nm_reapply_ifnames | default([])
         + ([item.item.1[0].ifname] if (item.changed | default(false)
                                        and item.item.1[0].ifname | length > 0)
            else []) }}
  loop: "{{ __nm_settings_modify_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0 }}"

- name: Connections | Collect ifnames needing reapply (ethernet secondaries)
  ansible.builtin.set_fact:
    __nm_reapply_ifnames: >-
      {{ __nm_reapply_ifnames | default([])
         + ([item.item.item.item.value.ifname]
            if (item.changed | default(false)
                and item.item.item.item.value.ifname is defined)
            else []) }}
  loop: "{{ __nm_eth_secondaries_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.item.key | default('') }}"

- name: Connections | Collect ifnames needing reapply (wifi secondaries)
  ansible.builtin.set_fact:
    __nm_reapply_ifnames: >-
      {{ __nm_reapply_ifnames | default([])
         + ([item.item.item.item.value.ifname]
            if (item.changed | default(false)
                and item.item.item.item.value.ifname is defined)
            else []) }}
  loop: "{{ __nm_wifi_secondaries_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.item.key | default('') }}"

- name: Connections | Reapply NetworkManager devices for live changes
  ansible.builtin.command:
    cmd: 'nmcli device reapply {{ item }}'
  loop: "{{ __nm_reapply_ifnames | default([]) | unique | list }}"
  register: __nm_reapply_result
  changed_when: false
  failed_when:
    - __nm_reapply_result.rc | default(0) != 0
    - "'not active' not in (__nm_reapply_result.stderr | default(''))"
    - "'not activated' not in (__nm_reapply_result.stderr | default(''))"
    - "'not found' not in (__nm_reapply_result.stderr | default(''))"
