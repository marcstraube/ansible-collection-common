---
# =============================================================================
# Base System Tasks
# =============================================================================
# Task file for base system configuration — single source of truth.
# Import it from a play with `ansible.builtin.import_tasks`.
#
# Each role's defaults/main.yml decides whether it runs (`<role>_enabled`).
# Override per host/group via inventory. See each role's defaults/main.yml
# for available variables.
#
# Tag scheme:
#   base-system     All roles in this file
#   security        Security roles only (sysctl through hardware_tokens)
#   <role-name>     Individual role (e.g., firewalld, docker)
#   <role>:<phase>  Role sub-stage (e.g., openssh:configure, docker:install)
#
# Roles are imported statically (import_role) so their internal sub-tags are
# exposed to --tags / --list-tags. Run `ansible-playbook … --list-tags` to see
# the full set. Dynamic include_role would hide sub-tags behind the include.
#
# The import condition reads the role toggle without a default(): under
# import_role the condition is evaluated with the role defaults in scope, so a
# playbook default() would never apply.
# =============================================================================

#
# Core System
#

- name: Base System | Import package_management role
  ansible.builtin.import_role:
    name: marcstraube.common.package_management
  tags:
    - base-system
    - package-management
  when: package_management_enabled | bool

- name: Base System | Import base role
  ansible.builtin.import_role:
    name: marcstraube.common.base
  tags:
    - base-system
    - base
  when: base_enabled | bool

- name: Base System | Import users role
  ansible.builtin.import_role:
    name: marcstraube.common.users
  tags:
    - base-system
    - users
  when: users_enabled | bool

# After users: mount points may be owned by accounts the users role creates.
- name: Base System | Import storage role
  ansible.builtin.import_role:
    name: marcstraube.common.storage
  tags:
    - base-system
    - storage
  when: storage_enabled | bool

- name: Base System | Import sudo role
  ansible.builtin.import_role:
    name: marcstraube.common.sudo
  tags:
    - base-system
    - sudo
  when: sudo_enabled | bool

